          /** The Tools panel: one switch per tool and per search engine, built from plain Android views. */
          object ToolPanel {
            private fun activityOf(ctx: Context): Activity? {
              var c: Context? = ctx
              while (c is ContextWrapper) {
                if (c is Activity) return c
                c = c.baseContext
              }
              return null
            }

            private fun header(act: Activity, text: String, pad: Int): TextView {
              val h = TextView(act)
              h.text = text
              h.textSize = 14f
              h.setTypeface(Typeface.DEFAULT_BOLD)
              h.setPadding(0, pad, 0, pad / 3)
              return h
            }

            private fun note(act: Activity, text: String, size: Float, pad: Int): TextView {
              val n = TextView(act)
              n.text = text
              n.textSize = size
              n.alpha = 0.65f
              n.setPadding(0, 0, 0, pad / 2)
              return n
            }

            /** [onChanged] runs when the panel closes, so the caller can refresh its tool count. */
            fun show(ctx: Context, onChanged: () -> Unit = {}) {
              val act = activityOf(ctx) ?: return
              val pad = (16 * act.resources.displayMetrics.density).toInt()
              val box = LinearLayout(act)
              box.orientation = LinearLayout.VERTICAL
              box.setPadding(pad, pad / 2, pad, 0)
              box.addView(note(act, "Changes apply to your next new chat. Small models work best with few or no tools.", 13f, pad))
              val center = android.widget.Button(act)
              center.text = "Agent Center: activity history, STOP"
              center.setOnClickListener {
                try {
                  act.startActivity(android.content.Intent().setClassName(act.packageName, "com.google.ai.edge.gallery.foundation.AgentCenterActivity"))
                } catch (_: Throwable) {}
              }
              box.addView(center)
              val toolSwitches = mutableListOf<Switch>()
              var group = ""
              for (t in ToolPrefs.TOGGLES) {
                if (t.group != group) {
                  group = t.group
                  box.addView(header(act, group, pad))
                }
                val sw = Switch(act)
                sw.text = t.title
                sw.textSize = 16f
                sw.isChecked = ToolPrefs.isOn(act, t.id)
                sw.setOnCheckedChangeListener { _, on -> ToolPrefs.set(act, t.id, on) }
                box.addView(sw)
                box.addView(note(act, t.about, 12f, pad))
                toolSwitches.add(sw)
              }
              box.addView(header(act, "Search engines (tried in this order until one answers)", pad))
              for (e in SearchEngines.ALL) {
                val sw = Switch(act)
                sw.text = e.title
                sw.textSize = 16f
                sw.isChecked = ToolPrefs.engineOn(act, e.id)
                sw.setOnCheckedChangeListener { _, on -> ToolPrefs.setEngine(act, e.id, on) }
                box.addView(sw)
                box.addView(note(act, e.about, 12f, pad))
              }
              val scroll = ScrollView(act)
              scroll.addView(box)
              val dlg =
                AlertDialog.Builder(act, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                  .setTitle("Tools for the model")
                  .setView(scroll)
                  .setPositiveButton("Done", null)
                  .setNeutralButton("All tools on", null)
                  .setNegativeButton("All tools off", null)
                  .setOnDismissListener { onChanged() }
                  .create()
              dlg.show()
              dlg.getButton(AlertDialog.BUTTON_NEUTRAL).setOnClickListener { toolSwitches.forEach { it.isChecked = true } }
              dlg.getButton(AlertDialog.BUTTON_NEGATIVE).setOnClickListener { toolSwitches.forEach { it.isChecked = false } }
            }
          }
