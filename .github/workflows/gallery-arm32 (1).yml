          cat > "$BASE/foundation/BrowserHub.kt" <<'KT'
          package com.google.ai.edge.gallery.foundation

          import android.annotation.SuppressLint
          import android.content.Context
          import android.os.Handler
          import android.os.Looper
          import android.view.ViewGroup
          import android.webkit.JsResult
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicReference

          /**
           * One WebView the agent can drive (open, read, click, type). It works without being on screen;
           * BrowserActivity attaches it to the screen so you can watch and take over.
           */
          object BrowserHub {
            private val main = Handler(Looper.getMainLooper())
            @Volatile private var web: WebView? = null
            @Volatile private var loadLatch: CountDownLatch? = null
            @Volatile var currentUrl: String = ""
              private set

            private fun <T> onMain(timeoutMs: Long = 30000, block: () -> T): T {
              if (Looper.myLooper() == Looper.getMainLooper()) return block()
              val ok = AtomicReference<Any?>()
              val err = AtomicReference<Throwable?>()
              val done = CountDownLatch(1)
              main.post {
                try {
                  ok.set(block())
                } catch (t: Throwable) {
                  err.set(t)
                } finally {
                  done.countDown()
                }
              }
              if (!done.await(timeoutMs, TimeUnit.MILLISECONDS)) throw IllegalStateException("browser timed out")
              err.get()?.let { throw it }
              @Suppress("UNCHECKED_CAST")
              return ok.get() as T
            }

            @SuppressLint("SetJavaScriptEnabled")
            private fun view(ctx: Context): WebView {
              web?.let { return it }
              val v = WebView(ctx.applicationContext)
              v.settings.javaScriptEnabled = true
              v.settings.domStorageEnabled = true
              v.settings.loadWithOverviewMode = true
              v.settings.useWideViewPort = true
              v.settings.userAgentString =
                "Mozilla/5.0 (Linux; Android 10; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36"
              v.webViewClient =
                object : WebViewClient() {
                  override fun onPageFinished(view: WebView?, url: String?) {
                    currentUrl = url ?: ""
                    loadLatch?.countDown()
                  }
                }
              v.webChromeClient =
                object : WebChromeClient() {
                  override fun onJsAlert(view: WebView?, url: String?, message: String?, result: JsResult?): Boolean {
                    result?.confirm()
                    return true
                  }

                  override fun onJsConfirm(view: WebView?, url: String?, message: String?, result: JsResult?): Boolean {
                    result?.confirm()
                    return true
                  }
                }
              // Give an off-screen WebView a real size so layout-based checks (visible elements) work.
              v.layout(0, 0, 1080, 2000)
              web = v
              return v
            }

            fun attach(ctx: Context, container: ViewGroup) {
              onMain {
                val v = view(ctx)
                (v.parent as? ViewGroup)?.removeView(v)
                container.addView(
                  v,
                  ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT),
                )
              }
            }

            fun detach() {
              main.post {
                val v = web ?: return@post
                (v.parent as? ViewGroup)?.removeView(v)
                v.layout(0, 0, 1080, 2000)
              }
            }

            fun goBack(ctx: Context) {
              onMain {
                val v = view(ctx)
                if (v.canGoBack()) v.goBack()
              }
            }

            fun open(ctx: Context, url: String): String {
              val u = if (url.startsWith("http://") || url.startsWith("https://")) url else "https://$url"
              val latch = CountDownLatch(1)
              loadLatch = latch
              onMain { view(ctx).loadUrl(u) }
              val finished = latch.await(25, TimeUnit.SECONDS)
              Thread.sleep(700)
              val title = eval(ctx, "document.title")
              return (if (finished) "Loaded" else "Still loading (timeout)") + ": " + title + " | " + currentUrl
            }

            /** Runs JavaScript and returns the result as plain text. */
            fun eval(ctx: Context, js: String, timeoutMs: Long = 15000): String {
              val latch = CountDownLatch(1)
              val out = AtomicReference<String?>()
              onMain {
                view(ctx).evaluateJavascript(js) { value ->
                  out.set(value)
                  latch.countDown()
                }
              }
              if (!latch.await(timeoutMs, TimeUnit.MILLISECONDS)) return "error: javascript timed out"
              val raw = out.get() ?: return ""
              if (raw == "null") return ""
              return try {
                JSONArray("[$raw]").get(0).toString()
              } catch (_: Throwable) {
                raw
              }
            }

            fun readText(ctx: Context, maxChars: Int = 6000): String {
              val t = eval(ctx, "document.body ? document.body.innerText : ''")
              val clean = t.lines().map { it.trim() }.filter { it.isNotEmpty() }.joinToString("\n")
              return if (clean.length > maxChars) clean.take(maxChars) + "\n[truncated, ${clean.length} chars total]" else clean
            }

            fun elements(ctx: Context): String {
              val js =
                """(function(){document.querySelectorAll('[data-aid]').forEach(function(x){x.removeAttribute('data-aid')});
          var els=document.querySelectorAll('a[href],button,input,textarea,select,[role=button],[onclick]');var out=[];var n=0;
          for(var i=0;i<els.length&&n<60;i++){var e=els[i];var r=e.getBoundingClientRect();if(r.width<2||r.height<2)continue;
          var st=getComputedStyle(e);if(st.visibility==='hidden'||st.display==='none')continue;e.setAttribute('data-aid',n);
          var t=(e.innerText||e.value||e.placeholder||e.getAttribute('aria-label')||e.title||'').trim().replace(/\s+/g,' ').slice(0,60);
          out.push(n+': '+e.tagName.toLowerCase()+(e.type?'['+e.type+']':'')+' "'+t+'"'+(e.href?' -> '+String(e.href).slice(0,100):''));n++;}
          return out.join('\n');})()"""
              val r = eval(ctx, js)
              return if (r.isBlank()) "(no visible interactive elements)" else r
            }

            fun click(ctx: Context, id: Int): String {
              val js =
                "(function(){var e=document.querySelector('[data-aid=\"$id\"]');" +
                  "if(!e)return 'no element with that id - call browser_elements again';" +
                  "e.scrollIntoView({block:'center'});e.click();return 'clicked';})()"
              val r = eval(ctx, js)
              Thread.sleep(1200)
              return r
            }

            fun type(ctx: Context, id: Int, text: String, submit: Boolean): String {
              val q = JSONObject.quote(text)
              val js =
                "(function(){var e=document.querySelector('[data-aid=\"$id\"]');" +
                  "if(!e)return 'no element with that id - call browser_elements again';" +
                  "e.focus();var proto=e.tagName==='TEXTAREA'?HTMLTextAreaElement.prototype:HTMLInputElement.prototype;" +
                  "var d=Object.getOwnPropertyDescriptor(proto,'value');if(d&&d.set){d.set.call(e,$q);}else{e.value=$q;}" +
                  "e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));" +
                  "if($submit){var f=e.form;if(f){if(f.requestSubmit){f.requestSubmit();}else{f.submit();}}else{" +
                  "e.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',keyCode:13,bubbles:true}));}}return 'typed';})()"
              val r = eval(ctx, js)
              if (submit) Thread.sleep(1500)
              return r
            }

            fun scroll(ctx: Context, pixels: Int): String = eval(ctx, "window.scrollBy(0,$pixels);'scrolled'")
          }
          KT
