          package com.google.ai.edge.gallery.foundation

          /**
           * Bridge for specialist models (ASR, TTS, classifier, detector, segmenter, embedding ...).
           * A native mod (.so dropped in the mods folder, no rebuild) implements this JNI function:
           *   jbyteArray Java_com_google_ai_edge_gallery_foundation_NativeBackends_invoke(
           *       JNIEnv*, jclass, jstring role, jstring modelPath, jbyteArray input)
           */
          object NativeBackends {
            @JvmStatic external fun invoke(role: String, modelPath: String, input: ByteArray): ByteArray

            /** Returns the output bytes, or null when no mod provides the bridge. */
            fun call(role: String, modelPath: String, input: ByteArray): ByteArray? =
              try {
                invoke(role, modelPath, input)
              } catch (_: UnsatisfiedLinkError) {
                null
              }
