          package com.google.ai.edge.gallery.foundation

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File

          object Prefs {
            private fun sp(ctx: Context) = ctx.getSharedPreferences("foundation", Context.MODE_PRIVATE)

            fun serviceEnabled(ctx: Context): Boolean = sp(ctx).getBoolean("service", false)

            fun setServiceEnabled(ctx: Context, v: Boolean) = sp(ctx).edit().putBoolean("service", v).apply()

            fun keepAwake(ctx: Context): Boolean = sp(ctx).getBoolean("awake", true)

            fun setKeepAwake(ctx: Context, v: Boolean) = sp(ctx).edit().putBoolean("awake", v).apply()

            fun activeBundle(ctx: Context): String = sp(ctx).getString("bundle", "") ?: ""

            fun setActiveBundle(ctx: Context, v: String) = sp(ctx).edit().putString("bundle", v).apply()
          }

          /** kind: shell | search | fetch | agent. payload is the command, query, URL or prompt. */
          data class Job(
            val id: String,
            val name: String,
            val kind: String,
            val payload: String,
            val everyMinutes: Int,
            val bundle: String = "",
            val enabled: Boolean = true,
            val lastRunMs: Long = 0,
            val lastResult: String = "",
          )

          object JobStore {
            private fun file(ctx: Context) = File(ctx.filesDir, "foundation/jobs.json")

            @Synchronized
            fun all(ctx: Context): List<Job> {
              val f = file(ctx)
              if (!f.isFile) return emptyList()
              return try {
                val arr = JSONArray(f.readText())
                (0 until arr.length()).map { i ->
                  val o = arr.getJSONObject(i)
                  Job(
                    id = o.getString("id"),
                    name = o.optString("name"),
                    kind = o.optString("kind"),
                    payload = o.optString("payload"),
                    everyMinutes = o.optInt("everyMinutes", 60),
                    bundle = o.optString("bundle"),
                    enabled = o.optBoolean("enabled", true),
                    lastRunMs = o.optLong("lastRunMs", 0),
                    lastResult = o.optString("lastResult"),
                  )
                }
              } catch (_: Throwable) {
                emptyList()
              }
            }

            @Synchronized
            fun save(ctx: Context, jobs: List<Job>) {
              val arr = JSONArray()
              for (j in jobs) {
                arr.put(
                  JSONObject()
                    .put("id", j.id).put("name", j.name).put("kind", j.kind).put("payload", j.payload)
                    .put("everyMinutes", j.everyMinutes).put("bundle", j.bundle).put("enabled", j.enabled)
                    .put("lastRunMs", j.lastRunMs).put("lastResult", j.lastResult)
                )
              }
              val f = file(ctx)
              f.parentFile?.mkdirs()
              f.writeText(arr.toString())
            }

            @Synchronized
            fun upsert(ctx: Context, job: Job) {
              val cur = all(ctx).toMutableList()
              val i = cur.indexOfFirst { it.id == job.id }
              if (i >= 0) cur[i] = job else cur.add(job)
              save(ctx, cur)
            }

            @Synchronized
            fun remove(ctx: Context, id: String) = save(ctx, all(ctx).filter { it.id != id })

            fun newId(): String = java.lang.Long.toString(System.currentTimeMillis(), 36)
          }

          object Notifier {
            private const val CH_ONGOING = "agents_ongoing"
            private const val CH_RESULTS = "agents_results"
            private const val CH_ALERTS = "agents_alerts"
            const val ONGOING_ID = 7001

            private fun mgr(ctx: Context) = ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager

            private fun ensureChannels(ctx: Context) {
              val m = mgr(ctx)
              m.createNotificationChannel(NotificationChannel(CH_ONGOING, "Agents running", NotificationManager.IMPORTANCE_LOW))
              m.createNotificationChannel(NotificationChannel(CH_RESULTS, "Agent results", NotificationManager.IMPORTANCE_DEFAULT))
              m.createNotificationChannel(NotificationChannel(CH_ALERTS, "Agent alerts", NotificationManager.IMPORTANCE_HIGH))
            }

            private fun openCenter(ctx: Context): android.app.PendingIntent {
              val i = android.content.Intent().setClassName(ctx.packageName, "com.google.ai.edge.gallery.foundation.AgentCenterActivity")
              i.addFlags(android.content.Intent.FLAG_ACTIVITY_NEW_TASK)
              return android.app.PendingIntent.getActivity(
                ctx, 11, i, android.app.PendingIntent.FLAG_UPDATE_CURRENT or android.app.PendingIntent.FLAG_IMMUTABLE)
            }

            private fun stopAction(ctx: Context): Notification.Action {
              val i = android.content.Intent(ctx, EmergencyReceiver::class.java).setAction(EmergencyReceiver.ACTION)
              val pi = android.app.PendingIntent.getBroadcast(
                ctx, 12, i, android.app.PendingIntent.FLAG_UPDATE_CURRENT or android.app.PendingIntent.FLAG_IMMUTABLE)
              val icon = android.graphics.drawable.Icon.createWithResource(ctx, android.R.drawable.ic_delete)
              return Notification.Action.Builder(icon, "STOP ALL", pi).build()
            }

            /** Loud notification for something the user should look at right now (risky command, emergency stop). */
            fun alert(ctx: Context, title: String, text: String) {
              ensureChannels(ctx)
              val n =
                Notification.Builder(ctx, CH_ALERTS)
                  .setSmallIcon(android.R.drawable.stat_sys_warning)
                  .setContentTitle(title)
                  .setContentText(text)
                  .setStyle(Notification.BigTextStyle().bigText(text))
                  .setContentIntent(openCenter(ctx))
                  .setAutoCancel(true)
                  .build()
              mgr(ctx).notify((System.currentTimeMillis() % 100000).toInt() + 200000, n)
            }

            fun ongoing(ctx: Context, title: String, text: String): Notification {
              ensureChannels(ctx)
              return Notification.Builder(ctx, CH_ONGOING)
                .setSmallIcon(android.R.drawable.stat_notify_sync)
                .setContentTitle(title)
                .setContentText(text)
                .setOngoing(true)
                .setStyle(Notification.BigTextStyle().bigText(text))
                .setContentIntent(openCenter(ctx))
                .addAction(stopAction(ctx))
                .build()
            }

            fun updateOngoing(ctx: Context, title: String, text: String) =
              mgr(ctx).notify(ONGOING_ID, ongoing(ctx, title, text))

            fun result(ctx: Context, title: String, text: String) {
              ensureChannels(ctx)
              val n =
                Notification.Builder(ctx, CH_RESULTS)
                  .setSmallIcon(android.R.drawable.stat_notify_chat)
                  .setContentTitle(title)
                  .setContentText(text)
                  .setStyle(Notification.BigTextStyle().bigText(text))
                  .setAutoCancel(true)
                  .build()
              mgr(ctx).notify((System.currentTimeMillis() % 100000).toInt() + 100, n)
            }
          }
