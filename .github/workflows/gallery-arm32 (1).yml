      # Safety + comfort layer: audit log of every tool call (private folder the model cannot reach),
      # live notification of what the background agent is doing with a STOP ALL button, loud alerts for
      # risky shell commands, emergency stop (kills sandbox processes, disables jobs, locks tools), the
      # Agent Center screen, a Run / Preview window for HTML the model writes (chat and Agent tab), and
      # a local-server preview of anything running inside the sandbox.
      - name: Add audit log, emergency stop, Agent Center and HTML preview
        run: |
          set -euo pipefail
          SRC=gallery/Android/src/app/src/main
          BASE="$SRC/java/com/google/ai/edge/gallery"
          mkdir -p "$BASE/foundation" "$BASE/sandbox" "$SRC/res/xml"
          cat > "$BASE/foundation/AuditLog.kt" <<'KT'
          package com.google.ai.edge.gallery.foundation

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import com.google.ai.edge.gallery.sandbox.ProcRegistry
          import org.json.JSONObject
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          /**
           * Append-only record of everything the AI did with its tools (web searches, shell commands, pages
           * opened, files written, jobs). It lives in the app's private folder, which the model's file tools
           * and the proot sandbox cannot reach, so a misbehaving model cannot edit or delete it.
           */
          object Audit {
            data class Entry(val t: Long, val src: String, val tool: String, val detail: String, val risky: Boolean) {
              fun line(): String =
                SimpleDateFormat("MM-dd HH:mm:ss", Locale.US).format(Date(t)) +
                  (if (risky) " !! " else "  ") + "[" + src + "] " + tool + ": " + detail
            }

            /** "chat" for conversations, "job:<name>" while a background job runs, "user" for what you typed. */
            @Volatile var source: String = "chat"

            private const val MAX_BYTES = 5L * 1024 * 1024

            private val riskyCmd =
              Regex(
                "(rm\\s+-[a-z]*[rf]|mkfs|dd\\s+if=|chmod\\s+[0-7]*7[0-7]*\\s|:\\(\\)\\s*\\{|curl[^|]*\\|\\s*(ba)?sh|wget[^|]*\\|\\s*(ba)?sh" +
                  "|nc\\s+-[a-z]*e|/dev/(sd|block|mem)|>\\s*/dev/|shutdown|reboot|pm\\s+uninstall|su\\s+-c|passwd|ssh\\s|scp\\s)",
                RegexOption.IGNORE_CASE,
              )

            private fun dir(ctx: Context): File = File(ctx.filesDir, "audit").apply { mkdirs() }

            fun file(ctx: Context): File = File(dir(ctx), "audit.log")

            fun log(ctx: Context, tool: String, detail: String) = logAs(ctx, source, tool, detail)

            @Synchronized
            fun logAs(ctx: Context, src: String, tool: String, detail: String) {
              val isCommand = tool == "runShell" || tool == "job:shell" || tool == "browserRunJs"
              val risky = isCommand && src != "user" && riskyCmd.containsMatchIn(detail)
              try {
                val f = file(ctx)
                if (f.length() > MAX_BYTES) {
                  val old = File(dir(ctx), "audit.1.log")
                  old.delete()
                  f.renameTo(old)
                }
                val o =
                  JSONObject().put("t", System.currentTimeMillis()).put("src", src).put("tool", tool)
                    .put("detail", detail.take(4000)).put("risky", risky)
                f.appendText(o.toString() + "\n")
              } catch (_: Throwable) {}
              if (src == "user") return
              try {
                if (risky) Notifier.alert(ctx, "Agent ran a risky command", detail.take(300))
                if (Prefs.serviceEnabled(ctx)) Notifier.updateOngoing(ctx, "Agent: $tool", detail.take(120))
              } catch (_: Throwable) {}
            }

            private fun parse(line: String): Entry? =
              try {
                val o = JSONObject(line)
                Entry(o.getLong("t"), o.optString("src"), o.optString("tool"), o.optString("detail"), o.optBoolean("risky"))
              } catch (_: Throwable) {
                null
              }

            /** Newest first. */
            @Synchronized
            fun readAll(ctx: Context, max: Int = 500): List<Entry> {
              val out = ArrayList<Entry>()
              for (name in listOf("audit.log", "audit.1.log")) {
                val f = File(dir(ctx), name)
                if (!f.isFile) continue
                try {
                  val lines = f.readLines()
                  for (i in lines.indices.reversed()) {
                    parse(lines[i])?.let { out.add(it) }
                    if (out.size >= max) return out
                  }
                } catch (_: Throwable) {}
              }
              return out
            }

            fun exportText(ctx: Context, max: Int = 2000): String =
              readAll(ctx, max).reversed().joinToString("\n") { it.line() }

            @Synchronized
            fun clear(ctx: Context) {
              try {
                dir(ctx).listFiles()?.forEach { it.delete() }
              } catch (_: Throwable) {}
            }
          }

          /** While on, every tool answers with an error. Set by STOP, cleared in the Agent Center. */
          object Lockdown {
            @Volatile var on: Boolean = false

            const val MESSAGE = "Tools are locked because the user pressed STOP. Do not try again."

            private fun sp(ctx: Context) = ctx.getSharedPreferences("foundation", Context.MODE_PRIVATE)

            fun sync(ctx: Context) {
              on = sp(ctx).getBoolean("lockdown", false)
            }

            fun set(ctx: Context, v: Boolean) {
              on = v
              sp(ctx).edit().putBoolean("lockdown", v).apply()
            }
          }

          /** One button that stops everything the AI could be doing. */
          object EmergencyStop {
            fun run(ctx: Context, reason: String) {
              val app = ctx.applicationContext
              Lockdown.set(app, true)
              Audit.logAs(app, "user", "EMERGENCY STOP", reason)
              try { AgentService.stop(app) } catch (_: Throwable) {}
              try { JobStore.save(app, JobStore.all(app).map { it.copy(enabled = false) }) } catch (_: Throwable) {}
              val killed = try { ProcRegistry.killAll() } catch (_: Throwable) { 0 }
              try { ToolPrefs.TOGGLES.forEach { ToolPrefs.set(app, it.id, false) } } catch (_: Throwable) {}
              try {
                Notifier.alert(app, "Agents stopped", "Jobs disabled, tools locked, $killed sandbox process(es) killed. Open Agent Center to unlock.")
              } catch (_: Throwable) {}
            }
          }

          class EmergencyReceiver : BroadcastReceiver() {
            override fun onReceive(context: Context, intent: Intent?) {
              if (intent?.action == ACTION) EmergencyStop.run(context, "STOP ALL button in the notification")
            }

            companion object {
              const val ACTION = "com.google.ai.edge.gallery.EMERGENCY_STOP"
            }
          }
          KT
          cat > "$BASE/sandbox/ProcRegistry.kt" <<'KT'
          package com.google.ai.edge.gallery.sandbox

          /** Every running sandbox process, so the STOP button can kill them all. */
          object ProcRegistry {
            private val procs = java.util.Collections.synchronizedSet(HashSet<Process>())

            fun add(p: Process) {
              procs.add(p)
            }

            fun remove(p: Process) {
              procs.remove(p)
            }

            fun killAll(): Int {
              val copy = synchronized(procs) { procs.toList() }
              copy.forEach {
                try { it.destroyForcibly() } catch (_: Throwable) {}
              }
              procs.clear()
              return copy.size
            }
          }
