          package com.google.ai.edge.gallery.foundation

          import android.content.Context
          import com.google.ai.edge.litertlm.Backend
          import com.google.ai.edge.litertlm.Content
          import com.google.ai.edge.litertlm.Contents
          import com.google.ai.edge.litertlm.ConversationConfig
          import com.google.ai.edge.litertlm.Engine
          import com.google.ai.edge.litertlm.EngineConfig
          import com.google.ai.edge.litertlm.Message
          import com.google.ai.edge.litertlm.tool
          import org.json.JSONObject
          import java.io.File

          /** One model in a bundle. type is "litertlm" (chat/vlm) or "native" (served by a mod). */
          data class Role(val name: String, val type: String, val path: String, val maxTokens: Int)

          data class Bundle(val name: String, val dir: File, val system: String, val roles: Map<String, Role>)

          /**
           * A bundle is a folder <external files>/orchestra/<name>/ holding bundle.json plus model files:
           * {"system":"...","roles":{"chat":{"type":"litertlm","file":"gemma.litertlm"},
           *  "vlm":{"type":"litertlm","file":"vlm.litertlm"},"asr":{"type":"native","file":"asr.bin"}}}
           * The chat model is the brain; every other role is a specialist it can call as a tool.
           * Adding or changing bundles needs no rebuild.
           */
          object Orchestra {
            fun root(ctx: Context): File =
              File(ctx.getExternalFilesDir(null) ?: ctx.filesDir, "orchestra").apply { mkdirs() }

            fun list(ctx: Context): List<Bundle> =
              (root(ctx).listFiles { f -> f.isDirectory } ?: emptyArray()).sortedBy { it.name }
                .mapNotNull { load(ctx, it.name) }

            fun load(ctx: Context, name: String): Bundle? {
              val dir = File(root(ctx), name)
              val f = File(dir, "bundle.json")
              if (!f.isFile) return null
              return try {
                val j = JSONObject(f.readText())
                val rj = j.optJSONObject("roles") ?: return null
                val roles = mutableMapOf<String, Role>()
                val keys = rj.keys()
                while (keys.hasNext()) {
                  val k = keys.next()
                  val o = rj.getJSONObject(k)
                  val file = o.optString("file")
                  val path = if (file.startsWith("/")) file else File(dir, file).path
                  roles[k] = Role(k, o.optString("type", "litertlm"), path, o.optInt("maxTokens", 4096))
                }
                Bundle(name, dir, j.optString("system", ""), roles)
              } catch (_: Throwable) {
                null
              }
            }
          }

          /** Runs one agent turn without any UI: loads the bundle's chat model, lets it use the tools, closes it. */
          class HeadlessAgent(private val ctx: Context, private val bundle: Bundle) : AutoCloseable {
            private var engine: Engine? = null

            fun run(prompt: String): String {
              val chat = bundle.roles["chat"] ?: return "error: the bundle has no chat role"
              if (!File(chat.path).isFile) return "error: chat model file not found: ${chat.path}"
              val e =
                Engine(
                  EngineConfig(
                    modelPath = chat.path,
                    backend = Backend.CPU(),
                    maxNumTokens = chat.maxTokens,
                    cacheDir = ctx.cacheDir.path,
                  )
                )
              engine = e
              e.initialize()
              val specialists = bundle.roles.keys.filter { it != "chat" }
              val base =
                bundle.system.ifBlank {
                  "You are an autonomous agent running on an Android phone. Use your tools to get things done and report results briefly."
                }
              val sys =
                if (specialists.isEmpty()) base
                else base + "\nSpecialist models you can use through call_specialist: " + specialists.joinToString(", ")
              val conv =
                e.createConversation(
                  ConversationConfig(
                    systemInstruction = Contents.of(sys),
                    tools = FoundationTools.all(ctx, bundle).map { tool(it) },
                  )
                )
              try {
                return conv.sendMessage(Message.user(prompt)).toString()
              } finally {
                try { conv.close() } catch (_: Throwable) {}
              }
            }

            override fun close() {
              try { engine?.close() } catch (_: Throwable) {}
              engine = null
            }
          }

          /** Specialist roles other than chat. vlm runs on LiteRT-LM; the rest go through NativeBackends (mods). */
          object Specialists {
            fun call(ctx: Context, bundle: Bundle, role: String, input: String): String {
              val r =
                bundle.roles[role]
                  ?: return "error: no '$role' role in this bundle. Available: ${bundle.roles.keys.joinToString()}"
              return try {
                if (role == "vlm") describeImage(ctx, r, input) else callNative(ctx, r, input)
              } catch (t: Throwable) {
                "error: ${t.message}"
              }
            }

            /** input is a workspace image path, optionally followed by "::" and a question. */
            private fun describeImage(ctx: Context, r: Role, input: String): String {
              val rel = input.substringBefore("::").trim()
              val question = input.substringAfter("::", "Describe this image in detail.").trim()
              val img = Workspace.resolve(ctx, rel) ?: return "error: image path is outside the workspace"
              if (!img.isFile) return "error: image not found in workspace: $rel"
              val e =
                Engine(
                  EngineConfig(
                    modelPath = r.path,
                    backend = Backend.CPU(),
                    visionBackend = Backend.CPU(),
                    maxNumTokens = r.maxTokens,
                    maxNumImages = 1,
                    cacheDir = ctx.cacheDir.path,
                  )
                )
              try {
                e.initialize()
                val conv = e.createConversation()
                try {
                  return conv.sendMessage(Message.user(Contents.of(Content.ImageFile(img.path), Content.Text(question)))).toString()
                } finally {
                  try { conv.close() } catch (_: Throwable) {}
                }
              } finally {
                try { e.close() } catch (_: Throwable) {}
              }
            }

            private fun callNative(ctx: Context, r: Role, input: String): String {
              val textInput = r.name == "tts" || r.name == "embed" || r.name == "embedding"
              val bytes: ByteArray =
                if (textInput) input.toByteArray(Charsets.UTF_8)
                else {
                  val f = Workspace.resolve(ctx, input.trim()) ?: return "error: input path is outside the workspace"
                  if (!f.isFile) return "error: input file not found in workspace: $input"
                  f.readBytes()
                }
              val out =
                NativeBackends.call(r.name, r.path, bytes)
                  ?: return "error: no native mod provides the '${r.name}' backend yet. Drop a .so that implements NativeBackends.invoke into the mods folder and restart the app."
              val looksText = r.name != "tts" && out.none { it.toInt() == 0 }
              if (looksText) return String(out, Charsets.UTF_8).take(4000)
              val ext = if (r.name == "tts") "wav" else "bin"
              val name = "out/${r.name}-${System.currentTimeMillis()}.$ext"
              val f = Workspace.resolve(ctx, name) ?: return "error: cannot write output"
              f.parentFile?.mkdirs()
              f.writeBytes(out)
              return "saved: $name (${out.size} bytes)"
            }
          }
