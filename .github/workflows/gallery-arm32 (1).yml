          package com.google.ai.edge.gallery.foundation

          import android.content.Context
          import android.util.Base64
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLDecoder
          import java.net.URLEncoder

          /** Plain HTTP web search and page fetch (no API key). */
          object Web {
            private const val UA =
              "Mozilla/5.0 (Linux; Android 10; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36"

            data class Hit(val title: String, val url: String, val snippet: String)

            fun get(url: String, timeoutMs: Int = 15000, maxBytes: Int = 1_500_000): String {
              val c = URL(url).openConnection() as HttpURLConnection
              c.connectTimeout = timeoutMs
              c.readTimeout = timeoutMs
              c.instanceFollowRedirects = true
              c.setRequestProperty("User-Agent", UA)
              c.setRequestProperty("Accept-Language", "en-US,en;q=0.9")
              try {
                val out = java.io.ByteArrayOutputStream()
                c.inputStream.use { s ->
                  val buf = ByteArray(16384)
                  while (out.size() < maxBytes) {
                    val n = s.read(buf)
                    if (n < 0) break
                    out.write(buf, 0, n)
                  }
                }
                return String(out.toByteArray(), Charsets.UTF_8)
              } finally {
                c.disconnect()
              }
            }

            private fun decodeEntities(s: String): String =
              s.replace("&amp;", "&").replace("&lt;", "<").replace("&gt;", ">").replace("&quot;", "\"")
                .replace("&#39;", "'").replace("&#x27;", "'").replace("&nbsp;", " ")
                .replace(Regex("&#(\\d+);")) { m -> m.groupValues[1].toIntOrNull()?.toChar()?.toString() ?: "" }

            private fun stripTags(s: String): String =
              decodeEntities(s.replace(Regex("<[^>]+>"), "")).replace(Regex("\\s+"), " ").trim()

            fun htmlToText(html: String): String {
              var s = html
              s = s.replace(Regex("(?is)<script.*?</script>"), " ")
              s = s.replace(Regex("(?is)<style.*?</style>"), " ")
              s = s.replace(Regex("(?s)<!--.*?-->"), " ")
              s = s.replace(Regex("(?i)<(br|/p|/div|/li|/h[1-6]|/tr)[^>]*>"), "\n")
              s = decodeEntities(s.replace(Regex("<[^>]+>"), " "))
              return s.lines().map { it.replace(Regex("[ \\t]+"), " ").trim() }.filter { it.isNotEmpty() }.joinToString("\n")
            }

            fun fetchText(url: String, maxChars: Int = 6000): String {
              val u = if (url.startsWith("http")) url else "https://$url"
              val text = htmlToText(get(u))
              return if (text.length > maxChars) text.take(maxChars) + "\n[truncated, ${text.length} chars total]" else text
            }

            private fun param(url: String, name: String): String? {
              val q = url.substringAfter('?', "")
              for (kv in q.split('&')) {
                val i = kv.indexOf('=')
                if (i > 0 && kv.substring(0, i) == name) return URLDecoder.decode(kv.substring(i + 1), "UTF-8")
              }
              return null
            }

            private fun cleanDdg(href: String): String {
              val h = decodeEntities(href)
              val real = param(h, "uddg")
              if (real != null) return real
              return if (h.startsWith("//")) "https:$h" else h
            }

            private fun cleanBing(href: String): String {
              val h = decodeEntities(href)
              if (h.contains("bing.com/ck/a")) {
                val u = param(h, "u")
                if (u != null && u.startsWith("a1")) {
                  try {
                    return String(Base64.decode(u.substring(2), Base64.URL_SAFE or Base64.NO_PADDING), Charsets.UTF_8)
                  } catch (_: Throwable) {}
                }
              }
              return h
            }

            internal fun duckDuckGo(query: String, limit: Int): List<Hit> {
              val html = get("https://html.duckduckgo.com/html/?q=" + URLEncoder.encode(query, "UTF-8"))
              val links = Regex("(?s)<a[^>]*class=\"result__a\"[^>]*href=\"([^\"]+)\"[^>]*>(.*?)</a>").findAll(html).toList()
              val snips = Regex("(?s)<a[^>]*class=\"result__snippet\"[^>]*>(.*?)</a>").findAll(html).toList()
              return links.take(limit).mapIndexed { i, m ->
                Hit(stripTags(m.groupValues[2]), cleanDdg(m.groupValues[1]), snips.getOrNull(i)?.let { stripTags(it.groupValues[1]) } ?: "")
              }
            }

            internal fun bing(query: String, limit: Int): List<Hit> {
              val html = get("https://www.bing.com/search?setlang=en&q=" + URLEncoder.encode(query, "UTF-8"))
              val blocks = Regex("(?s)<li class=\"b_algo\"[^>]*>(.*?)</li>").findAll(html).toList()
              return blocks.take(limit).mapNotNull { b ->
                val a = Regex("(?s)<h2[^>]*><a[^>]*href=\"([^\"]+)\"[^>]*>(.*?)</a>").find(b.groupValues[1]) ?: return@mapNotNull null
                val p = Regex("(?s)<p[^>]*>(.*?)</p>").find(b.groupValues[1])
                Hit(stripTags(a.groupValues[2]), cleanBing(a.groupValues[1]), p?.let { stripTags(it.groupValues[1]) } ?: "")
              }
            }

            data class SearchResult(val engine: String, val hits: List<Hit>, val errors: List<String>)

            private fun enc(q: String): String = URLEncoder.encode(q, "UTF-8")

            internal fun parseSearxng(html: String, limit: Int): List<Hit> {
              val blocks = Regex("(?s)<article[^>]*class=\"[^\"]*result[^\"]*\"[^>]*>(.*?)</article>").findAll(html).toList()
              return blocks.mapNotNull { b ->
                val body = b.groupValues[1]
                val a = Regex("(?s)<h3[^>]*>\\s*<a[^>]*href=\"([^\"]+)\"[^>]*>(.*?)</a>").find(body) ?: return@mapNotNull null
                val p = Regex("(?s)<p[^>]*class=\"[^\"]*content[^\"]*\"[^>]*>(.*?)</p>").find(body)
                val url = decodeEntities(a.groupValues[1])
                if (!url.startsWith("http")) return@mapNotNull null
                Hit(stripTags(a.groupValues[2]), url, p?.let { stripTags(it.groupValues[1]) } ?: "")
              }.take(limit)
            }

            internal fun parseMarginalia(json: String, limit: Int): List<Hit> {
              val arr = com.google.gson.JsonParser.parseString(json).asJsonObject.getAsJsonArray("results") ?: return emptyList()
              return arr.mapNotNull { e ->
                val o = e.asJsonObject
                val url = o.get("url")?.asString ?: return@mapNotNull null
                Hit(stripTags(o.get("title")?.asString ?: url), url, stripTags(o.get("description")?.asString ?: ""))
              }.take(limit)
            }

            internal fun parseYacy(json: String, limit: Int): List<Hit> {
              val channels = com.google.gson.JsonParser.parseString(json).asJsonObject.getAsJsonArray("channels") ?: return emptyList()
              if (channels.size() == 0) return emptyList()
              val items = channels[0].asJsonObject.getAsJsonArray("items") ?: return emptyList()
              return items.mapNotNull { e ->
                val o = e.asJsonObject
                val url = o.get("link")?.asString ?: return@mapNotNull null
                Hit(stripTags(o.get("title")?.asString ?: url), url, stripTags(o.get("description")?.asString ?: ""))
              }.take(limit)
            }

            internal fun parseWikipedia(json: String, limit: Int): List<Hit> {
              val arr =
                com.google.gson.JsonParser.parseString(json).asJsonObject.getAsJsonObject("query")?.getAsJsonArray("search")
                  ?: return emptyList()
              return arr.mapNotNull { e ->
                val o = e.asJsonObject
                val title = o.get("title")?.asString ?: return@mapNotNull null
                Hit(title, "https://en.wikipedia.org/wiki/" + title.replace(' ', '_'), stripTags(o.get("snippet")?.asString ?: ""))
              }.take(limit)
            }

            private fun searxng(query: String, limit: Int): List<Hit> {
              var last: Throwable? = null
              for (base in SearchEngines.SEARX.shuffled().take(3)) {
                try {
                  val hits = parseSearxng(get(base + "/search?language=en&q=" + enc(query), 8000), limit)
                  if (hits.isNotEmpty()) return hits
                } catch (t: Throwable) {
                  last = t
                }
              }
              if (last != null) throw last
              return emptyList()
            }

            internal fun runEngine(id: String, query: String, limit: Int): List<Hit> =
              when (id) {
                "ddg" -> duckDuckGo(query, limit)
                "bing" -> bing(query, limit)
                "searxng" -> searxng(query, limit)
                "marginalia" -> parseMarginalia(get("https://api.marginalia.nu/public/search/" + enc(query).replace("+", "%20") + "?count=" + limit, 8000), limit)
                "yacy" -> parseYacy(get("https://yacy.searchlab.eu/yacysearch.json?resource=global&maximumRecords=" + limit + "&query=" + enc(query), 8000), limit)
                "wikipedia" -> parseWikipedia(get("https://en.wikipedia.org/w/api.php?action=query&list=search&format=json&utf8=1&srlimit=" + limit + "&srsearch=" + enc(query), 8000), limit)
                else -> emptyList()
              }

            /** Tries the engines in [ids] (default: all) in order and returns the first that has results. */
            fun searchWith(query: String, limit: Int, ids: List<String>?): SearchResult {
              val order = ids ?: SearchEngines.ALL.map { it.id }
              val errors = mutableListOf<String>()
              for (id in order) {
                val title = SearchEngines.ALL.firstOrNull { it.id == id }?.title ?: id
                try {
                  val hits = runEngine(id, query, limit)
                  if (hits.isNotEmpty()) return SearchResult(title, hits, errors)
                  errors.add(title + ": no results")
                } catch (t: Throwable) {
                  errors.add(title + ": " + (t.message ?: t.javaClass.simpleName))
                }
              }
              return SearchResult("", emptyList(), errors)
            }

            fun search(query: String, limit: Int = 6): List<Hit> = searchWith(query, limit, null).hits

            fun searchAsText(query: String, limit: Int = 6, ids: List<String>? = null): String {
              val r = searchWith(query, limit, ids)
              if (r.hits.isEmpty()) {
                val why = if (r.errors.isEmpty()) "No search engine is switched on." else r.errors.joinToString("; ")
                return "No results. " + why + " Try browserSearch or a different query."
              }
              return "(via " + r.engine + ")\n" +
                r.hits.mapIndexed { i, h -> "${i + 1}. ${h.title}\n   ${h.url}\n   ${h.snippet}" }.joinToString("\n")
            }
          }

          data class Engine(val id: String, val title: String, val about: String)

          object SearchEngines {
            val ALL =
              listOf(
                Engine("ddg", "DuckDuckGo", "Fast and reliable"),
                Engine("searxng", "SearXNG (open source)", "Public instances, tries a few"),
                Engine("marginalia", "Marginalia (open source)", "Independent small-web index"),
                Engine("yacy", "YaCy (open source)", "Peer to peer search"),
                Engine("wikipedia", "Wikipedia", "Encyclopedia articles"),
                Engine("bing", "Bing", "Last resort"),
              )

            val SEARX =
              listOf(
                "https://searx.be",
                "https://searx.tiekoetter.com",
                "https://paulgo.io",
                "https://priv.au",
                "https://search.inetol.net",
              )

            fun enabledIds(ctx: Context): List<String> = ALL.map { it.id }.filter { ToolPrefs.engineOn(ctx, it) }

            private fun q(s: String): String = URLEncoder.encode(s, "UTF-8")

            /** Results-page URLs for the browser, in engine order, for the engines that are switched on. */
            fun pageUrls(ctx: Context, query: String): List<Pair<String, String>> =
              enabledIds(ctx).mapNotNull { id ->
                val title = ALL.first { it.id == id }.title
                val url =
                  when (id) {
                    "ddg" -> "https://html.duckduckgo.com/html/?q=" + q(query)
                    "bing" -> "https://www.bing.com/search?setlang=en&q=" + q(query)
                    "searxng" -> SEARX[0] + "/search?language=en&q=" + q(query)
                    "marginalia" -> "https://search.marginalia.nu/search?query=" + q(query)
                    "yacy" -> "https://yacy.searchlab.eu/yacysearch.html?query=" + q(query)
                    "wikipedia" -> "https://en.wikipedia.org/w/index.php?search=" + q(query)
                    else -> null
                  }
                if (url == null) null else Pair(title, url)
              }
          }
