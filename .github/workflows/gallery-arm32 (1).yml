      - name: Patch Android 12+ API calls that crash on Android 10
        working-directory: gallery/Android/src/app/src/main/java/com/google/ai/edge/gallery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def patch(path, fn):
              p = Path(path)
              if not p.exists():
                  print(f"!! missing: {path}")
                  return
              old = p.read_text()
              new = fn(old)
              if new == old:
                  print(f"!! nothing to change in {path}")
              else:
                  p.write_text(new)
                  print(f"patched {path}")

          SAFE_SOC = '(if (android.os.Build.VERSION.SDK_INT >= 31) android.os.Build.SOC_MODEL else "")'

          # Build.SOC_MODEL does not exist before Android 12 (NoSuchFieldError when read).
          patch("common/HardwareUtils.kt",
                lambda t: t.replace("socModel: String = Build.SOC_MODEL,", "socModel: String = " + SAFE_SOC + ","))

          # UiModeManager.setApplicationNightMode is Android 12+ (theme switch in Settings).
          patch("ui/home/SettingsDialog.kt",
                lambda t: re.sub(r"(\s)uiModeManager\.setApplicationNightMode\(([^)]*)\)",
                                 r"\1if (android.os.Build.VERSION.SDK_INT >= 31) uiModeManager.setApplicationNightMode(\2)", t))

          # Matrix.IDENTITY_MATRIX is Android 12+ (Scrapbook).
          patch("customtasks/scrapbook/ScrapbookViewModel.kt",
                lambda t: t.replace("Matrix.IDENTITY_MATRIX", "Matrix()"))
          PY

      # Fixes inside Gallery's own Kotlin: models without constrained-decoding support (LFM2) no
      # longer fail to start, the max tokens limit goes from 4096 to 32768, the chat bar gets a Web
      # button and a Tools button (in-app switches for every tool) on AI Chat and Agent Skills, and
      # the model is told to use its tools directly. Each patch fails the build loudly if upstream
      # changed the code it targets.
      - name: Patch Gallery (constrained decoding fallback, max tokens limit, tool switches)
        working-directory: gallery/Android/src/app/src/main/java/com/google/ai/edge/gallery
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, old, new, what):
              p = Path(path)
              t = p.read_text()
              assert old in t, f"{path}: {what} changed upstream, patch needs updating"
              p.write_text(t.replace(old, new, 1))
              print("patched", path, "-", what)

          # 1) LFM2 and other models whose data processor has no constrained decoding fail with
          #    "FAILED_PRECONDITION: Constrained decoding is not supported". Retry without it.
          patch("ui/llmchat/LlmChatModelHelper.kt",
          """    ExperimentalFlags.enableConversationConstrainedDecoding = enableConversationConstrainedDecoding
              return try {
                engine.createConversation(
                  ConversationConfig(
                    samplerConfig = samplerConfig,
                    systemInstruction = systemInstruction,
                    tools = tools,
                    initialMessages = initialMessages,
                  )
                )
              } finally {
                ExperimentalFlags.enableConversationConstrainedDecoding = false
              }
            }
          """,
          """    val guidance = com.google.ai.edge.gallery.foundation.FoundationTools.guidance()
              val sysInstr =
                if (guidance == null || tools.isEmpty()) systemInstruction
                else
                  com.google.ai.edge.litertlm.Contents.of(
                    (systemInstruction?.contents ?: emptyList<com.google.ai.edge.litertlm.Content>()) +
                      com.google.ai.edge.litertlm.Content.Text("\\n\\n" + guidance)
                  )
              fun attempt(constrained: Boolean): Conversation {
                ExperimentalFlags.enableConversationConstrainedDecoding = constrained
                return try {
                  engine.createConversation(
                    ConversationConfig(
                      samplerConfig = samplerConfig,
                      systemInstruction = sysInstr,
                      tools = tools,
                      initialMessages = initialMessages,
                    )
                  )
                } finally {
                  ExperimentalFlags.enableConversationConstrainedDecoding = false
                }
              }
              return try {
                attempt(enableConversationConstrainedDecoding)
              } catch (e: Exception) {
                val msg = e.message ?: ""
                if (
                  enableConversationConstrainedDecoding &&
                    (msg.contains("onstrained decoding", ignoreCase = true) ||
                      msg.contains("CreateConstraint", ignoreCase = true))
                ) {
                  Log.w(TAG, "Constrained decoding is not supported by this model; retrying without it")
                  attempt(false)
                } else {
                  throw e
                }
              }
            }
          """, "conversation creation falls back to no constrained decoding, adds tool-use guidance")

          # 2) Max tokens slider was capped at 4096.
          patch("data/Config.kt", "private const val MAX_MAX_TOKEN = 4096", "private const val MAX_MAX_TOKEN = 32768",
                "max tokens slider limit 4096 -> 32768")
          patch("data/Config.kt", "        sliderMin = 2000,\n        sliderMax = defaultMaxContextLength,",
                "        sliderMin = minOf(2000, defaultMaxToken),\n        sliderMax = maxOf(defaultMaxContextLength, defaultMaxToken),",
                "slider min/max safe for small defaults")
          # Imported models showed max tokens as a fixed label; make it an editable slider up to 32768.
          patch("ui/modelmanager/ModelManagerViewModel.kt",
                "          defaultMaxToken = llmMaxToken,\n          defaultTopK = info.llmConfig.defaultTopk,",
                "          defaultMaxToken = llmMaxToken,\n          defaultMaxContextLength = 32768,\n          defaultTopK = info.llmConfig.defaultTopk,",
                "imported models get an editable max tokens slider")

          # 3) In-app tool switches. The Web button and the Tools button sit next to Skills and MCP in the
          #    chat bar (AI Chat and Agent Skills). The Tools button opens a panel with one switch per tool.
          patch("ui/common/chat/MessageInputText.kt",
                "\nimport com.google.ai.edge.gallery.R\n",
                "\nimport com.google.ai.edge.gallery.R\nimport com.google.ai.edge.gallery.foundation.ToolPanel\nimport com.google.ai.edge.gallery.foundation.ToolPrefs\n",
                "imports for the tool switches")
          patch("ui/common/chat/MessageInputText.kt",
          """                  // Skills.
                            if (showSkillsPicker) {""",
          """                  // Web search button and Tools panel (in-app switches for the model's tools).
                            var webOn by remember { mutableStateOf(ToolPrefs.webEnabled(context)) }
                            var toolCount by remember { mutableStateOf(ToolPrefs.enabledCount(context)) }
                            OutlinedButton(
                              onClick = {
                                val next = !webOn
                                ToolPrefs.setWeb(context, next)
                                webOn = next
                                toolCount = ToolPrefs.enabledCount(context)
                                android.widget.Toast.makeText(
                                    context,
                                    if (next) "Web search on. It starts with your next new chat."
                                    else "Web search off. It starts with your next new chat.",
                                    android.widget.Toast.LENGTH_SHORT,
                                  )
                                  .show()
                              },
                              enabled = !inProgress && !isResettingSession && !modelInitializing,
                              contentPadding = PaddingValues(horizontal = 12.dp, vertical = 8.dp),
                            ) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                Text("Web")
                                Spacer(modifier = Modifier.width(4.dp))
                                Box(
                                  contentAlignment = Alignment.Center,
                                  modifier =
                                    Modifier.background(
                                        if (webOn) MaterialTheme.colorScheme.primary
                                        else MaterialTheme.colorScheme.surfaceContainer,
                                        shape = CircleShape,
                                      )
                                      .height(18.dp)
                                      .widthIn(min = 18.dp)
                                      .padding(horizontal = 6.dp),
                                ) {
                                  Text(
                                    text = if (webOn) "on" else "off",
                                    style = MaterialTheme.typography.labelSmall,
                                    color =
                                      if (webOn) MaterialTheme.colorScheme.onPrimary
                                      else MaterialTheme.colorScheme.onSurface,
                                  )
                                }
                              }
                            }
                            OutlinedButton(
                              onClick = {
                                ToolPanel.show(context) {
                                  toolCount = ToolPrefs.enabledCount(context)
                                  webOn = ToolPrefs.webEnabled(context)
                                }
                              },
                              enabled = !inProgress && !isResettingSession && !modelInitializing,
                              contentPadding = PaddingValues(horizontal = 12.dp, vertical = 8.dp),
                            ) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                Text("Tools")
                                Spacer(modifier = Modifier.width(4.dp))
                                Box(
                                  contentAlignment = Alignment.Center,
                                  modifier =
                                    Modifier.background(
                                        MaterialTheme.colorScheme.surfaceContainer,
                                        shape = CircleShape,
                                      )
                                      .height(18.dp)
                                      .widthIn(min = 18.dp),
                                ) {
                                  Text(
                                    text = toolCount.toString(),
                                    style = MaterialTheme.typography.labelSmall,
                                  )
                                }
                              }
                            }

                            // Skills.
                            if (showSkillsPicker) {""",
                "Web button and Tools panel button in the chat bar, before Skills and MCP")

          # 4) The Agent Skills tab gets the same switchable tools.
          patch("customtasks/agentchat/AgentTools.kt",
                "    return listOf(loadSkillTool, runMcpTool, runJsTool, runIntentTool) + activeTools\n",
                "    val extra =\n      try {\n        com.google.ai.edge.gallery.foundation.FoundationTools.enabled(context)\n      } catch (_: Throwable) {\n        emptyList<ToolDefinition>()\n      }\n    return listOf(loadSkillTool, runMcpTool, runJsTool, runIntentTool) + activeTools + extra\n",
                "Agent Skills tab gets the switchable tools")
          PY

      # Fast pre-check: compiles every Kotlin file that does not need AndroidX/Compose/Gradle with a
      # plain kotlinc (from the JetBrains GitHub release). Catches Kotlin errors in about a minute
      # instead of after the long Gradle build. The three Compose screens are left to Gradle.
      - name: Compile non-Android-dependent Kotlin with kotlinc (GitHub release)
        working-directory: gallery/Android/src
        env:
          KOTLINC_VERSION: "2.2.21"
        run: |
          set -euo pipefail
          W=/tmp/ktcheck; rm -rf "$W"; mkdir -p "$W/libs" "$W/out"
          curl -fsSL --retry 3 -o "$W/kotlinc.zip" \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLINC_VERSION}/kotlin-compiler-${KOTLINC_VERSION}.zip"
          unzip -q "$W/kotlinc.zip" -d "$W"
          KC="$W/kotlinc"
          "$KC/bin/kotlinc" -version
          curl -fsSL --retry 3 -o "$W/libs/gson.jar" https://repo1.maven.org/maven2/com/google/code/gson/gson/2.11.0/gson-2.11.0.jar
          cp "$KC/lib/kotlinx-coroutines-core-jvm.jar" "$W/libs/"
          cat > "$W/Stub.kt" <<'KT'
          package com.squareup.moshi
          @Target(AnnotationTarget.CLASS) annotation class JsonClass(val generateAdapter: Boolean = false)
          KT
          SRC=app/src/main/java/com/google/ai/edge
          G="$SRC/gallery"
          FILES=$(find "$SRC/litertlm" -maxdepth 1 -name '*.kt'; \
                  find "$G/sandbox" "$G/foundation" "$G/mods" -name '*.kt' 2>/dev/null | grep -vE 'BrowserActivity|FilePickerActivity|TerminalActivity|AgentCenterActivity|PreviewActivity'; \
                  echo "$G/tools/ToolDefinition.kt"; echo "$G/tools/ToolAction.kt"; echo "$G/tools/ToolsProvider.kt"; echo "$W/Stub.kt")
          CP="$ANDROID_HOME/platforms/android-34/android.jar:$W/libs/gson.jar:$W/libs/kotlinx-coroutines-core-jvm.jar:$KC/lib/kotlin-reflect.jar"
          echo "Compiling $(echo "$FILES" | wc -l) files"
          "$KC/bin/kotlinc" -jvm-target 17 -cp "$CP" -d "$W/out" $FILES 2>&1 | tee /tmp/kotlinc-precheck.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Build Gallery APK (Kotlin version auto-detection + retry)
        id: gallery_build
        working-directory: gallery/Android/src
        env:
          INITIAL_KOTLIN_VERSION: "2.2.21"
        run: |
          set -euo pipefail
          cat > /tmp/build_gallery_with_kotlin_retry.sh <<'EOS'
          #!/usr/bin/env bash
          set -uo pipefail

          TOML="gradle/libs.versions.toml"
          LOG="build.log"
          INITIAL="${INITIAL_KOTLIN_VERSION:-2.2.21}"
          META="/tmp/kotlin-plugin-metadata.xml"
          VERSIONS=("$INITIAL")

          set_catalog_version() {
            local version="$1"
            python3 - "$TOML" "$version" <<'PY'
          from pathlib import Path
          import re, sys
          p = Path(sys.argv[1]); version = sys.argv[2]
          t = p.read_text()
          # These three are tied to the Kotlin compiler/plugin version in this catalog.
          for key in ("kotlin", "serializationPlugin", "kotlinReflect"):
              pattern = rf'(?m)^({key} = ")[^"]+(".*)$'.replace("{key}", key)
              t, n = re.subn(pattern, rf'\g<1>{version}\g<2>', t, count=1)
              if n != 1:
                  raise SystemExit(f"Could not update catalog version key: {key}")
          p.write_text(t)
          PY
          }

          is_kotlin_failure() {
            grep -Eqi \
              'Kotlin Gradle plugin|Kotlin compiler|compiled with an incompatible version of Kotlin|metadata binary version|Kotlin version.*(not supported|required|expected)|requires Kotlin|Compose Compiler.*Kotlin|KSP.*Kotlin|incompatible.*Kotlin' "$1"
          }

          extract_required_version() {
            python3 - "$1" <<'PY'
          import re, sys
          text = open(sys.argv[1], errors="ignore").read()
          patterns = [
              r'requires? Kotlin(?: Gradle plugin)?(?: version)?[ :=]+([0-9]+\.[0-9]+\.[0-9]+)',
              r'must use Kotlin(?: Gradle plugin)?(?: version)?[ :=]+([0-9]+\.[0-9]+\.[0-9]+)',
              r'minimum Kotlin(?: version)?[ :=]+([0-9]+\.[0-9]+\.[0-9]+)',
              r'Kotlin Gradle plugin version ([0-9]+\.[0-9]+\.[0-9]+)',
          ]
          for pattern in patterns:
              matches = re.findall(pattern, text, re.I)
              if matches:
                  print(matches[-1]); raise SystemExit(0)
          PY
          }

          discover_fallback_versions() {
            # Query the Gradle Plugin Portal metadata rather than guessing future version numbers.
            curl -fsSL --retry 2 \
              https://plugins.gradle.org/m2/org/jetbrains/kotlin/android/org.jetbrains.kotlin.android.gradle.plugin/maven-metadata.xml \
              -o "$META" || {
                printf '%s\n' "2.3.0" "2.1.21"
                return 0
              }
            python3 - "$META" "$INITIAL" <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          def key(v):
              return tuple(int(x) for x in v.split("."))
          root = ET.parse(sys.argv[1]).getroot()
          initial = key(sys.argv[2])
          versions = []
          for node in root.findall(".//version"):
              raw = (node.text or "").strip()
              if re.fullmatch(r"\d+\.\d+\.\d+", raw):
                  versions.append((key(raw), raw))
          higher = sorted((x for x in versions if x[0] > initial), reverse=True)
          lower = sorted((x for x in versions if x[0] < initial), reverse=True)
          if higher: print(higher[0][1])
          if lower: print(lower[0][1])
          PY
          }

          run_attempt() {
            local version="$1"
            echo "=================================================="
            echo "Building Gallery with Kotlin $version"
            echo "=================================================="
            set_catalog_version "$version"
            rm -f "$LOG"
            ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee "$LOG"
            return ${PIPESTATUS[0]}
          }

          # Attempt 1: the Gallery's original Kotlin version.
          if run_attempt "$INITIAL"; then
            echo "kotlin_version=$INITIAL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! is_kotlin_failure "$LOG"; then
            echo "Build failed for a non-Kotlin reason. Kotlin version will not be changed."
            exit 1
          fi

          REQUIRED="$(extract_required_version "$LOG" || true)"
          if [ -n "$REQUIRED" ]; then
            echo "Compiler/plugin explicitly requested Kotlin $REQUIRED"
            VERSIONS+=("$REQUIRED")
          else
            echo "Kotlin-related failure did not name an exact required version."
          fi

          # Also discover one newer and one older stable version. This is useful
          # if the explicit version is unavailable or exposes a second incompatibility.
          echo "Checking stable Kotlin versions in the Gradle Plugin Portal."
          while IFS= read -r candidate; do
            [ -n "$candidate" ] && VERSIONS+=("$candidate")
          done < <(discover_fallback_versions)

          # Avoid duplicate retries and cap the build to three diagnostic retries.
          declare -A SEEN=()
          SEEN["$INITIAL"]=1
          RETRIES=0
          for version in "${VERSIONS[@]:1}"; do
            [ -n "$version" ] || continue
            [ -z "${SEEN[$version]:-}" ] || continue
            SEEN["$version"]=1
            RETRIES=$((RETRIES + 1))
            if [ "$RETRIES" -gt 3 ]; then break; fi
            if run_attempt "$version"; then
              echo "kotlin_version=$version" >> "$GITHUB_OUTPUT"
              echo "Build succeeded with Kotlin $version"
              exit 0
            fi
            if ! is_kotlin_failure "$LOG"; then
              echo "Retry failed for a non-Kotlin reason. Stopping version changes."
              exit 1
            fi
            NEXT_REQUIRED="$(extract_required_version "$LOG" || true)"
            if [ -n "$NEXT_REQUIRED" ] && [ -z "${SEEN[$NEXT_REQUIRED]:-}" ]; then
              echo "New compiler diagnostic explicitly requires Kotlin $NEXT_REQUIRED"
              VERSIONS+=("$NEXT_REQUIRED")
            fi
          done

          echo "All Kotlin version attempts failed."
          echo "Initial version: $INITIAL"
          echo "Tried: ${!SEEN[*]}"
          echo "The complete final compiler diagnostic is in build.log."
          exit 1
          EOS
          chmod +x /tmp/build_gallery_with_kotlin_retry.sh
          /tmp/build_gallery_with_kotlin_retry.sh

          find app/build/outputs -name "*.apk" | tee /tmp/apk-paths.txt
          APK="$(head -1 /tmp/apk-paths.txt)"
          if [ -z "$APK" ]; then
            echo "No APK under app/build/outputs; searching whole build dir:"
            find app/build -iname "*.apk" 2>/dev/null | tee -a /tmp/apk-paths.txt
            APK="$(tail -1 /tmp/apk-paths.txt)"
          fi
          test -n "$APK" || { echo "No APK produced"; exit 1; }
          cp -f "$APK" /tmp/Gallery-Android10-armeabi-v7a.apk
          ls -lh /tmp/Gallery-Android10-armeabi-v7a.apk

      # Lists every call to an Android 12+ API (the build lowers minSdk to 29). Any of them that is not
      # wrapped in a version check can crash on an Android 10 phone. Informational only.
      - name: Lint - find Android 12+ API calls that crash on Android 10 (diagnostic)
        continue-on-error: true
        timeout-minutes: 35
        working-directory: gallery/Android/src
        run: |
          set +e
          cat > /tmp/newapi.init.gradle <<'GR'
          allprojects {
            afterEvaluate { p ->
              if (p.plugins.hasPlugin('com.android.application')) {
                try {
                  p.android.lint {
                    checkOnly.clear()
                    checkOnly.add('NewApi')
                    abortOnError = false
                    checkDependencies = false
                    checkReleaseBuilds = false
                    textReport = true
                    textOutput = p.layout.buildDirectory.file('reports/newapi.txt').get().asFile
                    htmlReport = false
                    xmlReport = false
                    sarifReport = false
                  }
                } catch (Throwable t) {
                  println("newapi init script failed: " + t)
                }
              }
            }
          }
          GR
          ./gradlew :app:lintDebug --init-script /tmp/newapi.init.gradle --no-daemon \
            -Dorg.gradle.jvmargs=-Xmx4g 2>&1 | tail -n 40
          REPORT=app/build/reports/newapi.txt
          if [ -s "$REPORT" ]; then
            cp -f "$REPORT" /tmp/newapi.txt
            echo "=== NewApi findings (unguarded Android 12+ calls) ==="
            grep -E "\[NewApi\]" "$REPORT" | sed 's#^.*/java/com/google/ai/edge/gallery/##' | sort -u | head -150
          else
            echo "No NewApi report was produced"
            ls app/build/reports 2>/dev/null
          fi

      - name: Validate APK and JNI identity
        run: |
          set -euo pipefail
          APK=/tmp/Gallery-Android10-armeabi-v7a.apk
          unzip -l "$APK" | grep -E "lib/armeabi-v7a|lib/arm64" || true
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -E "sdkVersion|native-code|package" || true
          mkdir -p /tmp/apkcheck
          unzip -p "$APK" lib/armeabi-v7a/liblitertlm_jni.so > /tmp/apkcheck/liblitertlm_jni.so
          test -s /tmp/apkcheck/liblitertlm_jni.so
          readelf -d /tmp/apkcheck/liblitertlm_jni.so | grep NEEDED || true
          if readelf --dyn-syms -W /tmp/apkcheck/liblitertlm_jni.so | awk '$7=="UND" && $5=="GLOBAL"' | grep -E '@LIBC_(R|S|T|U|V|W)( |$)'; then
            echo "::error::The packaged .so needs Android 11+ libc symbols and will crash on Android 10."
            exit 1
          fi
          sha256sum self/prebuilt/armeabi-v7a/liblitertlm_jni.so /tmp/apkcheck/liblitertlm_jni.so
          if [ -f self/prebuilt/armeabi-v7a/libunwindshim.so ]; then
            unzip -l "$APK" | grep -q "lib/armeabi-v7a/libunwindshim.so" || {
              echo "::error::libunwindshim.so is missing from the APK"
              exit 1
            }
          fi
          # Catch a repeat of the "CANNOT LINK EXECUTABLE ... library not found" crash at build time
          # instead of on-device. Two checks, since Gradle packaging is a second place a file could
          # silently get dropped after the bundling step already resolved the full closure:
          # (1) every .so the bundling step wrote to jniLibs/armeabi-v7a actually made it into the APK
          PROOT_JNILIBS="$GITHUB_WORKSPACE/gallery/Android/src/app/src/main/jniLibs/armeabi-v7a"
          for f in "$PROOT_JNILIBS"/*.so; do
            name="$(basename "$f")"
            unzip -l "$APK" | grep -q "lib/armeabi-v7a/$name" || {
              echo "::error::$name was bundled into jniLibs but is missing from the packaged APK"
              exit 1
            }
          done
          # (2) libproot.so's full NEEDED chain, as packaged, resolves to something in the APK (or
          # an Android OS lib) - catches drift if a future proot build adds a dependency that this
          # check (or the resolver above) hasn't been told about.
          unzip -p "$APK" lib/armeabi-v7a/libproot.so > /tmp/apkcheck/libproot.so
          for lib in $(readelf -d /tmp/apkcheck/libproot.so | grep NEEDED | sed -E 's/.*\[(.*)\]/\1/'); do
            case "$lib" in
              libc.so|libdl.so|liblog.so|libm.so|libz.so|libstdc++.so|libc++.so|libandroid.so) continue ;;
            esac
            unzip -l "$APK" | grep -q "lib/armeabi-v7a/$lib" || {
              echo "::error::libproot.so needs $lib but it is not packaged in the APK"
              exit 1
            }
          done
          echo "proot's native dependencies are all packaged"
          S=self/prebuilt/armeabi-v7a/liblitertlm_jni.so
          A=/tmp/apkcheck/liblitertlm_jni.so
          if cmp -s "$S" "$A"; then
            echo "Packaged library is byte-identical to the saved one"
          else
            echo "Bytes differ (Gradle rewrote the file); comparing dependencies and symbols instead"
            ls -l "$S" "$A"
            diff <(readelf -d "$S" | grep -E 'NEEDED|SONAME' | sed 's/^ *0x[0-9a-f]* //') <(readelf -d "$A" | grep -E 'NEEDED|SONAME' | sed 's/^ *0x[0-9a-f]* //') || {
              echo "::error::The packaged library has different dependencies than the saved ARM32 library."
              exit 1
            }
            diff <(readelf --dyn-syms -W "$S" | awk 'NR>3{print $4, $5, ($7=="UND" ? "UND" : "DEF"), $8}' | sort) <(readelf --dyn-syms -W "$A" | awk 'NR>3{print $4, $5, ($7=="UND" ? "UND" : "DEF"), $8}' | sort) || {
              echo "::error::The packaged library has different dynamic symbols than the saved ARM32 library."
              exit 1
            }
            echo "Dependencies and dynamic symbols match the saved library"
          fi
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gallery-Android10-armeabi-v7a
          path: /tmp/Gallery-Android10-armeabi-v7a.apk
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            gallery/Android/src/build.log
            /tmp/newapi.txt
            /tmp/apk-paths.txt
            /tmp/bazel.log
            /tmp/attempt.log
            /tmp/errs.log
            /tmp/all-so.txt
            /tmp/ndk-used.txt
            /tmp/litert-lm-sha.txt
            /tmp/sdkmanager.log
            /tmp/kotlin-plugin-metadata.xml
            /tmp/kotlinc-precheck.log
          if-no-files-found: ignore
