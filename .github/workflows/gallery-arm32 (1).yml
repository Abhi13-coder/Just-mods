          /** Shows the agent's WebView so you can watch it work or take over. */
          class BrowserActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              setContent { MaterialTheme(colorScheme = darkColorScheme()) { Screen() } }
            }

            override fun onDestroy() {
              BrowserHub.detach()
              super.onDestroy()
            }

            @Composable
            private fun Screen() {
              var url by remember { mutableStateOf(BrowserHub.currentUrl) }
              Column(Modifier.fillMaxSize().padding(4.dp)) {
                Row(verticalAlignment = Alignment.CenterVertically) {
                  Button(onClick = { Thread { BrowserHub.goBack(applicationContext) }.start() }) { Text("<") }
                  OutlinedTextField(
                    value = url,
                    onValueChange = { url = it },
                    modifier = Modifier.weight(1f).padding(horizontal = 4.dp),
                    singleLine = true,
                    placeholder = { Text("address") },
                  )
                  Button(onClick = { Thread { BrowserHub.open(applicationContext, url) }.start() }) { Text("Go") }
