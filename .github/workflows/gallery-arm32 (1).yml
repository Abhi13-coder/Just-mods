          p = Path(sys.argv[1])
          t = p.read_text()
          ADD = [
            ("foundation.AgentCenterActivity", '        <activity android:name="com.google.ai.edge.gallery.foundation.AgentCenterActivity" android:label="Agent Center" android:exported="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity>'),
            ("foundation.PreviewActivity", '        <activity android:name="com.google.ai.edge.gallery.foundation.PreviewActivity" android:label="Preview" android:exported="false" android:theme="@android:style/Theme.DeviceDefault.NoActionBar" android:windowSoftInputMode="adjustResize" />'),
            ("foundation.EmergencyReceiver", '        <receiver android:name="com.google.ai.edge.gallery.foundation.EmergencyReceiver" android:exported="false" />'),
          ]
          assert "</application>" in t, "no </application> in manifest"
          for key, xml in ADD:
              if key in t:
                  print(key, "already registered")
              else:
                  t = t.replace("</application>", xml + "\n    </application>", 1)
                  print("registered", key)
          if "networkSecurityConfig" not in t:
              assert "<application" in t
              t = t.replace("<application", '<application android:networkSecurityConfig="@xml/network_security_config"', 1)
              print("added networkSecurityConfig (cleartext only for 127.0.0.1 / localhost)")
          p.write_text(t)
          PY
          grep -nE "AgentCenterActivity|PreviewActivity|EmergencyReceiver|networkSecurityConfig" "$SRC/AndroidManifest.xml"
          cd "$BASE"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ui/common/chat/MessageBodyText.kt")
          t = p.read_text()
          old = "@Composable\nfun MessageBodyText("
          assert old in t, "MessageBodyText signature changed upstream, patch needs updating"
