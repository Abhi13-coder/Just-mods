          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          /**
           * Agent Center: start/stop the always-on agents, the big STOP button, scheduled jobs, and the full
           * activity log of every tool the AI used (searches, shell commands, pages, files, jobs).
           */
          class AgentCenterActivity : ComponentActivity() {
            private var entries by mutableStateOf(listOf<Audit.Entry>())
            private var jobs by mutableStateOf(listOf<Job>())
            private var status by mutableStateOf("")

            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              setContent { MaterialTheme(colorScheme = darkColorScheme()) { Screen() } }
              Thread {
                  while (!isDestroyed) {
                    Lockdown.sync(this)
                    val e = Audit.readAll(this, 400)
                    val j = JobStore.all(this)
                    val s =
                      "Agents: " + (if (Prefs.serviceEnabled(this)) "RUNNING" else "stopped") +
                        "   Tools: " + (if (Lockdown.on) "LOCKED" else "unlocked") +
                        "   Jobs: " + j.count { it.enabled } + "/" + j.size + " on"
                    runOnUiThread {
                      entries = e
                      jobs = j
                      status = s
                    }
                    try { Thread.sleep(2000) } catch (_: InterruptedException) { break }
                  }
                }
                .start()
            }

            private fun toast(msg: String) {
              Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
            }

            private fun copyLog() {
              val text = Audit.exportText(this)
              val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
              cm.setPrimaryClip(ClipData.newPlainText("agent log", text.takeLast(300000)))
              toast("Copied " + entries.size + " entries")
            }

            private fun shareLog() {
              val i = Intent(Intent.ACTION_SEND)
              i.type = "text/plain"
              i.putExtra(Intent.EXTRA_TEXT, Audit.exportText(this).takeLast(100000))
              startActivity(Intent.createChooser(i, "Share activity log"))
            }

            private fun saveLog() {
              Workspace.write(this, "audit-export.txt", Audit.exportText(this), false)
              toast("Saved to workspace/audit-export.txt")
            }

            private fun confirmClear() {
              AlertDialog.Builder(this)
                .setTitle("Clear the activity log?")
                .setMessage("This is your record of what the AI did. Export it first if you need it.")
                .setPositiveButton("Clear") { _, _ -> Audit.clear(this) }
                .setNegativeButton("Keep", null)
                .show()
            }

            private fun confirmStop() {
              AlertDialog.Builder(this)
                .setTitle("Emergency stop?")
                .setMessage("Stops the agent service, disables every job, kills sandbox processes and locks all tools.")
                .setPositiveButton("STOP") { _, _ -> EmergencyStop.run(this, "STOP button in Agent Center") }
                .setNegativeButton("Cancel", null)
                .show()
            }

            @Composable
            private fun Mini(label: String, onClick: () -> Unit) {
              TextButton(onClick = onClick, contentPadding = PaddingValues(horizontal = 8.dp)) { Text(label) }
            }

            @Composable
            private fun Screen() {
              Column(Modifier.fillMaxSize().padding(8.dp)) {
                Text(status, fontSize = 12.sp, color = Color(0xFF8FA3B5))
                Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                  Button(onClick = { Lockdown.sync(this@AgentCenterActivity); AgentService.start(this@AgentCenterActivity) }) { Text("Start agents") }
                  Button(onClick = { AgentService.stop(this@AgentCenterActivity) }) { Text("Stop agents") }
                }
                Row(Modifier.fillMaxWidth().padding(vertical = 4.dp), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                  Button(
                    onClick = { confirmStop() },
                    colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFB3261E)),
                  ) { Text("EMERGENCY STOP") }
                  Button(onClick = { Lockdown.set(this@AgentCenterActivity, false); toast("Tools unlocked") }, enabled = Lockdown.on) { Text("Unlock tools") }
                }
                SelectionContainer(Modifier.weight(1f).fillMaxWidth()) {
                  LazyColumn(modifier = Modifier.fillMaxSize()) {
                    item { Text("Scheduled jobs", color = Color.White) }
                    if (jobs.isEmpty()) item { Text("(none)", fontSize = 12.sp, color = Color(0xFF8FA3B5)) }
                    items(jobs) { j ->
                      Row(verticalAlignment = Alignment.CenterVertically) {
                        Text(
                          j.name + " [" + j.kind + "] every " + j.everyMinutes + " min" + (if (j.enabled) "" else "  (off)"),
                          fontSize = 12.sp,
                          color = Color(0xFFE6EDF3),
                          modifier = Modifier.weight(1f),
                        )
                        Mini(if (j.enabled) "Disable" else "Enable") {
                          Thread { JobStore.upsert(this@AgentCenterActivity, j.copy(enabled = !j.enabled)) }.start()
                        }
                        Mini("Delete") { Thread { JobStore.remove(this@AgentCenterActivity, j.id) }.start() }
                      }
                    }
                    item {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                        Text("Activity log (" + entries.size + ")", color = Color.White, modifier = Modifier.weight(1f))
                        Mini("Copy all") { copyLog() }
                        Mini("Share") { shareLog() }
                        Mini("Save") { saveLog() }
                        Mini("Clear") { confirmClear() }
                      }
                    }
                    if (entries.isEmpty()) item { Text("(nothing yet)", fontSize = 12.sp, color = Color(0xFF8FA3B5)) }
                    items(entries) { e ->
                      Text(
                        e.line(),
                        fontFamily = FontFamily.Monospace,
                        fontSize = 11.sp,
                        color = if (e.risky) Color(0xFFFF6B6B) else Color(0xFFE6EDF3),
                        modifier = Modifier.padding(vertical = 2.dp),
                      )
                    }
                  }
                }
              }
            }
          }
          KT
          cat > "$SRC/res/xml/network_security_config.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <domain-config cleartextTrafficPermitted="true">
              <domain includeSubdomains="false">localhost</domain>
              <domain includeSubdomains="false">127.0.0.1</domain>
