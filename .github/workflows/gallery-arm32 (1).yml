      - name: Add foundation tools (web, file picker, GUI browser, 24/7 agent service, model orchestra)
        run: |
          set -euo pipefail
          SRC=gallery/Android/src/app/src/main
          BASE="$SRC/java/com/google/ai/edge/gallery"
          mkdir -p "$BASE/foundation"
          cat > "$BASE/foundation/FoundationTools.kt" <<'KT'
          package com.google.ai.edge.gallery.foundation

          import android.content.Context
          import com.google.ai.edge.gallery.sandbox.SandboxShell
          import com.google.ai.edge.gallery.tools.RuntimeToolsProvider
          import com.google.ai.edge.gallery.tools.ToolDefinition
          import com.google.ai.edge.gallery.tools.ToolExecutionContext
          import com.google.ai.edge.litertlm.Tool
          import com.google.ai.edge.litertlm.ToolParam

          abstract class BaseTool : ToolDefinition {
            /** Id used by the Tools panel switch of this tool. */
            abstract val toolId: String

            override val alwaysAllow: Boolean = true
            override var executionContext: ToolExecutionContext? = null

            protected fun safe(block: () -> Map<String, String>): Map<String, String> =
              try {
                if (Lockdown.on) mapOf("error" to Lockdown.MESSAGE) else block()
              } catch (t: Throwable) {
                mapOf("error" to (t.message ?: t.javaClass.simpleName))
              }
          }

          // ---- Web ----

          class WebSearchTool(private val ctx: Context) : BaseTool() {
            override val toolId = "webSearch"

            @Tool(
              description =
                "Search the web and get the top results (title, url, snippet). Call this yourself whenever the user asks you to look something up, find news, prices or facts, or says search. Put the request in plain English as the query. Never ask the user for a URL or for permission."
            )
            fun webSearch(@ToolParam(description = "What to search for, in plain English") query: String): Map<String, String> =
              safe { Audit.log(ctx, "webSearch", query); mapOf("results" to Web.searchAsText(query, 6, SearchEngines.enabledIds(ctx))) }
          }

          class FetchPageTool(private val ctx: Context) : BaseTool() {
            override val toolId = "fetchPage"

            @Tool(
              description =
                "Read a web page and return its text. Call it with a url from the search results (or one the user gave) when you need the details. It does not run JavaScript; use the browser tools for pages that need it."
            )
            fun fetchPage(@ToolParam(description = "The page URL") url: String): Map<String, String> =
              safe { Audit.log(ctx, "fetchPage", url); mapOf("text" to Web.fetchText(url, 6000)) }
          }

          // ---- Browser ----

          class BrowserSearchTool(private val ctx: Context) : BaseTool() {
            override val toolId = "browserSearch"

            @Tool(
              description =
                "Run a web search in the built-in browser and show the results page. Use it to see results with your own eyes or when webSearch found nothing, then call browserRead. Plain English query, no URL needed."
            )
            fun browserSearch(@ToolParam(description = "What to search for, in plain English") query: String): Map<String, String> =
              safe {
                Audit.log(ctx, "browserSearch", query); val urls = SearchEngines.pageUrls(ctx, query)
                if (urls.isEmpty()) return@safe mapOf("error" to "no search engine is switched on")
                var last = ""
                for ((label, url) in urls) {
                  try {
                    val status = BrowserHub.open(ctx, url)
                    return@safe mapOf("status" to status, "engine" to label, "next" to "call browserRead to read the results")
                  } catch (t: Throwable) {
                    last = label + ": " + (t.message ?: t.javaClass.simpleName)
                  }
                }
                mapOf("error" to ("could not open any search engine, last error: " + last))
              }
          }

          class BrowserOpenTool(private val ctx: Context) : BaseTool() {
            override val toolId = "browserOpen"

            @Tool(description = "Open a URL in the built-in browser and wait for it to load.")
            fun browserOpen(@ToolParam(description = "The URL to open") url: String): Map<String, String> =
              safe { Audit.log(ctx, "browserOpen", url); mapOf("status" to BrowserHub.open(ctx, url)) }
          }

          class BrowserReadTool(private val ctx: Context) : BaseTool() {
            override val toolId = "browserRead"

            @Tool(description = "Read the visible text of the page currently open in the browser.")
            fun browserRead(): Map<String, String> = safe { Audit.log(ctx, "browserRead", ""); mapOf("text" to BrowserHub.readText(ctx)) }
          }

          class BrowserElementsTool(private val ctx: Context) : BaseTool() {
            override val toolId = "browserElements"

            @Tool(description = "List the clickable and typeable elements on the current page, each with a numeric id.")
            fun browserElements(): Map<String, String> = safe { Audit.log(ctx, "browserElements", ""); mapOf("elements" to BrowserHub.elements(ctx)) }
          }

          class BrowserClickTool(private val ctx: Context) : BaseTool() {
            override val toolId = "browserClick"

            @Tool(description = "Click the element with this id (from browserElements).")
            fun browserClick(@ToolParam(description = "Element id") id: Int): Map<String, String> =
              safe { Audit.log(ctx, "browserClick", "id=$id"); mapOf("result" to BrowserHub.click(ctx, id)) }
          }

          class BrowserTypeTool(private val ctx: Context) : BaseTool() {
            override val toolId = "browserType"

            @Tool(description = "Type text into the input element with this id (from browserElements). Set submit to true to press Enter or submit the form.")
            fun browserType(
              @ToolParam(description = "Element id") id: Int,
              @ToolParam(description = "Text to type") text: String,
              @ToolParam(description = "Submit the form after typing") submit: Boolean,
            ): Map<String, String> = safe { Audit.log(ctx, "browserType", "id=$id submit=$submit text=$text"); mapOf("result" to BrowserHub.type(ctx, id, text, submit)) }
          }

          class BrowserScrollTool(private val ctx: Context) : BaseTool() {
            override val toolId = "browserScroll"

            @Tool(description = "Scroll the page down by this many pixels (negative scrolls up).")
            fun browserScroll(@ToolParam(description = "Pixels to scroll") pixels: Int): Map<String, String> =
              safe { Audit.log(ctx, "browserScroll", "px=$pixels"); mapOf("result" to BrowserHub.scroll(ctx, pixels)) }
          }

          class BrowserRunJsTool(private val ctx: Context) : BaseTool() {
            override val toolId = "browserRunJs"

            @Tool(description = "Run JavaScript on the current page and return the result.")
            fun browserRunJs(@ToolParam(description = "JavaScript expression") code: String): Map<String, String> =
              safe { Audit.log(ctx, "browserRunJs", code); mapOf("result" to BrowserHub.eval(ctx, code)) }
          }

          // ---- Terminal and files ----

          class ShellTool(private val ctx: Context) : BaseTool() {
            override val toolId = "runShell"

            @Tool(description = "Run a shell command in the Alpine Linux sandbox (1 GB limit). Use it to install packages with apk, run scripts, process files. The shared workspace folder is mounted at /workspace, so anything saved there (any file type) is visible to the file tools and the user.")
            fun runShell(@ToolParam(description = "The shell command") command: String): Map<String, String> =
              safe {
                Audit.log(ctx, "runShell", command); val (code, out) = SandboxShell(ctx).runCapture(command, 120, 6000)
                Audit.log(ctx, "runShell:result", "exit=$code " + out.take(500)); mapOf("exit_code" to code.toString(), "output" to out)
              }
          }

          class ListFilesTool(private val ctx: Context) : BaseTool() {
            override val toolId = "listFiles"

            @Tool(description = "List files in the shared workspace folder. Use an empty path for the top level.")
            fun listFiles(@ToolParam(description = "Folder path inside the workspace") path: String): Map<String, String> =
              safe { Audit.log(ctx, "listFiles", path); mapOf("files" to Workspace.list(ctx, path)) }
          }

          class ReadFileTool(private val ctx: Context) : BaseTool() {
            override val toolId = "readFile"

            @Tool(description = "Read a text file from the shared workspace.")
            fun readFile(@ToolParam(description = "File path inside the workspace") path: String): Map<String, String> =
              safe { Audit.log(ctx, "readFile", path); mapOf("content" to Workspace.read(ctx, path)) }
          }

          class WriteFileTool(private val ctx: Context) : BaseTool() {
            override val toolId = "writeFile"

            @Tool(description = "Write or append text to a file in the shared workspace.")
            fun writeFile(
              @ToolParam(description = "File path inside the workspace") path: String,
              @ToolParam(description = "Text to write") content: String,
              @ToolParam(description = "Append instead of overwrite") append: Boolean,
            ): Map<String, String> = safe { Audit.log(ctx, "writeFile", "$path append=$append len=${content.length}"); mapOf("result" to Workspace.write(ctx, path, content, append)) }
          }

          class CopyFileTool(private val ctx: Context) : BaseTool() {
            override val toolId = "copyFile"

            @Tool(description = "Copy a file or folder inside the shared workspace (works for any file type, not only text).")
            fun copyFile(
              @ToolParam(description = "Source path inside the workspace") from: String,
              @ToolParam(description = "Destination path inside the workspace") to: String,
              @ToolParam(description = "Overwrite if the destination exists") overwrite: Boolean,
            ): Map<String, String> = safe {
              Audit.log(ctx, "copyFile", "$from -> $to"); val src = Workspace.resolve(ctx, from) ?: return@safe mapOf("error" to "source is outside the workspace")
              val dst = Workspace.resolve(ctx, to) ?: return@safe mapOf("error" to "destination is outside the workspace")
              if (!src.exists()) return@safe mapOf("error" to "source does not exist: $from")
              if (dst.exists() && !overwrite) return@safe mapOf("error" to "destination exists; set overwrite to true")
              dst.parentFile?.mkdirs()
              if (src.isDirectory) src.copyRecursively(dst, overwrite) else src.copyTo(dst, overwrite)
              mapOf("result" to "copied $from to $to")
            }
          }

          class PreviewTool(private val ctx: Context) : BaseTool() {
            override val toolId = "previewPage"

            @Tool(description = "Show an HTML page to the user in the preview window. target is a workspace file path (like site/index.html) or a local server address such as http://127.0.0.1:8000 started in the sandbox with a command like: python3 -m http.server 8000 &. Use it to show the user web pages, games and tools you built.")
            fun previewPage(@ToolParam(description = "Workspace HTML file path, or http://127.0.0.1:PORT") target: String): Map<String, String> =
              safe {
                Audit.log(ctx, "previewPage", target)
                mapOf("result" to PreviewSupport.openTarget(ctx, target))
              }
          }

          // ---- Background jobs ----

          class ScheduleJobTool(private val ctx: Context) : BaseTool() {
            override val toolId = "scheduleJob"

            @Tool(description = "Schedule a recurring background job that keeps running 24/7. kind is shell, search, fetch or agent. payload is the command, query, URL or prompt.")
            fun scheduleJob(
              @ToolParam(description = "Short job name") name: String,
              @ToolParam(description = "shell, search, fetch or agent") kind: String,
              @ToolParam(description = "Command, query, URL or prompt") payload: String,
              @ToolParam(description = "Run every this many minutes") everyMinutes: Int,
              @ToolParam(description = "Bundle name for agent jobs, else empty") bundle: String,
            ): Map<String, String> =
              safe {
                if (kind !in setOf("shell", "search", "fetch", "agent")) return@safe mapOf("error" to "kind must be shell, search, fetch or agent")
                val job = Job(JobStore.newId(), name, kind, payload, everyMinutes.coerceAtLeast(1), bundle)
                JobStore.upsert(ctx, job); AgentService.start(ctx); Audit.log(ctx, "scheduleJob", "${job.name} [${job.kind}] every ${job.everyMinutes}m: ${job.payload}"); mapOf("result" to "scheduled", "id" to job.id)
              }
          }

          class ListJobsTool(private val ctx: Context) : BaseTool() {
            override val toolId = "listJobs"

            @Tool(description = "List scheduled background jobs.")
            fun listJobs(): Map<String, String> =
              safe {
                val jobs = JobStore.all(ctx)
                mapOf("jobs" to if (jobs.isEmpty()) "(none)" else jobs.joinToString("\n") { "${it.id}: ${it.name} [${it.kind}] every ${it.everyMinutes} min" })
              }
          }

          class CancelJobTool(private val ctx: Context) : BaseTool() {
            override val toolId = "cancelJob"

            @Tool(description = "Cancel a scheduled job by id.")
            fun cancelJob(@ToolParam(description = "Job id") id: String): Map<String, String> =
              safe {
                Audit.log(ctx, "cancelJob", id); JobStore.remove(ctx, id)
                mapOf("result" to "cancelled")
              }
          }

          class NotifyTool(private val ctx: Context) : BaseTool() {
            override val toolId = "notifyUser"

            @Tool(description = "Show a notification to the user.")
            fun notifyUser(
              @ToolParam(description = "Title") title: String,
              @ToolParam(description = "Message") message: String,
            ): Map<String, String> =
              safe {
                Audit.log(ctx, "notifyUser", title + ": " + message); Notifier.result(ctx, title, message)
                mapOf("result" to "sent")
              }
          }

          // ---- Specialist models ----

          class SpecialistTool(private val ctx: Context, private val bundle: Bundle) : BaseTool() {
            override val toolId = "callSpecialist"

            @Tool(description = "Call a specialist model from the active bundle. role is one of the specialists (vlm: input is an image path in the workspace, optionally followed by :: and a question; asr: audio path; tts: text; classify, detect, segment: image path; embed: text).")
            fun callSpecialist(
              @ToolParam(description = "Specialist role name") role: String,
              @ToolParam(description = "Input for the specialist") input: String,
            ): Map<String, String> = safe { Audit.log(ctx, "callSpecialist", "$role: $input"); mapOf("result" to Specialists.call(ctx, bundle, role, input)) }
          }

          object FoundationTools {
            @Volatile private var active = false

            private const val GUIDE =
              "You have tools and can use them yourself, right away, without asking the user for permission, a URL or anything else. " +
                "Never say that you have no tools. To find information, news, prices or facts, call the web search tool with the user's " +
                "request in plain English. To read a page, call the page reader (or the browser tools) with a url taken from the search " +
                "results. Use what the tools return in your answer."

            /** Extra system instruction while foundation tools are switched on, else null. */
            fun guidance(): String? = if (active) GUIDE else null

            /** Tools the chat and agent models get: only the ones switched on in the Tools panel (all off by default). */
            fun enabled(ctx: Context): List<ToolDefinition> {
              Lockdown.sync(ctx)
              if (ToolPrefs.enabledCount(ctx) == 0) {
                active = false
                return emptyList()
              }
              val out = all(ctx).filter { it is BaseTool && ToolPrefs.isOn(ctx, it.toolId) }
              active = out.isNotEmpty()
              return out
            }

            /** Every tool, for agent bundles. [bundle] defaults to the bundle selected in the control panel. */
            fun all(ctx: Context, bundle: Bundle? = null): List<ToolDefinition> {
              val app = ctx.applicationContext
              val b = bundle ?: Prefs.activeBundle(app).takeIf { it.isNotBlank() }?.let { Orchestra.load(app, it) }
              val tools =
                mutableListOf<ToolDefinition>(
                  WebSearchTool(app), FetchPageTool(app),
                  BrowserSearchTool(app), BrowserOpenTool(app), BrowserReadTool(app), BrowserElementsTool(app),
                  BrowserClickTool(app), BrowserTypeTool(app), BrowserScrollTool(app), BrowserRunJsTool(app),
                  ShellTool(app), PreviewTool(app), ListFilesTool(app), ReadFileTool(app), WriteFileTool(app), CopyFileTool(app),
                  ScheduleJobTool(app), ListJobsTool(app), CancelJobTool(app), NotifyTool(app),
                )
              if (b != null && b.roles.keys.any { it != "chat" }) tools.add(SpecialistTool(app, b))
              return tools
            }
          }

          /** Chat tool list that re-reads the Tools panel switches every time a conversation is created. */
          class GatedToolsProvider(private val ctx: Context) : RuntimeToolsProvider() {
            override fun getAvailableTools(): List<ToolDefinition> =
              super.getAvailableTools() + FoundationTools.enabled(ctx)
          }
          KT
          cat > "$BASE/foundation/ToolPanel.kt" <<'KT'
          package com.google.ai.edge.gallery.foundation

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Context
          import android.content.ContextWrapper
          import android.graphics.Typeface
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Switch
          import android.widget.TextView

          /** One switch in the Tools panel. [about] says in plain words what the model can do with it. */
          data class ToolToggle(val id: String, val group: String, val title: String, val about: String)

          /** Which tools the chat and agent models get (everything off until switched on) and which search engines are used. */
          object ToolPrefs {
            val TOGGLES =
              listOf(
                ToolToggle("webSearch", "Web", "Web search", "Search the web for results"),
                ToolToggle("fetchPage", "Web", "Read web page", "Download a page and read its text"),
