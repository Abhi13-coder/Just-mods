          cat > "$BASE/foundation/Workspace.kt" <<'KT'
          package com.google.ai.edge.gallery.foundation

          import android.content.Context
          import java.io.File

          /** Shared folder the agent can read and write. Files picked in the control panel land in inbox/. */
          object Workspace {
            fun dir(ctx: Context): File =
              File(ctx.getExternalFilesDir(null) ?: ctx.filesDir, "workspace").apply { mkdirs() }

            /** Resolves [rel] inside the workspace; returns null if it would escape the folder. */
            fun resolve(ctx: Context, rel: String): File? {
              val base = dir(ctx).canonicalFile
              val f = File(base, rel.trimStart('/')).canonicalFile
              return if (f.path == base.path || f.path.startsWith(base.path + File.separator)) f else null
            }

            fun list(ctx: Context, rel: String): String {
              val f = resolve(ctx, rel) ?: return "error: path is outside the workspace"
              if (!f.exists()) return "error: not found"
              if (f.isFile) return "${f.name} (${f.length()} bytes)"
              val items = f.listFiles()?.sortedBy { it.name } ?: emptyList()
              if (items.isEmpty()) return "(empty)"
              return items.take(200).joinToString("\n") {
                if (it.isDirectory) it.name + "/" else it.name + " (" + it.length() + " bytes)"
              }
            }

            fun read(ctx: Context, rel: String, maxChars: Int = 20000): String {
              val f = resolve(ctx, rel) ?: return "error: path is outside the workspace"
              if (!f.isFile) return "error: not a file"
              return try {
                val text = f.readText()
                if (text.length > maxChars) text.take(maxChars) + "\n[truncated, ${text.length} chars total]" else text
              } catch (t: Throwable) {
                "error: ${t.message}"
              }
            }

            fun write(ctx: Context, rel: String, content: String, append: Boolean): String {
              val f = resolve(ctx, rel) ?: return "error: path is outside the workspace"
              return try {
                f.parentFile?.mkdirs()
                if (append) f.appendText(content) else f.writeText(content)
                "ok: wrote ${content.length} chars to ${f.name}"
              } catch (t: Throwable) {
                "error: ${t.message}"
              }
            }
          }
