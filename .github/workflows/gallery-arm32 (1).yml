          cat > "$BASE/foundation/PreviewSupport.kt" <<'KT'
          package com.google.ai.edge.gallery.foundation

          import android.app.Activity
          import android.content.Context
          import android.content.ContextWrapper
          import android.content.Intent
          import java.io.File

          /** Finds HTML/SVG in a model reply and opens it in the preview window (PreviewActivity). */
          object PreviewSupport {
            @Volatile var html: String = ""
            @Volatile var url: String = ""

            private val fenced = Regex("(?s)```[ \\t]*(html?|svg)[^\\n]*\\n(.*?)(```|\\z)", RegexOption.IGNORE_CASE)
            private const val META = "<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">"

            private fun withViewport(h: String): String {
              if (h.contains("viewport", ignoreCase = true)) return h
              val m = Regex("<head[^>]*>", RegexOption.IGNORE_CASE).find(h) ?: return h
              val at = m.range.last + 1
              return h.substring(0, at) + META + h.substring(at)
            }

            /** The page to preview, or null when the text holds no HTML or SVG worth showing. */
            fun extractHtml(text: String): String? {
              val blocks = fenced.findAll(text).map { Pair(it.groupValues[1].lowercase(), it.groupValues[2].trim()) }.toList()
              val best = blocks.filter { it.second.length >= 30 }.maxByOrNull { it.second.length }
              if (best != null) {
                return if (best.first == "svg" || best.second.startsWith("<svg", ignoreCase = true))
                  "<!doctype html><html><head>" + META + "</head><body style=\"margin:0;background:#fff\">" + best.second + "</body></html>"
                else withViewport(best.second)
              }
              val i = text.indexOf("<!doctype html", ignoreCase = true)
              if (i >= 0 && text.length - i >= 60) return withViewport(text.substring(i))
              return null
            }

            private fun activityOf(ctx: Context): Activity? {
              var c: Context? = ctx
              while (c is ContextWrapper) {
                if (c is Activity) return c
                c = c.baseContext
              }
              return null
            }

            private fun launch(ctx: Context) {
              val i = Intent().setClassName(ctx.packageName, "com.google.ai.edge.gallery.foundation.PreviewActivity")
              val act = activityOf(ctx)
              if (act != null) act.startActivity(i)
              else {
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                ctx.applicationContext.startActivity(i)
              }
            }

            fun openHtml(ctx: Context, page: String) {
              html = page
              url = ""
              try {
                val f = File(ctx.cacheDir, "preview/last.html")
                f.parentFile?.mkdirs()
                f.writeText(page)
              } catch (_: Throwable) {}
              launch(ctx)
            }

            /** target: a workspace file path, or http://127.0.0.1:PORT / https://... */
            fun openTarget(ctx: Context, target: String): String {
              val t = target.trim()
              val local = Regex("^http://(127\\.0\\.0\\.1|localhost)(:\\d+)?(/.*)?$")
              if (local.matches(t) || t.startsWith("https://")) {
                html = ""
                url = t
                launch(ctx)
                return "opened $t in the preview window"
              }
              if (t.startsWith("http://")) return "error: only http://127.0.0.1 or http://localhost (or https) can be previewed"
              val f = Workspace.resolve(ctx, t) ?: return "error: path is outside the workspace"
              if (!f.isFile) return "error: file not found in workspace: $t"
              openHtml(ctx, f.readText())
              return "opened $t in the preview window"
            }
          }
          KT
