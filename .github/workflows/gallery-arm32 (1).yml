          package com.google.ai.edge.gallery.mods

          import android.content.Context
          import java.io.File

          /**
           * Hot-loads native mods (.so, armeabi-v7a) dropped into <app external files>/mods without a
           * rebuild or reinstall. Each file is copied into the app's private storage first and loaded from
           * there with System.load (dlopen), because external storage can be mounted noexec.
           * Note: a library that is already loaded keeps running until the app restarts.
           */
          object ModLoader {
            fun modsDir(ctx: Context): File = File(ctx.getExternalFilesDir(null) ?: ctx.filesDir, "mods").apply { mkdirs() }

            private fun isArm32Elf(f: File): Boolean =
              try {
                f.inputStream().use { s ->
                  val h = ByteArray(20)
                  s.read(h) == 20 &&
                    h[0] == 0x7f.toByte() && h[1] == 'E'.code.toByte() && h[2] == 'L'.code.toByte() &&
                    h[3] == 'F'.code.toByte() && h[4].toInt() == 1 && // 32-bit
                    h[18].toInt() == 40 // EM_ARM
                }
              } catch (_: Throwable) {
                false
              }

            fun loadAll(ctx: Context): List<String> {
              val dir = modsDir(ctx)
              val run = File(ctx.filesDir, "mods_run").apply { mkdirs() }
              val log = StringBuilder()
              val loaded = mutableListOf<String>()
              dir.listFiles { f -> f.isFile && f.extension == "so" }?.sortedBy { it.name }?.forEach { src ->
                try {
                  if (!isArm32Elf(src)) {
                    log.append("SKIP ${src.name}: not a 32-bit ARM ELF\n")
                    return@forEach
                  }
                  val dst = File(run, src.name)
                  if (!dst.exists() || dst.length() != src.length() || dst.lastModified() < src.lastModified()) {
                    src.copyTo(dst, overwrite = true)
                  }
                  System.load(dst.absolutePath)
                  loaded.add(src.name)
                  log.append("OK   ${src.name}\n")
                } catch (t: Throwable) {
                  log.append("FAIL ${src.name}: ${t.message}\n")
                }
              }
              try {
                File(dir, "mod_loader.log").writeText(log.toString())
              } catch (_: Throwable) {}
              return loaded
            }
          }
