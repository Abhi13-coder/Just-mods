          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.OutlinedTextField
          import androidx.compose.material3.Text
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.viewinterop.AndroidView
          import java.io.File

          /**
           * Preview window: shows HTML the model wrote (Run / Preview button in chat), a workspace file, or a
           * web server running inside the sandbox (python3 -m http.server 8000 &, then http://127.0.0.1:8000).
           */
          class PreviewActivity : ComponentActivity() {
            private var web: WebView? = null

            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              setContent { MaterialTheme(colorScheme = darkColorScheme()) { Screen() } }
              onBackPressedDispatcher.addCallback(
                this,
                object : androidx.activity.OnBackPressedCallback(true) {
                  override fun handleOnBackPressed() {
                    val w = web
                    if (w != null && w.canGoBack()) w.goBack() else finish()
                  }
                },
              )
            }

            override fun onDestroy() {
              try { web?.destroy() } catch (_: Throwable) {}
              super.onDestroy()
            }

            private fun toast(msg: String) {
              Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
            }

            private fun showHtml(w: WebView, page: String) {
              PreviewSupport.html = page
              w.loadDataWithBaseURL("https://preview.local/", page, "text/html", "utf-8", null)
            }

            private fun go(w: WebView, addr: String) {
              val a = addr.trim()
              if (a.isEmpty()) return
              val bare = Regex("^(localhost|127\\.0\\.0\\.1)(:\\d+)?(/.*)?$")
              when {
                a.startsWith("http://") || a.startsWith("https://") -> w.loadUrl(a)
                bare.matches(a) -> w.loadUrl("http://" + a)
                else -> {
                  val f = Workspace.resolve(this, a)
                  if (f != null && f.isFile) showHtml(w, f.readText()) else toast("Not found in workspace: " + a)
                }
              }
            }

            private fun initialLoad(w: WebView) {
              val u = PreviewSupport.url
              val h = PreviewSupport.html
              if (u.isNotBlank()) {
                w.loadUrl(u)
              } else if (h.isNotBlank()) {
                showHtml(w, h)
              } else {
                val cached = File(cacheDir, "preview/last.html")
                if (cached.isFile) showHtml(w, cached.readText())
              }
            }

            private fun copyHtml() {
              val h = PreviewSupport.html
              if (h.isBlank()) {
                toast("Nothing to copy (this page came from a web address)")
                return
              }
              val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
              cm.setPrimaryClip(ClipData.newPlainText("html", h.takeLast(300000)))
              toast("HTML copied")
            }

            private fun saveHtml() {
              val h = PreviewSupport.html
              if (h.isBlank()) {
                toast("Nothing to save")
                return
              }
              val name = "previews/preview-" + System.currentTimeMillis() + ".html"
              Workspace.write(this, name, h, false)
              toast("Saved to workspace/" + name)
            }

            @Composable
            private fun Screen() {
              var addr by remember { mutableStateOf(PreviewSupport.url) }
              Column(Modifier.fillMaxSize().padding(4.dp)) {
                Row(verticalAlignment = Alignment.CenterVertically) {
                  Button(onClick = { finish() }) { Text("Close") }
                  OutlinedTextField(
                    value = addr,
                    onValueChange = { addr = it },
                    modifier = Modifier.weight(1f).padding(horizontal = 4.dp),
                    singleLine = true,
                    placeholder = { Text("127.0.0.1:8000 or workspace file") },
                  )
                  Button(onClick = { web?.let { go(it, addr) } }) { Text("Go") }
                }
                Row(Modifier.fillMaxWidth().padding(vertical = 4.dp)) {
                  Button(onClick = { web?.reload() }, modifier = Modifier.padding(end = 4.dp)) { Text("Reload") }
                  Button(onClick = { copyHtml() }, modifier = Modifier.padding(end = 4.dp)) { Text("Copy HTML") }
                  Button(onClick = { saveHtml() }) { Text("Save") }
                }
                AndroidView(
                  modifier = Modifier.weight(1f).fillMaxWidth(),
                  factory = { c ->
                    WebView(c).also { w ->
                      w.settings.javaScriptEnabled = true
                      w.settings.domStorageEnabled = true
                      w.settings.allowFileAccess = false
                      w.settings.allowContentAccess = false
                      w.settings.loadWithOverviewMode = true
                      w.settings.useWideViewPort = true
                      w.webViewClient = WebViewClient()
                      w.webChromeClient = WebChromeClient()
                      web = w
                      initialLoad(w)
                    }
                  },
                )
              }
            }
          }
