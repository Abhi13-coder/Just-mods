name: Gallery Android10 ARM32

on:
  workflow_dispatch:
    inputs:
      rebuild_so:
        description: "Force a fresh LiteRT-LM compile even if a saved liblitertlm_jni.so exists in the repo"
        type: boolean
        default: false
      litert_lm_ref:
        description: "LiteRT-LM branch/tag/SHA for both JNI and Kotlin API (default: de80bb14fa4c16c734cd3a8670b7e90f9d4cd156)"
        type: string
        default: "de80bb14fa4c16c734cd3a8670b7e90f9d4cd156"

permissions:
  contents: write

concurrency:
  group: gallery-arm32
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          df -h

      # The saved .so is read from and committed back to Abhi13-coder/Just-mods, whichever repo runs
      # this workflow. Inside Just-mods the built-in token is enough. If you run the workflow from a
      # different repo, add a personal access token (repo scope) as the secret JUST_MODS_TOKEN.
      - name: Checkout Abhi13-coder/Just-mods (holds the saved .so)
        uses: actions/checkout@v4
        with:
          repository: Abhi13-coder/Just-mods
          token: ${{ secrets.JUST_MODS_TOKEN || github.token }}
          path: self
          fetch-depth: 0

      - name: Check for saved liblitertlm_jni.so
        id: chk
        env:
          REBUILD: ${{ inputs.rebuild_so }}
        run: |
          SO=self/prebuilt/armeabi-v7a/liblitertlm_jni.so
          NEED=true
          REPAIR=false
          if [ -s "$SO" ] && file "$SO" | grep -q "ELF 32-bit.*ARM"; then
            echo "Saved .so found:"
            ls -lh "$SO"
            cat self/prebuilt/armeabi-v7a/BUILD_INFO.txt 2>/dev/null || true
            BAD="$(readelf --dyn-syms -W "$SO" 2>/dev/null | awk '$7=="UND" && $5=="GLOBAL"' | grep -E '@LIBC_(R|S|T|U|V|W)( |$)' || true)"
            if [ "$REBUILD" = "true" ]; then
              echo "rebuild_so=true -> compiling from source (the saved .so is only replaced if the new one passes every check)"
            else
              NEED=false
              if [ -n "$BAD" ]; then
                echo "Saved .so needs libc symbols from Android 11+ (it crashes on Android 10):"
                echo "$BAD" | head -12
                echo "-> it will be repaired in place (no Bazel build)"
                REPAIR=true
              else
                echo "Skipping the Bazel compile, going straight to inject + APK build"
              fi
            fi
          else
            echo "No valid saved .so -> compiling from source"
          fi
          echo "need_build=$NEED" >> "$GITHUB_OUTPUT"
          echo "need_repair=$REPAIR" >> "$GITHUB_OUTPUT"

      - name: Checkout Gallery
        uses: actions/checkout@v4
        with:
          repository: google-ai-edge/gallery
          path: gallery
          fetch-depth: 1

      # The Kotlin API must come from the exact same LiteRT-LM revision as the JNI .so.
      - name: Checkout LiteRT-LM 0.20.0 Kotlin API
        uses: actions/checkout@v4
        with:
          repository: google-ai-edge/LiteRT-LM
          ref: ${{ inputs.litert_lm_ref || 'de80bb14fa4c16c734cd3a8670b7e90f9d4cd156' }}
          path: LiteRT-LM-api
          fetch-depth: 1
          sparse-checkout: |
            kotlin/java/com/google/ai/edge/litertlm
          sparse-checkout-cone-mode: true

      - name: Resolve LiteRT-LM API revision
        id: api_revision
        run: |
          SHA="$(git -C LiteRT-LM-api rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Using LiteRT-LM API/JNI revision: $SHA"

      - name: Checkout LiteRT-LM (JNI source, only when rebuilding)
        if: steps.chk.outputs.need_build == 'true'
        uses: actions/checkout@v4
        with:
          repository: google-ai-edge/LiteRT-LM
          ref: ${{ inputs.litert_lm_ref || 'de80bb14fa4c16c734cd3a8670b7e90f9d4cd156' }}
          path: LiteRT-LM
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (NDKs are installed on demand)
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 cmake;3.22.1"

      - name: Preflight - find the NDK static unwinder (fails fast)
        id: pre
        if: steps.chk.outputs.need_build == 'true' || steps.chk.outputs.need_repair == 'true'
        run: |
          set +e
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          FOUND=""
          NDK_V=""
          for V in 28.2.13676358 27.2.12479018 26.3.11579264; do
            if [ ! -d "$ANDROID_HOME/ndk/$V" ]; then
              echo ">>> installing NDK $V"
              yes | "$SDKM" --install "ndk;$V" > "/tmp/sdkmanager-$V.log" 2>&1
            fi
            if [ ! -d "$ANDROID_HOME/ndk/$V" ]; then echo "NDK $V unavailable"; continue; fi
            LLVM="$ANDROID_HOME/ndk/$V/toolchains/llvm/prebuilt/linux-x86_64"
            A="$(find "$LLVM" -name libunwind.a 2>/dev/null | grep -E '/arm/|arm-linux-androideabi' | grep -v -E 'aarch64|arm64' | head -1)"
            echo "NDK $V: ARM32 libunwind.a = ${A:-NOT FOUND}"
            if [ -z "$A" ]; then
              echo "Unwind-related files in this NDK:"
              find "$LLVM" -iname '*unwind*' 2>/dev/null | head -20
              continue
            fi
            DEFINED="$("$LLVM/bin/llvm-nm" -g --defined-only "$A" 2>/dev/null)"
            MISSING=""
            for s in _Unwind_RaiseException _Unwind_Resume _Unwind_Backtrace _Unwind_DeleteException _Unwind_VRS_Get _Unwind_VRS_Set _Unwind_GetDataRelBase _Unwind_GetTextRelBase _Unwind_GetLanguageSpecificData _Unwind_GetRegionStart __gnu_unwind_frame; do
              echo "$DEFINED" | grep -qE " [TW] $s\$" || MISSING="$MISSING $s"
            done
            if [ -n "$MISSING" ]; then
              echo "This libunwind.a does not define:$MISSING"
              continue
            fi
            FOUND="$A"
            NDK_V="$V"
            break
          done
          if [ -z "$FOUND" ]; then
            echo "::error::No installed NDK has a usable static ARM32 libunwind.a (details above). Stopping before the long build."
            exit 1
          fi
          echo "Using NDK $NDK_V with unwinder $FOUND"
          {
            echo "unwind_a=$FOUND"
            echo "ndk_v=$NDK_V"
            echo "ndk_home=$ANDROID_HOME/ndk/$NDK_V"
          } >> "$GITHUB_OUTPUT"

      - name: Install Bazelisk + clang
        if: steps.chk.outputs.need_build == 'true'
        run: |
          sudo curl -L -o /usr/local/bin/bazel \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64
          sudo chmod +x /usr/local/bin/bazel
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq clang libclang-dev lld || true
          bazel version || true

      - name: Restore Bazel caches
        if: steps.chk.outputs.need_build == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: bazel-arm32-v2-${{ github.run_id }}
          restore-keys: |
            bazel-arm32-v2-

      - name: Patch Gallery (minSdk 29 + armeabi-v7a only)
        working-directory: gallery/Android/src
        run: |
          set -e
          sed -i -E 's/minSdk *= *[0-9]+/minSdk = 29/' app/build.gradle.kts
          sed -i -E 's/targetSdk *= *[0-9]+/targetSdk = 29/' app/build.gradle.kts

          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          t = p.read_text()
          if "abiFilters" not in t:
              t = re.sub(r"(defaultConfig\s*\{)", r'\1\n        ndk { abiFilters += listOf("armeabi-v7a") }', t, count=1)
          if "pickFirsts" not in t:
              t = re.sub(r"(android\s*\{)", r'\1\n    packaging { jniLibs { pickFirsts += "**/liblitertlm_jni.so"; keepDebugSymbols += "**/liblitertlm_jni.so"; keepDebugSymbols += "**/libunwindshim.so" } }', t, count=1)
          p.write_text(t)
          print("Patched build.gradle.kts")
          PY

          grep -nE "minSdk|targetSdk|abiFilters|pickFirsts" app/build.gradle.kts || true

      - name: Integrate matching LiteRT-LM Kotlin API source
        working-directory: gallery/Android/src
        env:
          EXPECTED_LITERT_SHA: ${{ inputs.litert_lm_ref || 'de80bb14fa4c16c734cd3a8670b7e90f9d4cd156' }}
        run: |
          set -euo pipefail
          API_DIR="$GITHUB_WORKSPACE/LiteRT-LM-api/kotlin/java/com/google/ai/edge/litertlm"
          DEST="app/src/main/java/com/google/ai/edge/litertlm"
          test -d "$API_DIR"
          ACTUAL_SHA="$(git -C "$GITHUB_WORKSPACE/LiteRT-LM-api" rev-parse HEAD)"
          echo "LiteRT-LM Kotlin API SHA: $ACTUAL_SHA"
          echo "Expected SHA/ref: $EXPECTED_LITERT_SHA"
          mkdir -p "$DEST"
          find "$API_DIR" -maxdepth 1 -type f -name '*.kt' -exec cp -f {} "$DEST/" \;
          COUNT="$(find "$DEST" -maxdepth 1 -type f -name '*.kt' | wc -l)"
          echo "Copied Kotlin API files: $COUNT"
          test "$COUNT" -ge 16

          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("app/build.gradle.kts")
          text = gradle.read_text()

          pattern = r'^\s*implementation\(libs\.litertlm\)\s*\n?'
          text, n = re.subn(pattern, '', text, flags=re.M)

          if n != 1:
              print("LiteRT-LM references found:")
              for line in text.splitlines():
                  if "litertlm" in line.lower():
                      print(repr(line))
              raise SystemExit(f"Expected exactly one dependency declaration, removed {n}")

          gradle.write_text(text)
          print("Removed published LiteRT-LM AAR dependency.")
          PY

          sed -i -E 's/(android \{)/\1\n    configurations.all {\n        exclude(group = "com.google.ai.edge.litertlm", module = "litertlm-android")\n    }/' app/build.gradle.kts
          grep -n "exclude(group" app/build.gradle.kts

      - name: Bundle proot (terminal backend) into jniLibs, resolving its full dependency closure
        working-directory: gallery/Android/src
        run: |
          set -euo pipefail
          WORK=/tmp/proot-bundle
          mkdir -p "$WORK"
          cd "$WORK"

          DEST="$GITHUB_WORKSPACE/gallery/Android/src/app/src/main/jniLibs/armeabi-v7a"
          mkdir -p "$DEST"

          REPO="https://packages.termux.dev/apt/termux-main"

          # Libraries Android itself guarantees at runtime on every device - never fetched from
          # Termux, never bundled. This is the only hand-maintained list in this step; every other
          # dependency (now libtalloc + libandroid-shmem, or whatever proot needs next time Termux
          # changes its build) is discovered automatically below instead of being named here.
          OS_LIBS="libc.so libdl.so liblog.so libm.so libz.so libstdc++.so libc++.so libandroid.so"
          is_os_lib() { for l in $OS_LIBS; do [ "$1" = "$l" ] && return 0; done; return 1; }

          # Debian/Termux pool convention: packages named "libFOO" live under pool/main/<first 4
          # chars>/<pkg>/, everything else under pool/main/<first char>/<pkg>/.
          pool_dir_for() { case "$1" in lib*) echo "${1:0:4}" ;; *) echo "${1:0:1}" ;; esac; }

          extract_data() {  # $1 = dir containing a .deb's "ar x" output -> untars whichever data.tar.* exists
            (cd "$1" && for f in data.tar.xz data.tar.gz data.tar.zst; do
              [ -f "$f" ] && tar xf "$f" && return 0
            done; return 1)
          }

          fetch_pkg_so() {  # $1 = Termux package name, $2 = bare filename wanted -> echoes extracted path
            local pkg="$1" want="$2" dir idx deb
            dir="$(pool_dir_for "$pkg")"
            idx="$(curl -fsSL "$REPO/pool/main/$dir/$pkg/" || true)"
            deb="$(echo "$idx" | grep -oE "${pkg}_[^\"]+_arm\.deb" | sort -V | tail -1 || true)"
            [ -n "$deb" ] || return 1
            curl -fsSL -o "$pkg.deb" "$REPO/pool/main/$dir/$pkg/$deb" || return 1
            mkdir -p "extracted-$pkg"
            (cd "extracted-$pkg" && ar x "../$pkg.deb") || return 1
            extract_data "extracted-$pkg" || return 1
            find "extracted-$pkg" -type f -name "${want}*" | head -1
          }

          # Termux's file -> owning-package index. This is what makes dependency resolution generic:
          # instead of hardcoding "proot needs libtalloc and libandroid-shmem", we look up whoever
          # actually ships each missing .so, for however many of them there turn out to be.
          echo "Fetching Termux's Contents-arm package index..."
          curl -fsSL -o Contents-arm.gz "$REPO/dists/stable/Contents-arm.gz"
          gunzip -kf Contents-arm.gz

          find_package_for() {  # $1 = bare .so filename -> echoes the owning package name (best guess)
            grep -E "/${1//./\\.}[[:space:]]" Contents-arm | awk '{print $NF}' | tr ',' '\n' | sed 's#.*/##' | sort -u | head -1
          }

          # proot itself is the one binary fetched by name; everything it needs is resolved below.
          PROOT_IDX="$(curl -fsSL "$REPO/pool/main/p/proot/")"
          PROOT_DEB="$(echo "$PROOT_IDX" | grep -oE 'proot_[^"]+_arm\.deb' | sort -V | tail -1)"
          test -n "$PROOT_DEB"
          echo "Using $PROOT_DEB"
          curl -fsSL -o proot.deb "$REPO/pool/main/p/proot/$PROOT_DEB"
          mkdir -p extracted-proot
          (cd extracted-proot && ar x ../proot.deb)
          extract_data extracted-proot

          PROOT_BIN="$(find extracted-proot -type f -name proot | head -1)"
          test -n "$PROOT_BIN"
          cp -f "$PROOT_BIN" "$DEST/libproot.so"

          LOADER="$(find extracted-proot -type f -path '*libexec/proot/loader' | head -1)"
          if [ -n "$LOADER" ]; then
            cp -f "$LOADER" "$DEST/libproot-loader.so"
          else
            echo "::warning::proot loader not found in the package"
          fi
          chmod +x "$DEST"/*.so

          # Breadth-first walk of the NEEDED graph: start from whatever's already in jniLibs
          # (libproot.so), and for every dependency that isn't an Android OS lib and isn't already
          # bundled, look up its package in Contents-arm, fetch it, bundle it, then queue ITS
          # dependencies too. Repeats until nothing is left unresolved - so a future proot build
          # that needs a third or fourth Termux library is handled with no change to this script.
          declare -A VISITED=()
          QUEUE=()
          for f in "$DEST"/*.so; do
            for need in $(readelf -d "$f" 2>/dev/null | grep NEEDED | sed -E 's/.*\[(.*)\]/\1/'); do
              QUEUE+=("$need")
            done
          done

          ROUNDS=0
          while [ "${#QUEUE[@]}" -gt 0 ]; do
            ROUNDS=$((ROUNDS + 1))
            if [ "$ROUNDS" -gt 50 ]; then
              echo "::error::dependency resolution did not converge after 50 rounds - likely a cycle or a bad index entry"
              exit 1
            fi
            need="${QUEUE[0]}"
            QUEUE=("${QUEUE[@]:1}")
            [ -n "${VISITED[$need]:-}" ] && continue
            VISITED[$need]=1

            if is_os_lib "$need"; then
              echo "  $need -> provided by Android OS"
              continue
            fi
            if [ -f "$DEST/$need" ]; then
              echo "  $need -> already bundled"
              continue
            fi

            base="$(echo "$need" | sed -E 's/\.so\..*/.so/')"   # libfoo.so.2 -> libfoo.so, for the index lookup
            PKG="$(find_package_for "$base")"
            if [ -z "$PKG" ]; then
              echo "::error::no Termux package in Contents-arm provides $need (needed by proot's dependency chain)"
              exit 1
            fi
            echo "  $need -> package $PKG"

            GOT="$(fetch_pkg_so "$PKG" "$base" || true)"
            if [ -z "$GOT" ]; then
              echo "::error::package $PKG was fetched but does not contain $need after extraction"
              exit 1
            fi
            cp -f "$GOT" "$DEST/$need"
            chmod +x "$DEST/$need"
            echo "  bundled $need (from $PKG) SONAME: $(readelf -d "$DEST/$need" | grep SONAME || echo none)"

            for sub in $(readelf -d "$DEST/$need" 2>/dev/null | grep NEEDED | sed -E 's/.*\[(.*)\]/\1/'); do
              QUEUE+=("$sub")
            done
          done

          ls -lh "$DEST"

          # Final check across every .so now in jniLibs, not just libproot.so directly - confirms the
          # whole closure is actually satisfied before this ever reaches a device.
          echo "Final dependency check (all bundled libraries):"
          MISSING=""
          for f in "$DEST"/*.so; do
            for lib in $(readelf -d "$f" 2>/dev/null | grep NEEDED | sed -E 's/.*\[(.*)\]/\1/'); do
              if [ -f "$DEST/$lib" ] || is_os_lib "$lib"; then
                continue
              fi
              echo "  MISSING $lib (needed by $(basename "$f"))"
              MISSING="$MISSING $lib"
            done
          done
          if [ -n "$MISSING" ]; then
            echo "::error::unresolved native dependencies remain:$MISSING"
            exit 1
          fi
          echo "All native dependencies resolved."

      # jniLibs is the only directory Android marks executable at install time
      # (SELinux W^X policy, Android 10+). useLegacyPackaging forces proot/talloc
      # to be extracted to disk as real files instead of staying zipped in the APK,
      # which is required for them to be exec()able.
      - name: Enable legacy jniLibs packaging (required to exec proot)
        working-directory: gallery/Android/src
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          t = p.read_text()
          if "useLegacyPackaging" not in t:
              t = re.sub(
                  r"(packaging \{ jniLibs \{)",
                  r"\1 useLegacyPackaging = true;",
                  t, count=1,
              )
          p.write_text(t)
          PY
          grep -n "useLegacyPackaging" app/build.gradle.kts || echo "::warning::pattern not found, check packaging block manually"

      - name: Patch LiteRT-LM WORKSPACE (Rust toolchain for ARM32)
        if: steps.chk.outputs.need_build == 'true'
        working-directory: LiteRT-LM
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path("WORKSPACE")
          t = p.read_text()
          t = t.replace(
              '"aarch64-linux-android",\n        "aarch64-apple-ios",',
              '"aarch64-linux-android",\n        "armv7-linux-androideabi",\n        "aarch64-apple-ios",',
              1,
          )
          t = t.replace(
              'SUPPORTED_PLATFORM_TRIPLES + [\n        "x86_64-linux-android",\n    ]',
              'SUPPORTED_PLATFORM_TRIPLES + [\n        t for t in ["armv7-linux-androideabi", "x86_64-linux-android"] if t not in SUPPORTED_PLATFORM_TRIPLES\n    ]',
              1,
          )
          p.write_text(t)
          PY
          grep -n "armv7-linux-androideabi" WORKSPACE
          test "$(grep -c armv7-linux-androideabi WORKSPACE)" -ge 2

      - name: Patch Lfm2DataProcessor for constrained decoding
        if: steps.chk.outputs.need_build == 'true'
        working-directory: LiteRT-LM
        run: |
          cat > /tmp/lfm2_constraint_patch.py <<'PY'
          # Adds working constrained-decoding support to Lfm2DataProcessor, following
          # the same LLGuidance (#else) pattern FunctionGemmaDataProcessor already
          # uses when LITERT_LM_FST_CONSTRAINTS_DISABLED=1 is set.
          import re
          from pathlib import Path

          H = Path("runtime/conversation/model_data_processor/lfm2_data_processor.h")
          CC = Path("runtime/conversation/model_data_processor/lfm2_data_processor.cc")

          # --- header: add constraint_provider_ member + constructor param ---
          h = H.read_text()
          h = h.replace(
              '#include "runtime/conversation/model_data_processor/model_data_processor.h"',
              '#include "runtime/conversation/model_data_processor/model_data_processor.h"\n'
              '#include "runtime/components/constrained_decoding/llg_constraint_provider.h"',
              1,
          )
          h = re.sub(
              r"(explicit Lfm2DataProcessor\()",
              r"explicit Lfm2DataProcessor(\n      std::unique_ptr<ConstraintProvider> constraint_provider,",
              h, count=1,
          )
          h = h.replace(
              "image_preprocessor_(std::move(image_preprocessor)) {}",
              "image_preprocessor_(std::move(image_preprocessor)),\n"
              "        constraint_provider_(std::move(constraint_provider)) {}",
              1,
          )
          h = h.replace(
              "std::unique_ptr<::litert::support::ImagePreprocessor> image_preprocessor_;",
              "std::unique_ptr<::litert::support::ImagePreprocessor> image_preprocessor_;\n"
              "  std::unique_ptr<ConstraintProvider> constraint_provider_;",
              1,
          )
          H.write_text(h)

          # --- .cc: implement Create() and CreateConstraint() for real ---
          cc = CC.read_text()

          old_create = '''absl::StatusOr<std::unique_ptr<Lfm2DataProcessor>> Lfm2DataProcessor::Create(
              Lfm2DataProcessorConfig config, std::optional<Preface> preface,
              const ::litert::support::Tokenizer* tokenizer,
              const std::vector<std::vector<int>>& stop_token_ids,
              bool enable_constrained_decoding) {
            if (enable_constrained_decoding) {
              return absl::FailedPreconditionError(
                  "Constrained decoding is not supported for Lfm2DataProcessor.");
            }
            return absl::WrapUnique(new Lfm2DataProcessor(
                std::move(config), preface, std::make_unique<StbImagePreprocessor>()));
          }

          absl::StatusOr<std::unique_ptr<Constraint>> Lfm2DataProcessor::CreateConstraint(
              const ordered_json& tools) const {
            return absl::FailedPreconditionError(
                "Constrained decoding is not supported for Lfm2DataProcessor.");
          }'''

          new_create = '''absl::StatusOr<std::unique_ptr<Lfm2DataProcessor>> Lfm2DataProcessor::Create(
              Lfm2DataProcessorConfig config, std::optional<Preface> preface,
              const ::litert::support::Tokenizer* tokenizer,
              const std::vector<std::vector<int>>& stop_token_ids,
              bool enable_constrained_decoding) {
            std::unique_ptr<ConstraintProvider> constraint_provider = nullptr;
            if (enable_constrained_decoding) {
              if (tokenizer == nullptr) {
                return absl::InvalidArgumentError(
                    "Tokenizer must not be null when constrained decoding is enabled.");
              }
              LlGuidanceConfig llg_config;
              AddStopTokensAsEosIds(stop_token_ids, llg_config);
              if (llg_config.eos_ids.empty()) {
                auto eos_id = const_cast<::litert::support::Tokenizer*>(tokenizer)
                                  ->TokenToId("<eos>");
                if (eos_id.ok()) {
                  llg_config.eos_ids.push_back(*eos_id);
                }
              }
              llg_config.special_tokens = {config.code_fence_start,
                                            config.code_fence_end};
              auto provider_or =
                  LlgConstraintProvider::Create(*tokenizer, std::move(llg_config));
              if (provider_or.ok()) {
                constraint_provider = std::move(*provider_or);
              } else {
                ABSL_LOG(WARNING) << "Failed to create LlgConstraintProvider for LFM2: "
                                  << provider_or.status();
              }
            }
            return absl::WrapUnique(new Lfm2DataProcessor(
                std::move(constraint_provider), std::move(config), preface,
                std::make_unique<StbImagePreprocessor>()));
          }

          absl::StatusOr<std::unique_ptr<Constraint>> Lfm2DataProcessor::CreateConstraint(
              const ordered_json& tools) const {
            if (constraint_provider_ == nullptr) {
              return nullptr;
            }
            if (!tools.is_array()) {
              return absl::InvalidArgumentError("Tools must be an array.");
            }
            nlohmann::ordered_json functions = nlohmann::ordered_json::array();
            for (const auto& tool : tools) {
              if (tool.contains("function")) {
                functions.push_back(tool["function"]);
              } else {
                functions.push_back(tool);
              }
            }
            LlgConstraintsOptions options;
            options.funcall_format = FuncallFormat::kPython;
            options.constraint_mode = LlgConstraintMode::kTextAndOrFunctionCalls;
            options.code_fence_start = config_.code_fence_start;
            options.code_fence_end = config_.code_fence_end;
            ABSL_ASSIGN_OR_RETURN(std::string lark_grammar,
                                  CreateLarkGrammarForFcToolCalls(functions, options));
            return constraint_provider_->CreateConstraint(
                LlGuidanceConstraintArg{.constraint_type = LlgConstraintType::kLark,
                                        .constraint_string = std::move(lark_grammar)});
          }'''

          assert old_create in cc, "lfm2_data_processor.cc layout changed, patch needs updating"
          cc = cc.replace(old_create, new_create, 1)
          cc = cc.replace(
              '#include "runtime/components/constrained_decoding/constraint.h"',
              '#include "runtime/components/constrained_decoding/constraint.h"\n'
              '#include "runtime/components/constrained_decoding/llg_constraint_provider.h"\n'
              '#include "runtime/components/constrained_decoding/llguidance_schema_utils.h"\n'
              '#include "runtime/components/constrained_decoding/llg_fc_tool_calls.h"\n'
              '#include "runtime/components/tool_use/tool_choice_utils.h"',
              1,
          )
          CC.write_text(cc)
          print("Patched lfm2_data_processor.h and .cc")
          PY
          python3 /tmp/lfm2_constraint_patch.py

      - name: Write helper patch (Gemma constraint provider stub, last-resort fallback)
        if: steps.chk.outputs.need_build == 'true'
        run: |
          cat > /tmp/patch_fst_stub.py <<'PY'
          # The prebuilt libGemmaModelConstraintProvider.so does not exist for 32-bit ARM,
          # so the BUILD select() resolves to nothing and the linker fails.
          # This adds a tiny stub implementation as the select() default.
          from pathlib import Path

          d = Path("runtime/components/constrained_decoding")
          stub = "\n".join([
              "#include <cstdio>",
              'extern "C" {',
              "void* LiteRtLmGemmaModelConstraintProvider_Create(...) {",
              '  fprintf(stderr, "[LiteRT-LM] Gemma constraint provider is stubbed on ARM32\\n");',
              "  return nullptr;",
              "}",
              "void LiteRtLmGemmaModelConstraintProvider_Destroy(void*) {}",
              "void* LiteRtLmGemmaModelConstraintProvider_CreateConstraintFromTools(...) {",
              "  return nullptr;",
              "}",
              "}  // extern C",
              "",
          ])
          (d / "gemma_model_constraint_provider_stub.cc").write_text(stub)

          b = d / "BUILD"
          t = b.read_text()
          if "gemma_model_constraint_provider_stub.cc" in t:
              print("stub already wired")
          else:
              i = t.index('name = "gemma_model_constraint_provider_shared_lib"')
              key = '"//conditions:default": [],'
              j = t.index(key, i)
              t = t[:j] + '"//conditions:default": ["gemma_model_constraint_provider_stub.cc"],' + t[j + len(key):]
              b.write_text(t)
              print("stub wired into BUILD")
          PY

      - name: Build LiteRT-LM JNI (auto-patch + NDK fallbacks)
        id: build
        if: steps.chk.outputs.need_build == 'true'
        working-directory: LiteRT-LM
        run: |
          cat > /tmp/build_litert.sh <<'EOS'
          #!/usr/bin/env bash
          set -uo pipefail

          TARGET="//kotlin/java/com/google/ai/edge/litertlm/jni:litertlm_jni"
          # NDK 25 is left out on purpose: its libc++ has no <ranges> (needed by the cxx crate).
          NDKS=("28.2.13676358" "27.2.12479018" "26.3.11579264")
          MAX_TRIES_PER_NDK=4
          DEADLINE=$((200 * 60))
          START=$SECONDS
          LOG=/tmp/bazel.log
          ATTEMPT=/tmp/attempt.log
          ERRS=/tmp/errs.log
          : > "$LOG"
          : > "$ERRS"

          DISK_CACHE="$HOME/.cache/bazel-disk"
          REPO_CACHE="$HOME/.cache/bazel-repo"
          mkdir -p "$DISK_CACHE" "$REPO_CACHE"

          declare -A APPLIED
          EXTRA=()
          NET_RETRIES=0
          BINDGEN_ON=0
          STOP_ALL=0

          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          export LIBCLANG_PATH="$(dirname "$(find /usr/lib -name 'libclang*.so*' 2>/dev/null | head -1)" 2>/dev/null || true)"
          echo "LIBCLANG_PATH=$LIBCLANG_PATH"

          # ---------- proactive Rust filters (applied before the first build) ----------
          flag_exists() { bazel query "$1" >/dev/null 2>&1; }

          add_proactive_rust_flags() {
            # Third-party crates must never fail on lints (Cargo does the same for dependencies).
            local lbl
            for lbl in "@rules_rust//rust/settings:extra_rustc_flag" "@rules_rust//:extra_rustc_flag"; do
              if flag_exists "$lbl"; then
                EXTRA+=("--$lbl=--cap-lints=allow")
                echo ">>> proactive: $lbl --cap-lints=allow"
                break
              fi
            done
            for lbl in "@rules_rust//rust/settings:extra_exec_rustc_flag" "@rules_rust//:extra_exec_rustc_flag"; do
              if flag_exists "$lbl"; then
                EXTRA+=("--$lbl=--cap-lints=allow")
                echo ">>> proactive: $lbl --cap-lints=allow"
                break
              fi
            done
          }

          install_ndk() {
            local v="$1"
            if [ -d "$ANDROID_HOME/ndk/$v" ]; then return 0; fi
            echo ">>> installing NDK $v"
            yes | "$SDKM" --install "ndk;$v" >/tmp/sdkmanager.log 2>&1 || true
            [ -d "$ANDROID_HOME/ndk/$v" ]
          }

          run_build() {
            local ndk_home="$1"
            export ANDROID_NDK_HOME="$ndk_home"
            # LITERT_LM_FST_CONSTRAINTS_DISABLED=1: the Gemma FST constraint provider only ships
            # prebuilt for arm64/x86_64/desktop. This makes the Gemma data processors use the
            # LLGuidance path instead, so no prebuilt library is needed on ARM32.
            local args=(--config=android_arm -c opt
              --define=LITERT_LM_FST_CONSTRAINTS_DISABLED=1
              --disk_cache="$DISK_CACHE"
              --repository_cache="$REPO_CACHE"
              --repo_env=CARGO_BAZEL_REPIN=1
              --repo_env=ANDROID_NDK_HOME="$ndk_home"
              --action_env=LIBCLANG_PATH="$LIBCLANG_PATH")
            if [ "$BINDGEN_ON" = "1" ]; then
              args+=("--action_env=BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi=--target=armv7-linux-androideabi29 --sysroot=$ndk_home/toolchains/llvm/prebuilt/linux-x86_64/sysroot")
            fi
            # Android 10 (API 29) libc does not export the ARM32 unwinder (_Unwind_*, added in
            # Android 11). Link the NDK's static libunwind and hide its symbols.
            local unwind_a
            unwind_a="$(find "$ndk_home/toolchains/llvm/prebuilt/linux-x86_64" -name libunwind.a 2>/dev/null | grep -E '/arm/|arm-linux-androideabi' | grep -v -E 'aarch64|arm64' | head -1)"
            if [ -n "$unwind_a" ]; then
              echo ">>> static unwinder: $unwind_a"
              args+=("--linkopt=-Wl,--whole-archive,$unwind_a,--no-whole-archive" "--linkopt=-Wl,--exclude-libs,libunwind.a")
            else
              echo "!!! libunwind.a for ARM32 not found in this NDK; the .so will need Android 11+"
            fi
            args+=("${EXTRA[@]}")
            echo ">>> bazel build ${args[*]} $TARGET"
            timeout 150m bazel build "${args[@]}" --curses=no --color=no \
              --show_progress_rate_limit=30 --progress_report_interval=60 \
              "$TARGET" 2>&1 | tee "$ATTEMPT"
            local rc=${PIPESTATUS[0]}
            cat "$ATTEMPT" >> "$LOG"
            return $rc
          }

          # Only real error lines (+3 lines of context) are used for matching, so normal
          # progress lines such as "Compiling Rust bin bindgen" can never trigger a filter.
          extract_errors() {
            grep -E -A3 "^ERROR|error:|error\[E|fatal error|undefined symbol|panicked at|Traceback|FATAL" "$ATTEMPT" > "$ERRS" 2>/dev/null || : > "$ERRS"
          }

          # ---------- reactive filters: read the errors, apply a known fix, return 0 if something changed ----------
          apply_filters() {
            local f="$ERRS" changed=1
            extract_errors

            if grep -qE "undefined symbol: LiteRtLmGemma" "$f" && [ -z "${APPLIED[fststub]:-}" ]; then
              APPLIED[fststub]=1; changed=0
              echo ">>> FILTER fststub: constraint provider still missing, wiring a stub implementation into BUILD"
              python3 /tmp/patch_fst_stub.py
            fi

            if grep -qE "No matching toolchains found for types @@?rules_rust//rust:toolchain_type" "$f" && [ -z "${APPLIED[rusttc]:-}" ]; then
              APPLIED[rusttc]=1; changed=0
              echo ">>> FILTER rusttc: missing Rust toolchain, re-checking WORKSPACE triples + enabling resolution debug"
              grep -n "armv7-linux-androideabi" WORKSPACE || echo "!!! WORKSPACE has no armv7 triple"
              EXTRA+=("--toolchain_resolution_debug=@@rules_rust//rust:toolchain_type")
            fi

            if grep -qiE "Digests do not match|lockfile.*(out of date|stale|mismatch)|Please re-?pin|cargo-bazel-lock" "$f" && [ -z "${APPLIED[repin]:-}" ]; then
              APPLIED[repin]=1; changed=0
              echo ">>> FILTER repin: re-pinning crate_index"
              CARGO_BAZEL_REPIN=1 bazel sync --only=crate_index --repo_env=CARGO_BAZEL_REPIN=1 >>"$LOG" 2>&1 || true
            fi

            if grep -qE "undefined reference to .?(__atomic_|__sync_)|cannot find -latomic" "$f" && [ -z "${APPLIED[atomic]:-}" ]; then
              APPLIED[atomic]=1; changed=0
              echo ">>> FILTER atomic: linking libatomic"
              EXTRA+=(--linkopt=-latomic)
            fi

            if grep -qiE "OutOfMemoryError|Cannot allocate memory|signal 9|exit(ed)? (with )?(code )?137" "$f" && [ -z "${APPLIED[oom]:-}" ]; then
              APPLIED[oom]=1; changed=0
              echo ">>> FILTER oom: reducing parallelism"
              EXTRA+=(--jobs=2 "--local_ram_resources=HOST_RAM*.7")
            fi

            if grep -qE "No space left on device" "$f" && [ -z "${APPLIED[disk]:-}" ]; then
              APPLIED[disk]=1; changed=0
              echo ">>> FILTER disk: cleaning outputs"
              bazel clean >>"$LOG" 2>&1 || true
              sudo rm -rf /usr/local/lib/android/sdk/system-images /opt/hostedtoolcache 2>/dev/null || true
              df -h
            fi

            if grep -qiE "Unable to find libclang|couldn't find any valid shared libraries matching|stddef\.h' file not found" "$f" && [ -z "${APPLIED[bindgen]:-}" ]; then
              APPLIED[bindgen]=1; changed=0; BINDGEN_ON=1
              echo ">>> FILTER bindgen: giving bindgen the NDK sysroot for the ARM32 target only"
            fi

            if grep -qiE "Connection (reset|refused|timed out)|Read timed out|Error downloading|503 Service|502 Bad Gateway|Premature EOF|Tunnel connection failed" "$f" && [ "$NET_RETRIES" -lt 3 ]; then
              NET_RETRIES=$((NET_RETRIES + 1)); changed=0
              echo ">>> FILTER network: transient download error, retry $NET_RETRIES/3"
              sleep 20
            fi

            # Rust code that is genuinely wrong for 32-bit cannot be auto-fixed: say so clearly.
            if grep -qE "error\[E0308\]|error\[E0080\]|literal out of range for .usize.|mismatched types" "$f"; then
              echo "!!! 32-BIT RUST SOURCE ERROR (needs a manual patch). First errors:"
              head -40 "$f"
            fi

            return $changed
          }

          # A different NDK only helps when the error is about the toolchain itself.
          ndk_related() {
            grep -qE "file not found|[Uu]nsupported NDK|NDK.*(not found|unsupported|too old|too new)|clang: error: (unknown|unsupported)|error: unknown argument|undefined symbol: (_ZNSt|std::)" "$ERRS"
          }

          find_so() {
            local f SO=""
            for f in $(find -L bazel-bin/kotlin -type f -name "*litertlm_jni*" ! -name "*.params" ! -path "*runfiles*" 2>/dev/null); do
              if file "$f" | grep -q "ELF 32-bit.*ARM"; then SO="$f"; break; fi
            done
            if [ -z "$SO" ]; then
              for f in $(find -L bazel-bin -type f -name "*.so" -size +1M 2>/dev/null); do
                if file "$f" | grep -q "ELF 32-bit.*ARM"; then SO="$f"; break; fi
              done
            fi
            echo "$SO"
          }

          # ---------- main: NDK fallback loop ----------
          FIRST=1
          for V in "${NDKS[@]}"; do
            if (( SECONDS - START > DEADLINE )); then echo "!!! time budget used up"; break; fi
            if ! install_ndk "$V"; then echo "!!! NDK $V unavailable, skipping"; continue; fi
            NDK_HOME="$ANDROID_HOME/ndk/$V"
            echo "=================== NDK $V ==================="
            export ANDROID_NDK_HOME="$NDK_HOME"

            if [ "$FIRST" = "1" ]; then add_proactive_rust_flags; FIRST=0; fi
            if [ "$V" != "${NDKS[0]}" ]; then bazel shutdown >/dev/null 2>&1 || true; bazel clean >/dev/null 2>&1 || true; fi

            for ((i = 1; i <= MAX_TRIES_PER_NDK; i++)); do
              if (( SECONDS - START > DEADLINE )); then break; fi
              echo "--- NDK $V, attempt $i ---"
              if run_build "$NDK_HOME"; then
                SO="$(find_so)"
                if [ -n "$SO" ]; then
                  echo "Selected: $SO"; ls -lh "$SO"; file "$SO"
                  echo "--- NEEDED libraries ---"; readelf -d "$SO" | grep NEEDED || true
                  BAD="$(readelf --dyn-syms -W "$SO" | awk '$7=="UND" && $5=="GLOBAL"' | grep -E '@LIBC_(R|S|T|U|V|W)( |$)' || true)"
                  if [ -n "$BAD" ]; then
                    echo "!!! this .so needs libc symbols from Android 11+ and would crash on Android 10:"
                    echo "$BAD"
                    STOP_ALL=1
                    break 2
                  fi
                  mkdir -p /tmp/armeabi-v7a
                  cp -f "$SO" /tmp/armeabi-v7a/liblitertlm_jni.so
                  echo "$V" > /tmp/ndk-used.txt
                  git rev-parse HEAD > /tmp/litert-lm-sha.txt 2>/dev/null || true
                  find -L bazel-bin/kotlin -type f -name "*litertlm_jni*" > /tmp/all-so.txt 2>/dev/null || true
                  echo "SUCCESS with NDK $V"
                  exit 0
                fi
                echo "!!! build succeeded but no 32-bit ARM .so found"
                find -L bazel-bin -type f -name "*.so" | head -20 > /tmp/all-so.txt
                break
              fi
              echo "!!! build failed (NDK $V, attempt $i). Last lines:"
              grep -E "^ERROR" "$ATTEMPT" | head -15 || true
              tail -n 15 "$ATTEMPT"
              if ! apply_filters; then
                if ndk_related; then
                  echo ">>> no filter matched and the error looks NDK-related, trying the next NDK"
                else
                  echo "!!! no filter matched and the error is NOT NDK-related; other NDKs would fail the same way, stopping"
                  STOP_ALL=1
                fi
                break
              fi
            done
            if [ "$STOP_ALL" = "1" ]; then break; fi
          done

          echo "=================== ALL ATTEMPTS FAILED ==================="
          grep -E "^ERROR" "$LOG" | tail -30
          exit 1
          EOS
          chmod +x /tmp/build_litert.sh
          /tmp/build_litert.sh

      - name: Stop Bazel before caching
        if: always() && steps.chk.outputs.need_build == 'true'
        working-directory: LiteRT-LM
        run: bazel shutdown || true

      - name: Save Bazel caches (even when the build failed)
        if: always() && steps.chk.outputs.need_build == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: bazel-arm32-v2-${{ github.run_id }}

      - name: Stage .so into the repo folder
        id: stage
        if: success() && steps.chk.outputs.need_build == 'true'
        run: |
          set -e
          V="$(cat /tmp/ndk-used.txt)"
          STRIP="$ANDROID_HOME/ndk/$V/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          DEST=self/prebuilt/armeabi-v7a
          mkdir -p /tmp/so-artifacts "$DEST"

          cp -f /tmp/armeabi-v7a/liblitertlm_jni.so /tmp/so-artifacts/liblitertlm_jni.unstripped.so
          cp -f /tmp/armeabi-v7a/liblitertlm_jni.so "$DEST/liblitertlm_jni.so"
          rm -f "$DEST/libunwindshim.so"

          # Strip debug info so the file is small enough to live in git.
          if [ -x "$STRIP" ]; then
            "$STRIP" --strip-unneeded "$DEST/liblitertlm_jni.so" || true
            if ! file "$DEST/liblitertlm_jni.so" | grep -q "ELF 32-bit.*ARM"; then
              echo "strip damaged the file, using the unstripped copy"
              cp -f /tmp/armeabi-v7a/liblitertlm_jni.so "$DEST/liblitertlm_jni.so"
            fi
          fi

          {
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "ndk=$V"
            echo "litert_lm_sha=$(cat /tmp/litert-lm-sha.txt 2>/dev/null || echo unknown)"
            echo "gallery_sha=$(git -C gallery rev-parse HEAD 2>/dev/null || echo unknown)"
            echo "note=FST constraints disabled (LLGuidance path); see attempt log if a stub was used"
            echo "unwinder=static libunwind (Android 10 compatible)"
          } > "$DEST/BUILD_INFO.txt"
          cp -f "$DEST/BUILD_INFO.txt" /tmp/so-artifacts/

          ls -lh "$DEST" /tmp/so-artifacts
          SIZE=$(stat -c%s "$DEST/liblitertlm_jni.so")
          if [ "$SIZE" -gt 95000000 ]; then
            echo "::warning::.so is over 95 MB, too big for a normal git push. It is kept as a workflow artifact only."
            echo "commit=false" >> "$GITHUB_OUTPUT"
          else
            echo "commit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload .so artifact (safety copy)
        if: success() && steps.chk.outputs.need_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: liblitertlm_jni-armeabi-v7a
          path: /tmp/so-artifacts/*
          retention-days: 30

      - name: Commit saved .so to Abhi13-coder/Just-mods
        if: success() && steps.chk.outputs.need_build == 'true' && steps.stage.outputs.commit == 'true'
        continue-on-error: true
        working-directory: self
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f prebuilt/armeabi-v7a
          if git diff --cached --quiet; then
            echo "Saved .so is already up to date"
            exit 0
          fi
          git commit -m "Save ARM32 liblitertlm_jni.so (NDK $(cat /tmp/ndk-used.txt))"
          for i in 1 2 3; do
            BR="$(git rev-parse --abbrev-ref HEAD)"
            if git pull --rebase origin "$BR" && git push origin "HEAD:$BR"; then
              echo "Pushed prebuilt/armeabi-v7a/liblitertlm_jni.so"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::Could not push the .so to Abhi13-coder/Just-mods; use the liblitertlm_jni-armeabi-v7a artifact instead."
          exit 1

      - name: Free Bazel space
        if: always() && steps.chk.outputs.need_build == 'true'
        working-directory: LiteRT-LM
        run: |
          bazel clean --expunge || true
          rm -rf ~/.cache/bazel ~/.cache/bazel-disk ~/.cache/bazel-repo || true
          df -h

      - name: Repair saved .so (no Bazel - static unwinder shim)
        id: repair
        if: steps.chk.outputs.need_repair == 'true'
        env:
          NDK_HOME: ${{ steps.pre.outputs.ndk_home }}
          UNW_A: ${{ steps.pre.outputs.unwind_a }}
        run: |
          set -euo pipefail
          pip install --quiet --break-system-packages patchelf || pip install --quiet patchelf
          patchelf --version
          DEST=self/prebuilt/armeabi-v7a
          SO="$DEST/liblitertlm_jni.so"
          LLVM="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          CLANG="$LLVM/bin/armv7a-linux-androideabi29-clang"
          test -x "$CLANG"
          W=/tmp/repair
          mkdir -p "$W" /tmp/so-artifacts
          cp -f "$SO" "$W/original.so"
          cp -f "$SO" /tmp/so-artifacts/liblitertlm_jni.before-repair.so

          # 1) what the saved .so still needs from Android 11+ libc
          mapfile -t SYMS < <(readelf --dyn-syms -W "$W/original.so" | awk '$7=="UND" && $5=="GLOBAL"' | grep -E '@LIBC_(R|S|T|U|V|W)( |$)' | awk '{print $8}' | sed 's/@.*//' | sort -u)
          echo "Symbols to take over (${#SYMS[@]}): ${SYMS[*]}"
          test "${#SYMS[@]}" -gt 0

          # 2) a tiny library = the NDK's static unwinder + one exported forwarding stub per function.
          #    The unwinder's own symbols are hidden inside libunwind.a, so the stubs get new names
          #    (__shim_Unwind_...) and simply branch to the hidden originals.
          : > "$W/shim.c"
          for s in "${SYMS[@]}"; do
            printf '__attribute__((naked, visibility("default"))) void __shim%s(void) { __asm__ volatile(".hidden %s\\n\\tb %s"); }\n' "$s" "$s" "$s" >> "$W/shim.c"
          done
          head -3 "$W/shim.c"
          "$CLANG" -shared -fPIC -o "$W/libunwindshim.so" -Wl,-soname,libunwindshim.so "$W/shim.c" "$UNW_A"
          file "$W/libunwindshim.so"
          echo "--- shim NEEDED:"; readelf -d "$W/libunwindshim.so" | grep NEEDED || true
          echo "--- unwinder symbols in the shim:"
          readelf -sW "$W/libunwindshim.so" | grep -E "shim_Unwind_(Backtrace|Resume)|__shim__?_?gnu_unwind_frame|[^_]Unwind_Resume" | head -8 || true

          # 3) the shim must export every stub
          for s in "${SYMS[@]}"; do
            readelf --dyn-syms -W "$W/libunwindshim.so" | awk -v s="__shim$s" '$7!="UND" && $8==s {f=1} END{exit !f}' || { echo "::error::the shim does not export __shim$s"; exit 1; }
          done

          # 4) patch the saved .so: drop the Android 11 version tag, then point it at the stubs
          : > "$W/rename.map"
          for s in "${SYMS[@]}"; do echo "$s __shim$s" >> "$W/rename.map"; done
          cp -f "$W/original.so" "$W/patched.so"
          for s in "${SYMS[@]}"; do patchelf --clear-symbol-version "$s" "$W/patched.so"; done
          patchelf --rename-dynamic-symbols "$W/rename.map" "$W/patched.so"
          patchelf --add-needed libunwindshim.so "$W/patched.so"

          # 4) verify
          file "$W/patched.so" | grep -q "ELF 32-bit.*ARM"
          if readelf --dyn-syms -W "$W/patched.so" | awk '$7=="UND" && $5=="GLOBAL"' | grep -E '@LIBC_(R|S|T|U|V|W)( |$)'; then
            echo "::error::the patched .so still needs Android 11+ libc symbols"
            exit 1
          fi
          readelf -d "$W/patched.so" | grep NEEDED
          readelf -d "$W/patched.so" | grep -q "libunwindshim.so"
          if readelf --dyn-syms -W "$W/patched.so" | awk '$7=="UND"' | grep -E ' (_Unwind_|__gnu_unwind_frame)'; then
            echo "::error::the patched .so still references the original unwinder names"
            exit 1
          fi
          test "$(readelf --dyn-syms -W "$W/patched.so" | awk '$7=="UND" && $8 ~ /^__shim_/' | wc -l)" -eq "${#SYMS[@]}"

          # 5) install into the repo folder (committed by the next step)
          cp -f "$W/patched.so" "$SO"
          cp -f "$W/libunwindshim.so" "$DEST/libunwindshim.so"
          {
            echo "repaired_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "repair=patchelf: _Unwind_* now come from libunwindshim.so (static NDK libunwind), Android 10 compatible"
            echo "repair_unwinder=$UNW_A"
          } >> "$DEST/BUILD_INFO.txt"
          cp -f "$DEST/BUILD_INFO.txt" "$DEST/libunwindshim.so" /tmp/so-artifacts/
          ls -lh "$DEST"

      - name: Upload repaired .so (safety copy)
        if: steps.chk.outputs.need_repair == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: liblitertlm_jni-armeabi-v7a-repaired
          path: /tmp/so-artifacts/*
          retention-days: 30

      - name: Commit repaired .so to Abhi13-coder/Just-mods
        if: steps.chk.outputs.need_repair == 'true'
        continue-on-error: true
        working-directory: self
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f prebuilt/armeabi-v7a
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
            exit 0
          fi
          git commit -m "Repair ARM32 liblitertlm_jni.so for Android 10 (static unwinder shim)"
          for i in 1 2 3; do
            BR="$(git rev-parse --abbrev-ref HEAD)"
            if git pull --rebase origin "$BR" && git push origin "HEAD:$BR"; then
              echo "Pushed repaired prebuilt/armeabi-v7a"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::Could not push; use the liblitertlm_jni-armeabi-v7a-repaired artifact instead."
          exit 1

      - name: Verify saved JNI source revision
        run: |
          set -euo pipefail
          EXPECTED="${{ steps.api_revision.outputs.sha }}"
          ACTUAL="$(sed -n 's/^litert_lm_sha=//p' self/prebuilt/armeabi-v7a/BUILD_INFO.txt 2>/dev/null | head -1)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Saved JNI was built from SHA '$ACTUAL', but Kotlin API source is pinned to '$EXPECTED'. Rebuild the JNI with rebuild_so=true and this ref."
            exit 1
          fi

      - name: Inject .so
        run: |
          set -e
          SRC=self/prebuilt/armeabi-v7a/liblitertlm_jni.so
          test -s "$SRC" || { echo "No liblitertlm_jni.so available"; exit 1; }
          mkdir -p gallery/Android/src/app/src/main/jniLibs/armeabi-v7a
          cp -f self/prebuilt/armeabi-v7a/*.so gallery/Android/src/app/src/main/jniLibs/armeabi-v7a/
          ls -R gallery/Android/src/app/src/main/jniLibs/
          cat self/prebuilt/armeabi-v7a/BUILD_INFO.txt 2>/dev/null || true
          rm -rf LiteRT-LM || true
          df -h

      - name: Add crash-log recorder (diagnostic - copies the last crash log to the clipboard)
        run: |
          set -euo pipefail
          SRC=gallery/Android/src/app/src/main
          PKG_DIR="$SRC/java/com/google/ai/edge/gallery/crashlog"
          mkdir -p "$PKG_DIR"
          cat > "$PKG_DIR/CrashLogProvider.kt" <<'KT'
          package com.google.ai.edge.gallery.crashlog

          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.ContentProvider
          import android.content.ContentValues
          import android.content.Context
          import android.database.Cursor
          import android.net.Uri
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.util.Log
          import android.widget.Toast
          import java.io.File

          /**
           * Diagnostic helper added by the ARM32 build workflow.
           *
           * It starts automatically with the app (as a ContentProvider), records uncaught Java
           * exceptions, and on the next launch after any crash (Java or native) it saves the relevant
           * logcat lines to last_crash_log.txt and copies them to the clipboard.
           */
          class CrashLogProvider : ContentProvider() {

            override fun onCreate(): Boolean {
              val ctx = context ?: return true
              val app = ctx.applicationContext ?: ctx
              try {
                val dir = app.getExternalFilesDir(null) ?: app.filesDir
                val previous = Thread.getDefaultUncaughtExceptionHandler()
                Thread.setDefaultUncaughtExceptionHandler { thread, error ->
                  try {
                    File(dir, "java_crash.txt").writeText(Log.getStackTraceString(error))
                  } catch (_: Throwable) {}
                  if (previous != null) {
                    previous.uncaughtException(thread, error)
                  }
                }
                Thread { collect(app, dir) }.start()
              } catch (_: Throwable) {}
              return true
            }

            private fun readLogcat(): List<String> {
              return try {
                val proc =
                  ProcessBuilder("logcat", "-b", "main,crash", "-d", "-v", "threadtime", "-t", "6000")
                    .redirectErrorStream(true)
                    .start()
                val lines = proc.inputStream.bufferedReader().readLines()
                proc.destroy()
                lines
              } catch (_: Throwable) {
                emptyList()
              }
            }

            private fun collect(app: Context, dir: File) {
              try {
                val markers =
                  Regex(
                    "FATAL EXCEPTION|Fatal signal|SIGSEGV|SIGABRT|SIGILL|SIGBUS|SIGFPE|" +
                      "JNI DETECTED ERROR|UnsatisfiedLinkError|NoSuchFieldError|NoSuchMethodError|" +
                      "NoClassDefFoundError|OutOfMemoryError|Abort message"
                  )
                val lines = readLogcat()
                var last = -1
                for (i in lines.indices) {
                  if (markers.containsMatchIn(lines[i])) last = i
                }
                val javaFile = File(dir, "java_crash.txt")
                val javaCrash = if (javaFile.exists()) javaFile.readText() else ""
                if (last < 0 && javaCrash.isEmpty()) return

                val markerText = if (last >= 0) lines[last] else javaCrash.take(200)
                val signature = (markerText + javaCrash.length).hashCode().toString()
                val reportedFile = File(dir, "last_reported_marker.txt")
                if (reportedFile.exists() && reportedFile.readText() == signature) return

                val from = if (last >= 0) maxOf(0, last - 150) else 0
                val to = if (last >= 0) minOf(lines.size, last + 60) else 0
                val sb = StringBuilder()
                sb.append("device: ")
                  .append(Build.MANUFACTURER)
                  .append(' ')
                  .append(Build.MODEL)
                  .append(", android ")
                  .append(Build.VERSION.SDK_INT)
                  .append(", abis ")
                  .append(Build.SUPPORTED_ABIS.joinToString())
                  .append('\n')
                if (javaCrash.isNotEmpty()) {
                  sb.append("---- java crash ----\n").append(javaCrash.take(6000)).append('\n')
                }
                sb.append("---- logcat around the last crash marker ----\n")
                for (i in from until to) {
                  sb.append(lines[i]).append('\n')
                }
                val text = sb.toString()

                File(dir, "last_crash_log.txt").writeText(text)
                reportedFile.writeText(signature)
                javaFile.delete()

                Handler(Looper.getMainLooper()).post {
                  try {
                    val cm = app.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                    cm.setPrimaryClip(ClipData.newPlainText("crash log", text.takeLast(20000)))
                    Toast.makeText(
                        app,
                        "Crash log copied to clipboard. Paste it into the chat.",
                        Toast.LENGTH_LONG,
                      )
                      .show()
                  } catch (_: Throwable) {}
                }
              } catch (_: Throwable) {}
            }

            override fun query(
              uri: Uri,
              projection: Array<String>?,
              selection: String?,
              selectionArgs: Array<String>?,
              sortOrder: String?,
            ): Cursor? = null

            override fun getType(uri: Uri): String? = null

            override fun insert(uri: Uri, values: ContentValues?): Uri? = null

            override fun delete(uri: Uri, selection: String?, selectionArgs: Array<String>?): Int = 0

            override fun update(
              uri: Uri,
              values: ContentValues?,
              selection: String?,
              selectionArgs: Array<String>?,
            ): Int = 0
          }
          KT
          python3 - "$SRC/AndroidManifest.xml" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          t = p.read_text()
          PROVIDER = '        <provider android:name="com.google.ai.edge.gallery.crashlog.CrashLogProvider" android:authorities="${applicationId}.crashlog" android:exported="false" />'
          if "CrashLogProvider" in t:
              print("provider already registered")
          else:
              assert "</application>" in t, "no </application> in manifest"
              t = t.replace("</application>", PROVIDER + "\n    </application>", 1)
              p.write_text(t)
              print("registered CrashLogProvider")
          PY
          grep -n "CrashLogProvider" "$SRC/AndroidManifest.xml"
          test -s "$PKG_DIR/CrashLogProvider.kt"

      # Alpine Linux armv7 mini rootfs is bundled into the APK assets (about 3 MB) and unpacked
      # into the sandbox on first launch of the terminal.
      - name: Download Alpine armv7 rootfs into app assets
        run: |
          set -euo pipefail
          BASE=https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/armv7
          YAML="$(curl -fsSL "$BASE/latest-releases.yaml")"
          FILE="$(echo "$YAML" | grep -oE 'alpine-minirootfs-[0-9.]+-armv7\.tar\.gz' | sort -V | tail -1)"
          test -n "$FILE" || { echo "::error::could not find the Alpine armv7 minirootfs in latest-releases.yaml"; exit 1; }
          echo "Using $FILE"
          mkdir -p /tmp/alpine gallery/Android/src/app/src/main/assets
          curl -fsSL -o "/tmp/alpine/$FILE" "$BASE/$FILE"
          curl -fsSL -o "/tmp/alpine/$FILE.sha256" "$BASE/$FILE.sha256"
          (cd /tmp/alpine && sha256sum -c "$FILE.sha256")
          cp -f "/tmp/alpine/$FILE" gallery/Android/src/app/src/main/assets/alpine-armv7.tar.gz
          ls -lh gallery/Android/src/app/src/main/assets/alpine-armv7.tar.gz

      # 1 GB cap applies to the terminal sandbox only (not model downloads/imports).
      # Mod loader hot-loads .so files from <external files>/mods, no rebuild or reinstall.
      - name: Add terminal screen, sandbox (1 GB cap) and native mod loader
        run: |
          set -euo pipefail
          SRC=gallery/Android/src/app/src/main
          BASE="$SRC/java/com/google/ai/edge/gallery"
          mkdir -p "$BASE/sandbox" "$BASE/mods"
          cat > "$BASE/sandbox/SandboxStorage.kt" <<'KT'
          package com.google.ai.edge.gallery.sandbox

          import android.content.Context
          import java.io.File
          import java.io.IOException
          import java.nio.file.FileVisitResult
          import java.nio.file.Files
          import java.nio.file.Path
          import java.nio.file.SimpleFileVisitor
          import java.nio.file.attribute.BasicFileAttributes

          /** Hard 1 GB limit for the terminal sandbox only. Model downloads and imports are not affected. */
          object SandboxStorage {
            const val MAX_BYTES: Long = 1L * 1024 * 1024 * 1024

            const val FULL_MESSAGE =
              "Sandbox storage is full. The sandbox has only 1 GB. " +
                "Delete something (rm, or remove a package) to install anything new."

            fun rootfs(ctx: Context): File = File(ctx.filesDir, "sandbox/rootfs").apply { mkdirs() }

            /** Bytes used by regular files under [dir]. Symlinks are not followed. */
            fun usedBytes(dir: File): Long {
              var total = 0L
              try {
                Files.walkFileTree(
                  dir.toPath(),
                  object : SimpleFileVisitor<Path>() {
                    override fun visitFile(file: Path, attrs: BasicFileAttributes): FileVisitResult {
                      if (attrs.isRegularFile) total += attrs.size()
                      return FileVisitResult.CONTINUE
                    }

                    override fun visitFileFailed(file: Path, exc: IOException): FileVisitResult =
                      FileVisitResult.CONTINUE
                  },
                )
              } catch (_: Throwable) {}
              return total
            }

            fun isFull(dir: File): Boolean = usedBytes(dir) >= MAX_BYTES

            fun summary(dir: File): String {
              val used = usedBytes(dir)
              return "Sandbox: %d MB of %d MB used".format(used / (1024 * 1024), MAX_BYTES / (1024 * 1024))
            }
          }
          KT
          cat > "$BASE/sandbox/SandboxShell.kt" <<'KT'
          package com.google.ai.edge.gallery.sandbox

          import android.content.Context
          import java.io.File

          /**
           * Runs commands inside the proot sandbox. proot is bundled as libproot.so in jniLibs, which is the
           * only place Android 10+ lets an app exec a binary from. A watchdog enforces the 1 GB cap.
           */
          class SandboxShell(private val ctx: Context) {
            private val rootfs = SandboxStorage.rootfs(ctx)
            private val nativeDir = ctx.applicationInfo.nativeLibraryDir

            private val installLike =
              Regex(
                "\\b(apt|apt-get|apk|pkg|pip3?|npm|yarn|cargo|gem|git\\s+clone|wget|curl)\\b" +
                  ".*\\b(install|add|clone|-o|-O|download)\\b|\\b(wget|curl)\\b"
              )

            /**
             * proot needs libtalloc.so.2, but Android only installs files named lib*.so, so the app ships
             * it as libtalloc.so. This makes a libtalloc.so.2 link to it. A file named libtalloc.so.2
             * or libtalloc.so in <app files>/mods takes priority, so it can be swapped without a rebuild.
             */
            private fun libDir(): File {
              val d = File(ctx.filesDir, "proot-lib").apply { mkdirs() }
              val link = File(d, "libtalloc.so.2")
              val mods = File(ctx.getExternalFilesDir(null) ?: ctx.filesDir, "mods")
              val user =
                listOf("libtalloc.so.2", "libtalloc.so").map { File(mods, it) }.firstOrNull { it.isFile && it.length() > 0 }
              try {
                if (user != null) {
                  if (!link.exists() || link.length() != user.length() || link.lastModified() < user.lastModified()) {
                    link.delete()
                    user.copyTo(link, overwrite = true)
                  }
                } else {
                  val bundled = File(nativeDir, "libtalloc.so")
                  if (bundled.exists() && !(link.exists() && link.canonicalPath == bundled.canonicalPath)) {
                    link.delete()
                    android.system.Os.symlink(bundled.absolutePath, link.absolutePath)
                  }
                }
              } catch (_: Throwable) {}
              return d
            }

            private fun prootArgs(inner: List<String>): List<String> =
              listOf(
                "$nativeDir/libproot.so",
                "--link2symlink",
                "-0",
                "--kill-on-exit",
                "-r", rootfs.absolutePath,
                "-w", "/root",
                "-b", "/dev",
                "-b", "/proc",
                "-b", "/sys",
                "-b", "${com.google.ai.edge.gallery.foundation.Workspace.dir(ctx).absolutePath}:/workspace",
              ) + inner

            /** Starts [inner] in the sandbox. [onOutput] receives output lines and cap messages. */
            fun launch(inner: List<String>, onOutput: (String) -> Unit, onClosed: (() -> Unit)? = null): Process {
              val tmp = File(ctx.cacheDir, "proot-tmp").apply { mkdirs() }
              val pb = ProcessBuilder(prootArgs(inner)).redirectErrorStream(true)
              pb.environment().apply {
                put("PROOT_LOADER", "$nativeDir/libproot-loader.so")
              put("LD_LIBRARY_PATH", libDir().absolutePath + ":" + nativeDir)
                put("PROOT_TMP_DIR", tmp.absolutePath)
                put("HOME", "/root")
                put("PATH", "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin")
                put("TERM", "xterm-256color")
              }
              val proc = pb.start()
              ProcRegistry.add(proc)
              var baseline = SandboxStorage.usedBytes(rootfs)

              Thread {
                  try {
                    proc.inputStream.bufferedReader().forEachLine(onOutput)
                  } catch (_: Throwable) {
                  } finally {
                    ProcRegistry.remove(proc)
                    onClosed?.invoke()
                  }
                }
                .start()

              // Kill the command only if it is growing the sandbox past the cap. Commands that shrink it
              // (rm, remove) keep running even while the sandbox is still over the cap.
              Thread {
                  try {
                    while (proc.isAlive) {
                      Thread.sleep(1000)
                      val used = SandboxStorage.usedBytes(rootfs)
                      if (used < baseline) baseline = used
                      if (used >= SandboxStorage.MAX_BYTES && used > baseline) {
                        proc.destroyForcibly()
                        onOutput(SandboxStorage.FULL_MESSAGE)
                        break
                      }
                    }
                  } catch (_: Throwable) {}
                }
                .start()
              return proc
            }

            /** True (and the caller should print FULL_MESSAGE) when the sandbox is full and [command] would install something. */
            fun refuseIfFull(command: String): Boolean =
              SandboxStorage.isFull(rootfs) && installLike.containsMatchIn(command)

            /** Runs one shell command. Returns the exit code, or 1 if it was refused because the sandbox is full. */
            fun runCommand(command: String, onOutput: (String) -> Unit): Int {
              if (refuseIfFull(command)) {
                onOutput(SandboxStorage.FULL_MESSAGE)
                return 1
              }
              val proc = launch(listOf("/bin/sh", "-c", command), onOutput)
              return proc.waitFor()
            }

            /** Runs one command and returns (exit code, captured output). Output is capped at [maxChars]; the command is killed after [timeoutSec] seconds. */
            fun runCapture(command: String, timeoutSec: Int, maxChars: Int): Pair<Int, String> {
              if (refuseIfFull(command)) return Pair(1, SandboxStorage.FULL_MESSAGE)
              val sb = StringBuilder()
              val closed = java.util.concurrent.CountDownLatch(1)
              val proc =
                launch(
                  listOf("/bin/sh", "-c", command),
                  { line -> synchronized(sb) { if (sb.length < maxChars) sb.append(line).append('\n') } },
                  { closed.countDown() },
                )
              val finished = proc.waitFor(timeoutSec.toLong(), java.util.concurrent.TimeUnit.SECONDS)
              if (!finished) proc.destroyForcibly()
              closed.await(2, java.util.concurrent.TimeUnit.SECONDS)
              val code = if (finished) proc.exitValue() else 124
              val text = synchronized(sb) { sb.toString() }.take(maxChars)
              return Pair(code, if (finished) text else text + "\n[timed out after ${timeoutSec}s]")
            }

            /** Persistent shell for the terminal screen: write command lines to its outputStream. */
            fun openInteractive(onOutput: (String) -> Unit): Process =
              launch(listOf("/bin/sh"), onOutput)
          }
          KT
          cat > "$BASE/sandbox/RootfsInstaller.kt" <<'KT'
          package com.google.ai.edge.gallery.sandbox

          import android.content.Context
          import java.io.File

          /** Unpacks the Alpine armv7 mini rootfs bundled in the APK assets into the sandbox folder. */
          object RootfsInstaller {
            private const val ASSET = "alpine-armv7.tar.gz"

            fun isInstalled(ctx: Context): Boolean = File(SandboxStorage.rootfs(ctx), "bin/busybox").exists()

            private fun manualFile(ctx: Context): File = File(ctx.getExternalFilesDir(null) ?: ctx.filesDir, ASSET)

            private fun fetch(url: String): ByteArray {
              val c = java.net.URL(url).openConnection() as java.net.HttpURLConnection
              c.connectTimeout = 20000
              c.readTimeout = 60000
              return c.inputStream.use { it.readBytes() }
            }

            /** Order: a file you put in the app's files folder, the bundled asset, then a download from Alpine. */
            private fun openRootfs(ctx: Context, log: (String) -> Unit): java.io.InputStream {
              val manual = manualFile(ctx)
              if (manual.isFile && manual.length() > 0) {
                log("Using " + manual.absolutePath)
                return manual.inputStream()
              }
              try {
                return ctx.assets.open(ASSET)
              } catch (_: java.io.FileNotFoundException) {
                log("Rootfs is not bundled in this APK, downloading it from Alpine (about 3 MB)...")
              }
              val base = "https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/armv7"
              val yaml = fetch(base + "/latest-releases.yaml").toString(Charsets.UTF_8)
              val name =
                Regex("alpine-minirootfs-[0-9.]+-armv7\\.tar\\.gz")
                  .findAll(yaml)
                  .map { it.value }
                  .distinct()
                  .maxByOrNull { n ->
                    n.removePrefix("alpine-minirootfs-").removeSuffix("-armv7.tar.gz").split('.')
                      .joinToString(".") { it.padStart(4, '0') }
                  } ?: throw java.io.IOException("could not find the Alpine armv7 minirootfs")
              log("Downloading " + name)
              val bytes = fetch(base + "/" + name)
              manual.writeBytes(bytes)
              return bytes.inputStream()
            }

            fun install(ctx: Context, log: (String) -> Unit): Boolean {
              return try {
                val root = SandboxStorage.rootfs(ctx)
                val tmp = File(ctx.cacheDir, ASSET)
                log("Preparing rootfs...")
                openRootfs(ctx, log).use { i -> tmp.outputStream().use { o -> i.copyTo(o) } }
                log("Unpacking Alpine Linux (armv7)...")
                // Android ships toybox tar; it may exit non-zero on device nodes, so check the result instead.
                val p = ProcessBuilder("/system/bin/tar", "-xzf", tmp.absolutePath, "-C", root.absolutePath)
                  .redirectErrorStream(true).start()
                p.inputStream.bufferedReader().forEachLine { if (it.isNotBlank()) log(it.take(160)) }
                p.waitFor()
                tmp.delete()
                File(root, "etc").mkdirs()
                File(root, "etc/resolv.conf").writeText("nameserver 1.1.1.1\nnameserver 8.8.8.8\n")
                File(root, "root").mkdirs()
                File(root, "tmp").mkdirs()
                val ok = File(root, "bin/busybox").exists()
                log(if (ok) "Rootfs ready. ${SandboxStorage.summary(root)}" else "Rootfs unpack failed.")
                ok
              } catch (t: Throwable) {
                log("Rootfs install error: ${t.message}")
                false
              }
            }
          }
          KT
          cat > "$BASE/sandbox/TerminalActivity.kt" <<'KT'
          package com.google.ai.edge.gallery.sandbox

          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.PaddingValues
          import androidx.compose.foundation.layout.Row
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.fillMaxWidth
          import androidx.compose.foundation.layout.padding
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.rememberLazyListState
          import androidx.compose.foundation.text.KeyboardActions
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.foundation.text.selection.SelectionContainer
          import androidx.compose.material3.Button
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.OutlinedTextField
          import androidx.compose.material3.Text
          import androidx.compose.material3.TextButton
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.LaunchedEffect
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateListOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.input.ImeAction
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.google.ai.edge.gallery.foundation.Audit
          import com.google.ai.edge.gallery.foundation.Workspace
          import java.io.Writer

          /**
           * Line-based terminal for the proot sandbox (no PTY: vim/top style programs will not work).
           * Long-press the output to select text; Copy all / Copy last / Share / Save work on the whole log, and
           * Paste puts the clipboard into the command box (extra lines are joined with "; ").
           */
          class TerminalActivity : ComponentActivity() {
            private val lines = mutableStateListOf<String>()
            private var ready by mutableStateOf(false)
            private var usage by mutableStateOf("")
            private var shell: Process? = null
            private var stdin: Writer? = null
            private val ansi = Regex("\u001B\\[[0-9;?]*[A-Za-z]")

            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              setContent { MaterialTheme(colorScheme = darkColorScheme()) { Screen() } }
              Thread {
                  if (!RootfsInstaller.isInstalled(this)) {
                    append("First run: installing Alpine Linux.")
                    if (!RootfsInstaller.install(this, ::append)) return@Thread
                  }
                  startShell()
                  runOnUiThread { ready = true }
                  while (!isDestroyed) {
                    val s = SandboxStorage.summary(SandboxStorage.rootfs(this))
                    runOnUiThread { usage = s }
                    Thread.sleep(5000)
                  }
                }
                .start()
            }

            private fun append(line: String) {
              runOnUiThread {
                lines.add(ansi.replace(line, ""))
                while (lines.size > 5000) lines.removeAt(0)
              }
            }

            private fun startShell() {
              val proc = SandboxShell(this).openInteractive(::append)
              shell = proc
              stdin = proc.outputStream.bufferedWriter()
              append("Alpine sandbox ready. Type commands, e.g. apk add python3")
              append("Long-press to select text. Copy all / Copy last / Share / Save are above, Paste is next to Run.")
            }

            private fun send(cmd: String) {
              if (cmd.isBlank()) return
              append("# $cmd")
              Audit.logAs(this, "user", "terminal", cmd)
              if (SandboxShell(this).refuseIfFull(cmd)) {
                append(SandboxStorage.FULL_MESSAGE)
                return
              }
              Thread {
                  try {
                    if (shell?.isAlive != true) startShell()
                    stdin?.apply {
                      write(cmd + "\n")
                      flush()
                    }
                  } catch (t: Throwable) {
                    append("Shell error: ${t.message}")
                  }
                }
                .start()
            }

            private fun toast(msg: String) {
              Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
            }

            private fun clipboard(): ClipboardManager = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager

            private fun copyText(label: String, text: String) {
              clipboard().setPrimaryClip(ClipData.newPlainText(label, text.takeLast(300000)))
            }

            private fun copyAll() {
              copyText("terminal", lines.joinToString("\n"))
              toast("Copied " + lines.size + " lines")
            }

            /** The last command and everything it printed. */
            private fun copyLast() {
              val idx = lines.indexOfLast { it.startsWith("# ") }
              val from = if (idx < 0) 0 else idx
              copyText("terminal", lines.drop(from).joinToString("\n"))
              toast("Copied last command and output")
            }

            private fun share() {
              val i = Intent(Intent.ACTION_SEND)
              i.type = "text/plain"
              i.putExtra(Intent.EXTRA_TEXT, lines.joinToString("\n").takeLast(100000))
              startActivity(Intent.createChooser(i, "Share terminal output"))
            }

            private fun saveLog() {
              Workspace.write(this, "terminal-log.txt", lines.joinToString("\n"), false)
              toast("Saved to workspace/terminal-log.txt")
            }

            private fun pasteInto(current: String): String {
              val clip = clipboard().primaryClip
              val t = if (clip != null && clip.itemCount > 0) clip.getItemAt(0).coerceToText(this).toString() else ""
              if (t.isEmpty()) {
                toast("Clipboard is empty")
                return current
              }
              val oneLine = t.replace("\r", "").trim('\n').split('\n').joinToString("; ")
              return current + oneLine
            }

            override fun onDestroy() {
              shell?.destroyForcibly()
              super.onDestroy()
            }

            @Composable
            private fun Mini(label: String, onClick: () -> Unit) {
              TextButton(onClick = onClick, contentPadding = PaddingValues(horizontal = 8.dp)) { Text(label) }
            }

            @Composable
            private fun Screen() {
              var input by remember { mutableStateOf("") }
              val listState = rememberLazyListState()
              LaunchedEffect(lines.size) { if (lines.isNotEmpty()) listState.scrollToItem(lines.size - 1) }
              Column(Modifier.fillMaxSize().background(Color(0xFF0B0F14)).padding(8.dp)) {
                Text(usage, color = Color(0xFF8FA3B5), fontSize = 12.sp)
                Row(Modifier.fillMaxWidth()) {
                  Mini("Copy all") { copyAll() }
                  Mini("Copy last") { copyLast() }
                  Mini("Share") { share() }
                  Mini("Save") { saveLog() }
                  Mini("Clear") { lines.clear() }
                }
                SelectionContainer(Modifier.weight(1f).fillMaxWidth()) {
                  LazyColumn(state = listState, modifier = Modifier.fillMaxSize()) {
                    items(lines.size) { i ->
                      Text(
                        lines[i],
                        color = Color(0xFFE6EDF3),
                        fontFamily = FontFamily.Monospace,
                        fontSize = 12.sp,
                      )
                    }
                  }
                }
                Row(verticalAlignment = Alignment.CenterVertically) {
                  OutlinedTextField(
                    value = input,
                    onValueChange = { input = it },
                    modifier = Modifier.weight(1f),
                    singleLine = true,
                    enabled = ready,
                    placeholder = { Text("command") },
                    textStyle = TextStyle(fontFamily = FontFamily.Monospace),
                    keyboardOptions = KeyboardOptions(imeAction = ImeAction.Send),
                    keyboardActions = KeyboardActions(onSend = { send(input); input = "" }),
                  )
                  Mini("Paste") { input = pasteInto(input) }
                  Button(onClick = { send(input); input = "" }, enabled = ready) { Text("Run") }
                }
              }
            }
          }
