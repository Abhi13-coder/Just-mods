      # Web search / page fetch, file workspace + GUI file picker, embedded WebView browser the
      # agent can drive, a 24/7 foreground AgentService + boot receiver for scheduled jobs, and
      # the Orchestra multi-model bundle system (drop bundle.json + model files under
