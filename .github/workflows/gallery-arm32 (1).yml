          import androidx.compose.material3.Button
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Text
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp

          /**
           * GUI file picker: the person picks any files via the system document picker, they are copied
           * into the shared workspace's inbox/ folder, where the agent's FileTool (listFiles/readFile) can
           * see them. No new permissions needed - OpenMultipleDocuments uses per-URI grants.
           */
          class FilePickerActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              setContent { MaterialTheme(colorScheme = darkColorScheme()) { Screen() } }
            }

            private fun displayName(resolver: ContentResolver, uri: Uri): String {
              resolver.query(uri, null, null, null, null)?.use { c ->
                val i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                if (i >= 0 && c.moveToFirst()) return c.getString(i)
              }
              return uri.lastPathSegment?.substringAfterLast('/') ?: "file-${System.currentTimeMillis()}"
            }

            private fun importUris(uris: List<Uri>): List<String> {
              val results = mutableListOf<String>()
              for (uri in uris) {
                try {
                  contentResolver.takePersistableUriPermission(uri, android.content.Intent.FLAG_GRANT_READ_URI_PERMISSION)
                } catch (_: Throwable) {}
                val name = displayName(contentResolver, uri).ifBlank { "file-${System.currentTimeMillis()}" }
                val rel = "inbox/$name"
                val dest = Workspace.resolve(this, rel) ?: continue
                try {
                  dest.parentFile?.mkdirs()
                  contentResolver.openInputStream(uri)?.use { input -> dest.outputStream().use { out -> input.copyTo(out) } }
                  results.add("$rel (${dest.length()} bytes)")
                } catch (t: Throwable) {
                  results.add("$name: failed - ${t.message}")
                }
              }
              return results
            }

            @Composable
            private fun Screen() {
              var log by remember { mutableStateOf(listOf<String>()) }
              val picker =
                rememberLauncherForActivityResult(ActivityResultContracts.OpenMultipleDocuments()) { uris ->
                  if (uris.isNotEmpty()) log = importUris(uris) + log
                }
              Column(Modifier.fillMaxSize().padding(16.dp)) {
                Text("Files picked here are copied into the agent's workspace inbox/ folder.")
                Button(
                  onClick = { picker.launch(arrayOf("*/*")) },
                  modifier = Modifier.padding(vertical = 12.dp),
                ) { Text("Pick files") }
                LazyColumn(modifier = Modifier.weight(1f).fillMaxWidth()) { items(log) { Text(it) } }
              }
            }
          }
