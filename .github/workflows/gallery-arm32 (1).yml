          package com.google.ai.edge.gallery.foundation

          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager
          import com.google.ai.edge.gallery.sandbox.SandboxShell
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          object JobRunner {
            fun run(ctx: Context, job: Job): String {
              Audit.source = "job:" + job.name
              Audit.log(ctx, "job:" + job.kind, job.payload)
              val result =
                try {
                  when (job.kind) {
                    "shell" -> SandboxShell(ctx).runCapture(job.payload, 300, 8000).second
                    "search" -> Web.searchAsText(job.payload, 8)
                    "fetch" -> Web.fetchText(job.payload, 8000)
                    "agent" -> runAgent(ctx, job)
                    else -> "error: unknown job kind '${job.kind}'"
                  }
                } catch (t: Throwable) {
                  "error: ${t.message ?: t.javaClass.simpleName}"
                }
              val stamp = SimpleDateFormat("yyyyMMdd-HHmm", Locale.US).format(Date())
              val safeName = job.name.replace(Regex("[^A-Za-z0-9_-]"), "_").ifBlank { "job" }
              Workspace.write(ctx, "reports/$safeName-$stamp.txt", result, false)
              Audit.log(ctx, "job:done", job.name + ": " + result.take(500))
              Audit.source = "chat"
              Notifier.result(ctx, job.name, result.take(200))
              return result
            }

            private fun runAgent(ctx: Context, job: Job): String {
              val name = job.bundle.ifBlank { Prefs.activeBundle(ctx) }
              val bundle = Orchestra.load(ctx, name) ?: return "error: bundle '$name' not found in the orchestra folder"
              val prompt =
                if (job.lastResult.isBlank()) job.payload
                else job.payload + "\n\nYour previous result for this job:\n" + job.lastResult.take(1500)
              val agent = HeadlessAgent(ctx, bundle)
              try {
                return agent.run(prompt)
              } finally {
                agent.close()
              }
            }
          }

          /** Foreground service that keeps the job loop alive 24/7. */
          class AgentService : Service() {
            @Volatile private var running = false
            private var worker: Thread? = null
            private var wake: PowerManager.WakeLock? = null

            override fun onBind(intent: Intent?): IBinder? = null

            override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
              Lockdown.sync(this)
              Prefs.setServiceEnabled(this, true)
              startForeground(Notifier.ONGOING_ID, Notifier.ongoing(this, "Agents running", "Waiting for jobs"))
              if (!running) {
                running = true
                if (Prefs.keepAwake(this)) {
                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  wake = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "gallery:agents").apply {
                    setReferenceCounted(false)
                    acquire()
                  }
                }
                worker = Thread { loop() }.also { it.start() }
              }
              return START_STICKY
            }

            private fun loop() {
              while (running) {
                try {
                  val jobs = JobStore.all(this)
                  for (job in jobs) {
                    if (!running) break
                    if (!job.enabled || Lockdown.on) continue
                    if (System.currentTimeMillis() - job.lastRunMs < job.everyMinutes.coerceAtLeast(1) * 60_000L) continue
                    Notifier.updateOngoing(this, "Agents running", "Running: ${job.name}")
                    val result = JobRunner.run(this, job)
                    val latest = JobStore.all(this).firstOrNull { it.id == job.id } ?: continue
                    JobStore.upsert(this, latest.copy(lastRunMs = System.currentTimeMillis(), lastResult = result.take(2000)))
                  }
                  Notifier.updateOngoing(this, "Agents running", "${jobs.count { it.enabled }} active jobs")
                  Thread.sleep(15000)
                } catch (_: InterruptedException) {
                  break
                } catch (_: Throwable) {
                  try { Thread.sleep(15000) } catch (_: InterruptedException) { break }
                }
              }
            }

            override fun onDestroy() {
              running = false
              worker?.interrupt()
              try { wake?.release() } catch (_: Throwable) {}
              super.onDestroy()
            }

            companion object {
              fun start(ctx: Context) {
                val i = Intent(ctx, AgentService::class.java)
                if (Build.VERSION.SDK_INT >= 26) ctx.startForegroundService(i) else ctx.startService(i)
              }

              fun stop(ctx: Context) {
                Prefs.setServiceEnabled(ctx, false)
                ctx.stopService(Intent(ctx, AgentService::class.java))
              }
            }
          }

          /** Restarts the agent service after a reboot if it was on. */
          class BootReceiver : BroadcastReceiver() {
            override fun onReceive(context: Context, intent: Intent?) {
              if (intent?.action == Intent.ACTION_BOOT_COMPLETED && Prefs.serviceEnabled(context)) {
                try { AgentService.start(context) } catch (_: Throwable) {}
              }
            }
          }
