name: Gallery Android10 ARM32

on:
  workflow_dispatch:

env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Gallery
        uses: actions/checkout@v4
        with:
          repository: google-ai-edge/gallery
          path: gallery
          fetch-depth: 1

      - name: Checkout LiteRT-LM
        uses: actions/checkout@v4
        with:
          repository: google-ai-edge/LiteRT-LM
          path: LiteRT-LM
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            ndk;${{ env.NDK_VERSION }}
            cmake;${{ env.CMAKE_VERSION }}

      - name: Install Bazelisk
        run: |
          curl -L -o /usr/local/bin/bazel \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64
          chmod +x /usr/local/bin/bazel
          bazel version

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: \~/.cache/bazel
          key: bazel-\( {{ runner.os }}- \){{ hashFiles('LiteRT-LM/.bazelversion', 'LiteRT-LM/WORKSPACE*') }}

      - name: Patch Gallery (minSdk 29 + armeabi-v7a only)
        working-directory: gallery/Android/src
        run: |
          set -euo pipefail
          # Force minSdk / targetSdk
          sed -i 's/minSdk = 31/minSdk = 29/' app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 29/' app/build.gradle.kts

          # Add abiFilters if missing
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          text = p.read_text()
          if "abiFilters" not in text:
              text = text.replace(
                  'testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"',
                  '''testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
      ndk {
          abiFilters += listOf("armeabi-v7a")
      }'''
              )
              p.write_text(text)
          print("Patched build.gradle.kts")
          PY
          echo "Gallery patches done"

      - name: Build LiteRT-LM for armeabi-v7a
        working-directory: LiteRT-LM
        env:
          ANDROID_NDK_HOME: \( {{ env.ANDROID_HOME }}/ndk/ \){{ env.NDK_VERSION }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          set -euo pipefail
          df -h
          grep -A6 "build:android_arm" .bazelrc

          # Build common targets (ignore individual failures)
          bazel build \
            --config=android_arm \
            --define=xnn_enable_avxvnniint8=false \
            -c opt \
            //kotlin/java/com/google/ai/edge/litertlm:liblitertlm_jni.so \
            //kotlin/java/com/google/ai/edge/litertlm:LiteRtLmJni \
            //runtime/engine:litert_lm_main \
            || true

          bazel build \
            --config=android_arm \
            --define=xnn_enable_avxvnniint8=false \
            -c opt \
            //kotlin/... \
            || true

          echo "=== Searching for .so ==="
          mapfile -t CANDIDATES < <(
            find bazel-bin -type f \( \
              -name 'liblitertlm_jni.so' -o \
              -name '*litertlm*jni*.so' -o \
              -name 'libLiteRt*.so' -o \
              -name '*LiteRtLm*.so' \
            \) 2>/dev/null | head -20
          )

          SO=""
          for f in "${CANDIDATES[@]}"; do
            echo "Candidate: $f"
            if file "$f" 2>/dev/null | grep -qiE 'ELF.*(shared object|dynamically linked)'; then
              SO="$f"
              break
            fi
            SIZE=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$SIZE" -gt 1000000 ]; then
              SO="$f"
              break
            fi
          done

          if [ -z "$SO" ]; then
            echo "ERROR: no usable liblitertlm_jni.so found"
            find bazel-bin -name '*.so' -type f 2>/dev/null | head -50
            df -h
            exit 1
          fi

          echo "Selected: $SO"
          file "$SO" || true
          ls -lh "$SO"
          mkdir -p /tmp/armeabi-v7a
          cp -f "$SO" /tmp/armeabi-v7a/liblitertlm_jni.so
          ls -lh /tmp/armeabi-v7a/

          # Free disk
          rm -rf bazel-bin bazel-out bazel-testlogs 2>/dev/null || true
          FREE_KB=$(df --output=avail / | tail -1 | tr -d ' ')
          if [ "$FREE_KB" -lt 8000000 ]; then
            echo "Low disk – pruning Bazel cache"
            bazel clean --expunge || true
            rm -rf \~/.cache/bazel 2>/dev/null || true
          fi
          df -h

      - name: Inject .so + free space
        run: |
          mkdir -p gallery/Android/src/app/src/main/jniLibs/armeabi-v7a
          cp -f /tmp/armeabi-v7a/liblitertlm_jni.so \
            gallery/Android/src/app/src/main/jniLibs/armeabi-v7a/
          ls -R gallery/Android/src/app/src/main/jniLibs/
          # Drop LiteRT-LM tree to free space
          rm -rf LiteRT-LM 2>/dev/null || true
          df -h

      - name: Build Gallery APK
        working-directory: gallery/Android/src
        run: |
          set -euo pipefail
          chmod +x gradlew || true
          ./gradlew :app:assembleRelease \
            -Pandroid.injected.build.abi=armeabi-v7a \
            --stacktrace \
            --no-daemon \
            | tee build.log

          find app/build/outputs -name "*.apk" | tee /tmp/apk-paths.txt
          APK=$(head -1 /tmp/apk-paths.txt)
          if [ -z "$APK" ]; then
            echo "No APK produced"
            exit 1
          fi
          cp -f "$APK" /tmp/Gallery-Android10-armeabi-v7a.apk
          ls -lh /tmp/Gallery-Android10-armeabi-v7a.apk

      - name: Validate APK
        run: |
          APK=/tmp/Gallery-Android10-armeabi-v7a.apk
          echo "=== Contents check ==="
          unzip -l "$APK" | grep -E 'lib/armeabi-v7a|lib/arm64' || true
          if command -v aapt >/dev/null; then
            aapt dump badging "$APK" | grep -E 'sdkVersion|native-code|package' || true
          fi
          ls -lh "$APK"
          df -h

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gallery-Android10-armeabi-v7a
          path: /tmp/Gallery-Android10-armeabi-v7a.apk
          retention-days: 14

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            gallery/Android/src/build.log
            /tmp/apk-paths.txt
          if-no-files-found: ignore
