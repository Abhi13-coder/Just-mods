name: Gradle Cache

on:
  workflow_dispatch:
    inputs:
      extra_libs:
        description: "Extra libs, space separated: group:artifact:version (kept for future runs)"
        required: false
        default: ""
      repos:
        description: "Extra GitHub repo URLs to build once, space separated (kept for future runs)"
        required: false
        default: ""
      agp:
        description: "Android Gradle Plugin"
        default: "9.2.1"
      kotlin:
        description: "Kotlin version (AGP 9 needs 2.2.10+)"
        default: "2.3.10"
      ksp:
        description: "KSP version"
        default: "2.3.9"
      bom:
        description: "Compose BOM, or auto to let the build pick the newest one that works"
        default: "auto"
      gradle:
        description: "Gradle version (AGP 9.2 needs 9.4.1+)"
        default: "9.4.1"
      api:
        description: "compileSdk"
        default: "36"

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build seed + repos, pack cache
        env:
          AGP: ${{ inputs.agp }}
          KT: ${{ inputs.kotlin }}
          KSP: ${{ inputs.ksp }}
          BOM: ${{ inputs.bom }}
          GRADLE: ${{ inputs.gradle }}
          API: ${{ inputs.api }}
          NEW_LIBS: ${{ inputs.extra_libs }}
          NEW_REPOS: ${{ inputs.repos }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p claude
          touch claude/libs.txt claude/repos.txt

          # remember extra libs / repos for future runs
          for l in $NEW_LIBS;  do echo "$l" >> claude/libs.txt;  done
          for r in $NEW_REPOS; do echo "$r" >> claude/repos.txt; done
          sort -u -o claude/libs.txt claude/libs.txt
          sort -u -o claude/repos.txt claude/repos.txt

          # tools
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$API" "build-tools;36.0.0"
          curl -fL -o /tmp/g.zip "https://services.gradle.org/distributions/gradle-$GRADLE-bin.zip"
          unzip -q /tmp/g.zip -d /opt
          export PATH="/opt/gradle-$GRADLE/bin:$PATH"
          GH="$PWD/gh-home"
          export GRADLE_USER_HOME="$GH"

          # ---------- seed project ----------
          S=seed
          mkdir -p $S/app/src/main/java/seed
          cat > $S/settings.gradle.kts <<EOF
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "seed"
          include(":app")
          EOF
          cat > $S/build.gradle.kts <<EOF
          plugins {
            id("com.android.application") version "$AGP" apply false
            id("org.jetbrains.kotlin.android") version "$KT" apply false
            id("org.jetbrains.kotlin.plugin.compose") version "$KT" apply false
            id("com.google.devtools.ksp") version "$KSP" apply false
          }
          EOF
          printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx3g\nandroid.builtInKotlin=false\nandroid.newDsl=false\n' > $S/gradle.properties
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application/></manifest>' > $S/app/src/main/AndroidManifest.xml
          echo 'package seed
          class Seed' > $S/app/src/main/java/seed/Seed.kt

          cat > $S/app/build.gradle.kts <<EOF
          plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
            id("org.jetbrains.kotlin.plugin.compose")
            id("com.google.devtools.ksp")
          }
          android {
            namespace = "seed.app"
            compileSdk = $API
            defaultConfig { applicationId = "seed.app"; minSdk = 24; targetSdk = $API; versionCode = 1; versionName = "1" }
            buildTypes { release { isMinifyEnabled = true; proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt")) } }
            buildFeatures { compose = true }
            compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
          }
          dependencies {
            val bom = platform("androidx.compose:compose-bom:__BOM__")
            implementation(bom)
            androidTestImplementation(bom)
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.ui:ui-graphics")
            implementation("androidx.compose.ui:ui-tooling-preview")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.compose.material:material-icons-extended:1.7.8")
            debugImplementation("androidx.compose.ui:ui-tooling")
            debugImplementation("androidx.compose.ui:ui-test-manifest")
            implementation("androidx.activity:activity-compose:1.9.2")
            implementation("androidx.navigation:navigation-compose:2.8.0")
            implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.5")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.5")
            implementation("androidx.core:core-ktx:1.13.1")
            implementation("androidx.appcompat:appcompat:1.7.0")
            implementation("com.google.android.material:material:1.12.0")
            implementation("androidx.constraintlayout:constraintlayout:2.1.4")
            implementation("androidx.recyclerview:recyclerview:1.3.2")
            implementation("androidx.datastore:datastore-preferences:1.1.1")
            implementation("androidx.work:work-runtime-ktx:2.9.1")
            implementation("androidx.media3:media3-exoplayer:1.4.1")
            implementation("androidx.media3:media3-ui:1.4.1")
            implementation("androidx.room:room-runtime:2.6.1")
            implementation("androidx.room:room-ktx:2.6.1")
            ksp("androidx.room:room-compiler:2.6.1")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
            implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.2")
            implementation("com.squareup.retrofit2:retrofit:2.11.0")
            implementation("com.squareup.retrofit2:converter-gson:2.11.0")
            implementation("com.squareup.okhttp3:okhttp:4.12.0")
            implementation("com.google.code.gson:gson:2.11.0")
            implementation("io.coil-kt:coil-compose:2.7.0")
            implementation("com.google.mediapipe:tasks-genai:0.10.14")
            testImplementation("junit:junit:4.13.2")
            androidTestImplementation("androidx.test.ext:junit:1.2.1")
            androidTestImplementation("androidx.test.espresso:espresso-core:3.6.1")
          }
          EOF

          # extra libs from libs.txt
          echo 'dependencies {' >> $S/app/build.gradle.kts
          while read -r l; do
            [ -n "$l" ] && echo "  implementation(\"$l\")" >> $S/app/build.gradle.kts
          done < claude/libs.txt
          echo '}' >> $S/app/build.gradle.kts

          # ---------- pick Compose BOM automatically ----------
          sed -i "s|compose-bom:__BOM__|compose-bom:${BOM/auto/0}|" $S/app/build.gradle.kts
          if [ "$BOM" = "auto" ]; then
            curl -fsL "https://dl.google.com/android/maven2/androidx/compose/compose-bom/maven-metadata.xml" \
              | grep -o '<version>[0-9.]*</version>' | sed 's/<[^>]*>//g' | sort -r | head -10 > boms.txt
            echo "Candidate BOMs (newest first):"; cat boms.txt
            PICKED=""
            for v in $(cat boms.txt); do
              sed -i "s|compose-bom:[^\"]*|compose-bom:$v|" $S/app/build.gradle.kts
              if (cd $S && gradle :app:checkDebugAarMetadata --no-daemon -q >/dev/null 2>&1); then
                echo "BOM $v works with compileSdk $API"; PICKED="$v"; break
              else
                echo "BOM $v does not fit, trying older"
              fi
            done
            [ -z "$PICKED" ] && { echo "No Compose BOM fit compileSdk $API"; exit 1; }
            BOM="$PICKED"
          fi

          (cd $S && gradle assembleDebug assembleRelease --no-daemon --stacktrace)

          # ---------- user repos (failures are OK) ----------
          while read -r url; do
            [ -z "$url" ] && continue
            echo "== building $url"
            d="repo-$(basename "$url" .git)"
            git clone --depth 1 "$url" "$d" || continue
            (cd "$d"
             if [ -x ./gradlew ]; then ./gradlew assembleDebug --no-daemon || echo "FAILED: $url"
             else gradle assembleDebug --no-daemon || echo "FAILED: $url"; fi)
          done < claude/repos.txt

          # ---------- pack ----------
          mkdir -p out
          tar -czf out/gradle-cache.tar.gz -C "$GH" caches/modules-2
          SIZE=$(stat -c%s out/gradle-cache.tar.gz)
          ls -lh out
          if [ "$SIZE" -gt $((1900*1024*1024)) ]; then
            split -b 1900M -d out/gradle-cache.tar.gz out/gradle-cache.tar.gz.part
            rm out/gradle-cache.tar.gz
          fi

          TAG="claude-tools"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" -t "Claude build toolchain" -n "JDK, SDK parts, NDK, Gradle, dependency cache"
          # drop old cache assets (single vs split)
          for a in $(gh release view "$TAG" --json assets --jq '.assets[].name' | grep '^gradle-cache' || true); do
            gh release delete-asset "$TAG" "$a" -y
          done
          gh release upload "$TAG" --clobber out/*

          # ---------- helper script + info ----------
          cat > claude/setup-cache.sh <<'SETUP'
          #!/bin/bash
          # usage: bash setup-cache.sh [dir]   (run after setup.sh)
          set -e
          B="https://github.com/__REPO__/releases/download/claude-tools"
          D="${1:-$HOME/android}"
          mkdir -p "$D/gradle-home"
          if curl -fsIL "$B/gradle-cache.tar.gz" >/dev/null; then
            curl -fL "$B/gradle-cache.tar.gz" | tar -xz -C "$D/gradle-home"
          else
            for i in 00 01 02 03; do curl -fL "$B/gradle-cache.tar.gz.part$i" || break; done | tar -xz -C "$D/gradle-home"
          fi
          echo "org.gradle.offline=true" > "$D/gradle-home/gradle.properties"
          echo "export GRADLE_USER_HOME=$D/gradle-home" >> "$D/env.sh"
          echo "Done. source $D/env.sh then run gradle --offline"
          SETUP
          sed -i "s|__REPO__|$GITHUB_REPOSITORY|" claude/setup-cache.sh
          {
            echo "agp=$AGP"; echo "kotlin=$KT"; echo "ksp=$KSP"; echo "compose_bom=$BOM"
            echo "gradle=$GRADLE"; echo "compileSdk=$API"; echo "built=$(date -u +%F)"
            echo "cache_bytes=$SIZE"
          } > claude/cache-info.txt

          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add claude
          git commit -m "claude: gradle cache" || true
          git pull --rebase
          git push
          echo "cache script: https://raw.githubusercontent.com/$GITHUB_REPOSITORY/HEAD/claude/setup-cache.sh" >> "$GITHUB_STEP_SUMMARY"
