name: Gallery Android10 ARM32

on:
  workflow_dispatch:

env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          df -h

      - name: Checkout Gallery
        uses: actions/checkout@v4
        with:
          repository: google-ai-edge/gallery
          path: gallery
          fetch-depth: 1

      - name: Checkout LiteRT-LM
        uses: actions/checkout@v4
        with:
          repository: google-ai-edge/LiteRT-LM
          path: LiteRT-LM
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ndk;28.2.13676358 cmake;3.22.1"

      - name: Install Bazelisk
        run: |
          sudo curl -L -o /usr/local/bin/bazel \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64
          sudo chmod +x /usr/local/bin/bazel
          bazel version || true

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('LiteRT-LM/.bazelversion', 'LiteRT-LM/WORKSPACE*') }}

      - name: Patch Gallery (minSdk 29 + armeabi-v7a only)
        working-directory: gallery/Android/src
        run: |
          set -e
          sed -i -E 's/minSdk *= *[0-9]+/minSdk = 29/' app/build.gradle.kts
          sed -i -E 's/targetSdk *= *[0-9]+/targetSdk = 29/' app/build.gradle.kts

          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          t = p.read_text()
          if "abiFilters" not in t:
              t = re.sub(r"(defaultConfig\s*\{)", r'\1\n        ndk { abiFilters += listOf("armeabi-v7a") }', t, count=1)
          if "pickFirsts" not in t:
              t = re.sub(r"(android\s*\{)", r'\1\n    packaging { jniLibs { pickFirsts += "**/liblitertlm_jni.so" } }', t, count=1)
          p.write_text(t)
          print("Patched build.gradle.kts")
          PY

          grep -nE "minSdk|targetSdk|abiFilters|pickFirsts" app/build.gradle.kts || true

      - name: Build LiteRT-LM for armeabi-v7a
        working-directory: LiteRT-LM
        run: |
          set -e
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          export ANDROID_SDK_HOME="$ANDROID_HOME"
          echo "NDK: $ANDROID_NDK_HOME"
          ls "$ANDROID_NDK_HOME" | head -3
          df -h
          grep -A6 "build:android_arm" .bazelrc || true

          BUILT=0
          for T in \
            //kotlin/java/com/google/ai/edge/litertlm:liblitertlm_jni.so \
            //kotlin/java/com/google/ai/edge/litertlm:LiteRtLmJni \
            //runtime/engine:litert_lm_main
          do
            echo "=== Trying $T ==="
            if bazel build --config=android_arm --define=xnn_enable_avxvnniint8=false -c opt "$T" 2>&1 | tee -a /tmp/bazel.log; then
              if [ "${PIPESTATUS[0]}" = "0" ]; then
                BUILT=1
                break
              fi
            fi
          done

          if [ "$BUILT" != "1" ]; then
            echo "ERROR: all Bazel targets failed, see bazel.log artifact"
            exit 1
          fi

          echo "=== Searching for .so ==="
          find bazel-bin -type f -name "*.so" | tee /tmp/all-so.txt

          SO=""
          if [ -f bazel-bin/kotlin/java/com/google/ai/edge/litertlm/liblitertlm_jni.so ]; then
            SO="bazel-bin/kotlin/java/com/google/ai/edge/litertlm/liblitertlm_jni.so"
          fi
          if [ -z "$SO" ]; then
            SO=$(find bazel-bin -type f \( -name "liblitertlm_jni.so" -o -name "*litertlm*jni*.so" \) | head -1)
          fi
          if [ -z "$SO" ]; then
            SO=$(find bazel-bin -type f -name "*.so" -size +1M | head -1)
          fi
          if [ -z "$SO" ] || [ ! -f "$SO" ]; then
            echo "ERROR: no usable .so found"
            exit 1
          fi

          echo "Selected: $SO"
          ls -lh "$SO"
          file "$SO" || true

          mkdir -p /tmp/armeabi-v7a
          cp -f "$SO" /tmp/armeabi-v7a/liblitertlm_jni.so
          ls -lh /tmp/armeabi-v7a/

      - name: Free Bazel space
        if: always()
        working-directory: LiteRT-LM
        run: |
          bazel clean --expunge || true
          rm -rf ~/.cache/bazel || true
          df -h

      - name: Inject .so
        run: |
          mkdir -p gallery/Android/src/app/src/main/jniLibs/armeabi-v7a
          cp -f /tmp/armeabi-v7a/liblitertlm_jni.so gallery/Android/src/app/src/main/jniLibs/armeabi-v7a/
          ls -R gallery/Android/src/app/src/main/jniLibs/
          rm -rf LiteRT-LM || true
          df -h

      - name: Build Gallery APK
        working-directory: gallery/Android/src
        run: |
          set -eo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            -Pandroid.injected.build.abi=armeabi-v7a \
            --stacktrace \
            --no-daemon 2>&1 | tee build.log

          find app/build/outputs -name "*.apk" | tee /tmp/apk-paths.txt
          APK=$(head -1 /tmp/apk-paths.txt)
          if [ -z "$APK" ]; then
            echo "No APK produced"
            exit 1
          fi
          cp -f "$APK" /tmp/Gallery-Android10-armeabi-v7a.apk
          ls -lh /tmp/Gallery-Android10-armeabi-v7a.apk

      - name: Validate APK
        run: |
          APK=/tmp/Gallery-Android10-armeabi-v7a.apk
          unzip -l "$APK" | grep -E "lib/armeabi-v7a|lib/arm64" || true
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -E "sdkVersion|native-code|package" || true
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gallery-Android10-armeabi-v7a
          path: /tmp/Gallery-Android10-armeabi-v7a.apk
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            gallery/Android/src/build.log
            /tmp/apk-paths.txt
            /tmp/bazel.log
            /tmp/all-so.txt
          if-no-files-found: ignore
